<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>BlueCoatThemeListItemComponentTokensProvider</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="A class which wraps all component tokens for list item components like `MISOListItem`. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a `AllListItemComponentTokensProvider` implementation inside `MISOTheme` so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an `MISOTheme` implementation to use. It implements also the protocol `ListItemComponentTokens` so as to expose the component tokens for list item components through any `MISOTheme`. Such component tokens are defined with raw and semantic tokens of sizes (from `AllSizeSemanticTokensProvider`), borders (from `AllBorderSemanticTokensProvider`), colors (from `AllColorSemanticTokensProvider`), spaces (from `AllSpaceSemanticTokensProvider`), opacities (from `AllOpacitySemanticTokensProvider`) and dimensions (from `AllDimensionSemanticTokensProvider`)." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Theme BlueCoat</a></li><li>BlueCoatThemeListItemComponentTokensProvider</li></ul><p>Class</p><h1>BlueCoatThemeListItemComponentTokensProvider</h1><p>A class which wraps all <b>component tokens</b> for list item components like <code>MISOListItem</code>. Contains also references to semantic tokens providers so
