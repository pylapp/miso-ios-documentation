<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>Theme BlueCoat</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="This BlueCoat theme is a theme for some specific usages, like for prototyping and design of journeys without any brand-charted theme." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li>Theme BlueCoat</li></ul><p>Framework</p><h1>Theme BlueCoat</h1><p>This BlueCoat theme is a theme for some specific usages, like for prototyping and design of journeys without any brand-charted theme.</p></section><h2>Overview</h2><pre><code>🧬 Theme version: 2.7.0
</code></pre><blockquote class="aside note"><p class="label">Note</p><p>The BlueCoat theme uses the Shantell Sans font family</p></blockquote><blockquote class="aside important"><p class="label">Important</p><p>The BlueCoat theme does not embed charts colors yet, and is read only: it cannot be suclassed or derivated.</p></blockquote><h2>How to use the theme</h2><p>You can use <a href="bluecoattheme/index.html"><code>BlueCoatTheme</code></a> directly. To use the <a href="bluecoattheme/index.html"><code>BlueCoatTheme</code></a> without further modifications, you will have to use the <code>MISOThemeableView</code> for your root view and give it an instance of <a href="bluecoattheme/index.html"><code>BlueCoatTheme</code></a>. Keep in mind the themes are <i>Swift class objects</i> and can be heavy, so you may use only as instance as singleton and not store any properties.</p><pre class="swift"><code>@main
struct YourApp: App {
    var body: some Scene {
        WindowGroup {
            MISOThemeableView(theme: BlueCoatTheme()) {
                // Your root view
            }
        }
    }
}
</code></pre><p>Then, in your views, you can simply use the theme through an environment variable to get the tokens:</p><pre class="swift"><code>struct SomeView: View {

    // Get MISO environment variable for theme thanks to themeable view
    @Environment(\.theme) var theme
    
    var body: some View {
        
        // Use the theme to retrieve the tokens
        // For spaces: theme.spaces
        // For sizes: theme.sizes
        // For borders: theme.borders
        // For elevations: theme.elevations
        // For opacities: theme.opacities
        // For colors: theme.colors
        // For button configuration: theme.button
        // For link configuration: theme.link
        // Etc.
    }
}
</code></pre><h2>How to tune the theme</h2><p>You cannot tune the BlueCoat theme.</p><h2>Typography</h2><p>The BlueCoat theme uses the Shantell Sans font family and must not use others.</p><h2>How to enrich the theme</h2><p>You cannot derivate the <i>BlueCoat</i> theme.</p><h2>How it looks like</h2><h3>Actions</h3><p><picture><img alt="A button component in light and dark modes with BlueCoat theme" decoding="async" loading="lazy" src="../../volumes/personnel/3_projets/miso-ios/miso/core/miso/themes/bluecoat/sources/_misothemesbluecoat.docc/resources/actions/button/component_button_bluecoat.png"/></picture></p><h3>Content display</h3><h4>Bullet list</h4><p><picture><img alt="A bullet list component in light and dark modes with BlueCoat theme" decoding="async" loading="lazy" src="../../volumes/personnel/3_projets/miso-ios/miso/core/miso/themes/bluecoat/sources/_misothemesbluecoat.docc/resources/contentdisplay/bulletlist/component_bullet_list_bluecoat.png"/></picture></p><h3>Controls</h3><h4>Checkboxes</h4><h4>Radios</h4><h4>Switches</h4><h4>Chips</h4><h4>Text input</h4><p><picture><img alt="A text input component in light and dark modes with BlueCoat theme" decoding="async" loading="lazy" src="../../volumes/personnel/3_projets/miso-ios/miso/core/miso/themes/bluecoat/sources/_misothemesbluecoat.docc/resources/controls/textinputs/component_textinput_bluecoat.png"/></picture></p><h3>Indicators</h3><h4>Badge</h4><h4>Tags</h4><h3>Layouts</h3><h4>Dividers</h4><h3>Navigations</h3><h4>Link</h4><p><picture><img alt="A link component in light and dark modes with BlueCoat theme" decoding="async" loading="lazy" src="../../volumes/personnel/3_projets/miso-ios/miso/core/miso/themes/bluecoat/sources/_misothemesbluecoat.docc/resources/navigations/link/component_link_bluecoat.png"/></picture></p><h4>Tab bar</h4><h4>List item</h4><h4>Tool bar</h4><p><picture><img alt="A tool bar component in light and dark modes with BlueCoat theme" decoding="async" loading="lazy" src="../../volumes/personnel/3_projets/miso-ios/miso/core/miso/themes/bluecoat/sources/_misothemesbluecoat.docc/resources/navigations/toolbar/toolbartop/component_toolbartop_bluecoat_light.png"/></picture></p><h3>Dialogs</h3><h4>Alert message</h4><p><picture><img alt="An alert message component in light and dark modes with BlueCoat theme" decoding="async" loading="lazy" src="../../volumes/personnel/3_projets/miso-ios/miso/core/miso/themes/bluecoat/sources/_misothemesbluecoat.docc/resources/dialogs/alert/alertmessage/component_alertmessage_bluecoat.png"/></picture></p><h4>Inline alert</h4><p><picture><img alt="An inline alert component in light and dark modes with BlueCoat theme" decoding="async" loading="lazy" src="../../volumes/personnel/3_projets/miso-ios/miso/core/miso/themes/bluecoat/sources/_misothemesbluecoat.docc/resources/dialogs/alert/inlinealert/component_inlinealert_bluecoat.png"/></picture></p><h3>Controls</h3><h4>Pin code input</h4><p><picture><img alt="A pin code input component in light and dark modes with BlueCoat theme" decoding="async" loading="lazy" src="../../volumes/personnel/3_projets/miso-ios/miso/core/miso/themes/bluecoat/sources/_misothemesbluecoat.docc/resources/controls/pincodeinputs/component_pincodeinput_bluecoat.png"/></picture></p><h4>Password input</h4><p><picture><img alt="A password input component in light and dark modes with BlueCoat theme" decoding="async" loading="lazy" src="../../volumes/personnel/3_projets/miso-ios/miso/core/miso/themes/bluecoat/sources/_misothemesbluecoat.docc/resources/controls/passwordinputs/component_passwordinput_bluecoat.png"/></picture></p><h4>Text area</h4><p><picture><img alt="A text area component in light and dark modes with BlueCoat theme" decoding="async" loading="lazy" src="../../volumes/personnel/3_projets/miso-ios/miso/core/miso/themes/bluecoat/sources/_misothemesbluecoat.docc/resources/controls/textareas/component_textarea_bluecoat.png"/></picture></p><h3>Indicators</h3><h4>Progress indicator</h4><h3>Layouts</h3><h4>Colored surface</h4><p><picture><img alt="A colored surface component in light and dark modes with BlueCoat theme" decoding="async" loading="lazy" src="../../volumes/personnel/3_projets/miso-ios/miso/core/miso/themes/bluecoat/sources/_misothemesbluecoat.docc/resources/layouts/coloredsurface/component_coloredsurface_bluecoat.png"/></picture></p><h3>Foundations</h3><h4>Typography</h4><p><picture><img alt="A typography component in light and dark modes with BlueCoat theme" decoding="async" loading="lazy" src="../../volumes/personnel/3_projets/miso-ios/miso/core/miso/themes/bluecoat/sources/_misothemesbluecoat.docc/resources/foundations/typography/component_typography_heading_bluecoat.png"/></picture></p><h2>Topics</h2><h3>Group</h3><ul><li><a href="bluecoattheme/index.html"><code>class BlueCoatTheme</code><p>This BlueCoat theme is a theme for some specific usages, like for prototyping and design of journeys without any brand-charted theme. This is an override of the default basic <code>MISOTheme</code> for some usages. It can override any properties from its superclass, and but cannot be derived ; this is not allowed.</p></a></li><li><a href="bluecoatbrandcolorrawtokens/index.html"><code>enum BlueCoatBrandColorRawTokens</code><p>This enum helps to add new <b>color raw tokens</b> exclusive to this <a href="bluecoattheme/index.html"><code>BlueCoatTheme</code></a>. Such tokens are packed in a <i>Swift enum</i> so as to gather them in one object with the suitable namespace and avoid to have just constants in nothing else (i.e. publicly accessible from everywhere). More optimized than dimensionstruct_.</p></a></li><li><a href="bluecoatbrandfontrawtokens/index.html"><code>enum BlueCoatBrandFontRawTokens</code><p>This enum helps to add new <b>font raw tokens</b> exclusive to this <a href="bluecoattheme/index.html"><code>BlueCoatTheme</code></a> Such tokens are packed in a <i>Swift enum</i> so as to gather them in one object with the suitable namespace and avoid to have just constants in nothing else (i.e. publicly accessible from everywhere). More optimized than dimensionstruct_.</p></a></li></ul><h3>Classes</h3><ul><li><a href="bluecoatthemeaccordioncomponenttokensprovider/index.html"><code>class BlueCoatThemeAccordionComponentTokensProvider</code><p>A class which wraps all <b>component  tokens of accordions</b> for <i>accordions</i> components. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a <code>AllAccordionComponentTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an <code>MISOTheme</code> implementation to use. It implements also the protocol <code>AccordionComponentTokens</code> and <code>AccordionFaqComponentTokens</code> so as to expose the component tokens for <i>accordions</i> through any <code>MISOTheme</code>. <i>Accordions</i> components tokens are defined with semantic tokens spaces (from <code>AllSpaceSemanticTokensProvider</code>) and sizes (from <code>AllSizeSemanticTokensProvider</code>).</p></a></li><li><a href="bluecoatthemealertcomponenttokensprovider/index.html"><code>class BlueCoatThemeAlertComponentTokensProvider</code><p>A class which wraps all <b>component  tokens of alert</b> for <i>alert</i> objects like <code>MISOAlertMessage</code>. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a <code>AllAlertComponentTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users. It implements also the protocol <code>AlertComponentTokens</code> so as to expose the component tokens for <i>alert</i> through any <code>MISOTheme</code>. <i>Alert</i> components tokens are defined with semantic tokens of borders (<code>AllBorderSemanticTokensProviders</code>), spaces (from <code>AllSpaceSemanticTokensProvider</code>) and sizes (from <code>AllSizeSemanticTokensProvider</code>).</p></a></li><li><a href="bluecoatthemealertmessagecomponenttokensprovider/index.html"><code>class BlueCoatThemeAlertMessageComponentTokensProvider</code><p>A class which wraps all <b>component  tokens of alert</b> for <i>alert</i> objects like <code>MISOAlertMessage</code>. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a <code>AllAlertMessageComponentTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an <code>MISOTheme</code> implementation to use. It implements also the protocol <code>AlertMessageComponentTokens</code> so as to expose the component tokens for <i>alertMessage</i> through any <code>MISOTheme</code>. <i>Alert</i> components tokens are defined with semantic tokens of borders (<code>AllBorderSemanticTokensProviders</code>), and spaces (from <code>AllSpaceSemanticTokensProvider</code>).</p></a></li><li><a href="bluecoatthemebadgecomponenttokensprovider/index.html"><code>class BlueCoatThemeBadgeComponentTokensProvider</code><p>A class which wraps all <b>component  tokens of badge</b> for <i>badge</i> objects like <code>MISOBadgeStandard</code>, <code>MISOBadgeIcon</code> and <code>MISOBadgeCount</code>. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a <code>AllBadgeComponentTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an <code>MISOTheme</code> implementation to use. It implements also the protocol <code>BadgeComponentTokens</code> so as to expose the component tokens for <i>badge</i> through any <code>MISOTheme</code>. <i>Badge</i> components tokens are defined with semantic tokens of dimensions (<code>AllDimensionSemanticTokensProvider</code>) and spaces (from <code>AllSpaceSemanticTokensProvider</code>).</p></a></li><li><a href="bluecoatthemebarcomponenttokensprovider/index.html"><code>class BlueCoatThemeBarComponentTokensProvider</code><p>A class which wraps all <b>component  tokens of bar</b>. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a <code>AllBarComponentTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users. It implements also the protocol <code>BarComponentTokens</code> so as to expose the component tokens for <i>bar</i> through any <code>MISOTheme</code>. <i>Bar</i> components tokens are defined with semantic tokens of colors (<code>AllColorSemanticTokensProviders</code>), sizes (from <code>AllSizeSemanticTokensProvider</code>), borders (from <code>AllBorderSemanticTokensProvider</code>) and effects (from <code>AllEffectSemanticTokensProvider</code>).</p></a></li><li><a href="bluecoatthemebordersemantictokensprovider/index.html"><code>class BlueCoatThemeBorderSemanticTokensProvider</code><p>A class which wraps all <b>border semantic tokens</b> and expose them. This provider should be integrated as a <code>AllBorderSemanticTokensProvider</code> implementation inside some <code>MISOTheme</code> so as to provide all tokens to the users.</p></a></li><li><a href="bluecoatthemebulletlistcomponenttokensprovider/index.html"><code>class BlueCoatThemeBulletListComponentTokensProvider</code><p>A class which wraps all <b>component  tokens of bullet list</b> for <i>bullet list</i> objects like <code>MISOBulletList</code>. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a <code>AllBulletListComponentTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an <code>MISOTheme</code> implementation to use. It implements also the protocol <code>BulletListComponentTokens</code> so as to expose the component tokens for <i>bullet list</i> through any <code>MISOTheme</code>. <i>Bullet list</i> components tokens are defined with raw and semantic tokens of spaces (from <code>AllSpaceSemanticTokensProvider</code>).</p></a></li><li><a href="bluecoatthemebuttoncomponenttokensprovider/index.html"><code>class BlueCoatThemeButtonComponentTokensProvider</code><p>A class which wraps all <b>component  tokens of buttons</b> for <i>button</i> objects like <code>MISOButton</code>. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a <code>AllButtonComponentTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an <code>MISOTheme</code> implementation to use. It implements also the protocol <code>ButtonComponentTokens</code> so as to expose the component tokens for <i>buttons</i> through any <code>MISOTheme</code>. <i>Button</i> components tokens are defined with raw and semantic tokens of sizes (from <code>AllSizeSemanticTokensProvider</code>), borders spaces (from <code>AllSpaceSemanticTokensProvider</code>).</p></a></li><li><a href="bluecoatthemecategoricaltagcomponenttokensprovider/index.html"><code>class BlueCoatThemeCategoricalTagComponentTokensProvider</code><p>A class which wraps all <b>component  tokens of categorical tag</b> for <i>tag</i> objects like <code>MISOCategoricalTag</code>. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a <code>AllCategoricalTagComponentTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an <code>MISOTheme</code> implementation to use. It implements also the protocol <code>CategoricalTagComponentTokens</code> so as to expose the component tokens for <i>categorical tags</i> through any <code>MISOTheme</code>. <i>Categorical tags</i> components tokens are defined with semantic tokens of colors (<code>AllColorSemanticTokensProvider</code>)</p></a></li><li><a href="bluecoatthemecheckboxcomponenttokensprovider/index.html"><code>class BlueCoatThemeCheckboxComponentTokensProvider</code><p>A class which wraps all <b>component  tokens of checkbox</b> for  <i>checkboxes</i> objects like <code>MISOCheckbox</code> and <code>MISOCheckboxItem</code>. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a <code>AllCheckboxComponentTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an <code>MISOTheme</code> implementation to use. It implements also the protocol <code>CheckboxComponentTokens</code> so as to expose the component tokens for <i>checkboxes</i> through any <code>MISOTheme</code>. <i>Checkboxes</i> components tokens are defined with raw and semantic tokens of sizes (from <code>SizeSemanticToken</code>) and borders (<code>BorderRadiusSemanticToken</code>, <code>BorderWidthSemanticToken</code>). These components share the same type of tokens which are all gathered here.</p></a></li><li><a href="bluecoatthemechipcomponenttokensprovider/index.html"><code>class BlueCoatThemeChipComponentTokensProvider</code><p>A class which wraps all <b>component  tokens of chip</b> for <i>chip</i> objects like <code>MISOFilterChip</code> and <code>MISOSuggestionChip</code>. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a <code>AllChipComponentTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an <code>MISOTheme</code> implementation to use. It implements also the protocol <code>ChipComponentTokens</code> so as to expose the component tokens for <i>chip</i> through any <code>MISOTheme</code>. <i>Chip</i> components tokens are defined with semantic tokens of colors (from <code>AllColorSemanticTokensProvider</code>) , spaces (from <code>AllSpaceSemanticTokensProvider</code>), dimensions (<code>AllDimensionSemanticTokensProvider</code>), border  (from <code>AllBorderSemanticTokensProvider</code>) and sizes  (from <code>AllSizeSemanticTokensProvider</code>).</p></a></li><li><a href="bluecoatthemecolormodesemantictokensprovider/index.html"><code>class BlueCoatThemeColorModeSemanticTokensProvider</code><p>A class which wraps all <b>color mode semantic tokens</b>, <i>multiple</i> or not, and expose them. This provider should be integrated as a <code>AllColorModeSemanticTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users.</p></a></li><li><a href="bluecoatthemecolorsemantictokensprovider/index.html"><code>class BlueCoatThemeColorSemanticTokensProvider</code><p>A class which wraps all <b>color semantic tokens</b>, <i>multiple</i> or not, and expose them. This provider should be integrated as a <code>AllColorSemanticTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users.</p></a></li><li><a href="bluecoatthemedimensionsemantictokensprovider/index.html"><code>class BlueCoatThemeDimensionSemanticTokensProvider</code><p>A class which wraps all <b>dimension semantic tokens</b>, and expose them. This provider should be integrated as a <code>AllDimensionSemanticTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users.</p></a></li><li><a href="bluecoatthemedividercomponenttokensprovider/index.html"><code>class BlueCoatThemeDividerComponentTokensProvider</code><p>A class which wraps all <b>component  tokens of divider</b> for <i>divider</i> objects like <code>MISOHorizontalDivider</code> and <code>MISOVerticalDivider</code>. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a <code>AllDividerComponentTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an <code>MISOTheme</code> implementation to use. It implements also the protocol <code>DividerComponentTokens</code> so as to expose the component tokens for <i>divider</i> through any <code>MISOTheme</code>. <i>Divider</i> components tokens are defined with raw and semantic tokens of borders (from <code>AllBorderSemanticTokensProvider</code>).</p></a></li><li><a href="bluecoatthemeeffectsemantictokensprovider/index.html"><code>class BlueCoatThemeEffectSemanticTokensProvider</code><p>A class which wraps all <b>effect semantic tokens</b>, and expose them. This provider should be integrated as a <code>AllEffectSemanticTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users.</p></a></li><li><a href="bluecoatthemeelevationsemantictokensprovider/index.html"><code>class BlueCoatThemeElevationSemanticTokensProvider</code><p>A class which wraps all <b>elevation semantic tokens</b>, <i>multiple</i>, <i>composite</i> or not, and expose them. This provider should be integrated as a <code>AllElevationSemanticTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users.</p></a></li><li><a href="bluecoatthemefontsemantictokensprovider/index.html"><code>class BlueCoatThemeFontSemanticTokensProvider</code><p>A class which wraps all <b>font semantic tokens</b>, <i>multiple</i>, <i>composite</i> or not, and expose them. This provider should be integrated as a <code>AllFontSemanticTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users.</p></a></li><li><a href="bluecoatthemegridsemantictokensprovider/index.html"><code>class BlueCoatThemeGridSemanticTokensProvider</code><p>A class which wraps all <b>grid semantic tokens</b> and expose them. This provider should be integrated as a <code>AllGridSemanticTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users.</p></a></li><li><a href="bluecoatthemeiconcomponenttokensprovider/index.html"><code>class BlueCoatThemeIconComponentTokensProvider</code><p>A class which wraps all <b>component  tokens of icons</b> for <i>icons</i> used in some components like <code>MISOTag</code>. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a <code>AllIconComponentTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users. It implements also the protocol <code>IconomponentTokens</code> so as to expose the component tokens for <i>icons</i> through any <code>MISOTheme</code>. <i>Icons</i> components tokens are defined with raw and semantic tokens of colors (from <code>AllColorSemanticTokensProvider</code>).</p></a></li><li><a href="bluecoatthemeinputtagcomponenttokensprovider/index.html"><code>class BlueCoatThemeInputTagComponentTokensProvider</code><p>A class which wraps all <b>component  tokens of tag input</b> objects like <code>MISOInputTag</code>. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. It implements also the protocol <code>InputTagComponentTokens</code> so as to expose the component tokens for <i>tag inputs</i> through any <code>MISOTheme</code>. <i>Tag inputs</i> components tokens are defined with semantic tokens of colors (from <code>AllColorSemanticTokensProvider</code>), and borders (from <code>AllBorderSemanticTokensProvider</code>).</p></a></li><li><a href="bluecoatthemelinkcomponenttokensprovider/index.html"><code>class BlueCoatThemeLinkComponentTokensProvider</code><p>A class which wraps all <b>component  tokens of links</b> for <i>link</i> objects like <code>MISOLink</code>. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a <code>AllLinkComponentTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an <code>MISOTheme</code> implementation to use. It implements also the protocol <code>LinkComponentTokens</code> so as to expose the component tokens for <i>links</i> through any <code>MISOTheme</code>. <i>Link</i> components tokens are defined with raw and semantic tokens of sizes (from <code>AllSizeSemanticTokensProvider</code>), colors (from <code>AllColorSemanticTokensProvider</code>), spaces (from <code>AllSpaceSemanticTokensProvider</code>) and dimensions (from <code>AllDimensionSemanticTokensProvider</code>).</p></a></li><li><a href="bluecoatthemelistitemcomponenttokensprovider/index.html"><code>class BlueCoatThemeListItemComponentTokensProvider</code><p>A class which wraps all <b>component tokens</b> for list item components like <code>MISOListItem</code>. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a <code>AllListItemComponentTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an <code>MISOTheme</code> implementation to use. It implements also the protocol <code>ListItemComponentTokens</code> so as to expose the component tokens for list item components through any <code>MISOTheme</code>. Such component tokens are defined with raw and semantic tokens of sizes (from <code>AllSizeSemanticTokensProvider</code>), borders (from <code>AllBorderSemanticTokensProvider</code>), colors (from <code>AllColorSemanticTokensProvider</code>), spaces (from <code>AllSpaceSemanticTokensProvider</code>), opacities (from <code>AllOpacitySemanticTokensProvider</code>) and dimensions (from <code>AllDimensionSemanticTokensProvider</code>).</p></a></li><li><a href="bluecoatthemeopacitysemantictokensprovider/index.html"><code>class BlueCoatThemeOpacitySemanticTokensProvider</code><p>A class which wraps all <b>opacity semantic tokens</b> and expose them. This provider should be integrated as a <code>AllOpacitySemanticTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users.</p></a></li><li><a href="bluecoatthemepincodeinputcomponenttokensprovider/index.html"><code>class BlueCoatThemePinCodeInputComponentTokensProvider</code><p>A class which wraps all <b>component  tokens of pin code input</b> like <code>MISOPinCodeInput</code>. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a <code>AllPinCodeInputComponentTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an <code>MISOTheme</code> implementation to use. It implements also the protocol <code>PinCodeInputComponentTokens</code> so as to expose the component tokens for <i>pin code input</i> through any <code>MISOTheme</
