<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>BlueCoatThemeRadioButtonComponentTokensProvider</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="A class which wraps all component  tokens of radio button for  radios objects like `MISORadioButton` and `MISORadioButtonItem`. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a `AllRadioButtonComponentTokensProvider` implementation inside `MISOTheme` so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an `MISOTheme` implementation to use. It implements also the protocol `RadioButtonComponentTokens` so as to expose the component tokens for radio buttons through any `MISOTheme`. Radio buttons components tokens are defined with raw and semantic tokens of sizes (from `SizeSemanticToken`) and borders (`BorderRadiusSemanticToken`, `BorderWidthSemanticToken`). These components share the same type of tokens which are all gathered here." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Theme BlueCoat</a></li><li>BlueCoatThemeRadioButtonComponentTokensProvider</li></ul><p>Class</p><h1>BlueCoatThemeRadioButtonComponentTokensProvider</h1><p>A class which wraps all <b>component  tokens of radio button</b> for  <i>radios</i> objects like <code>MISORadioButton</code> and <code>MISORadioButtonItem</code>. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a <code>AllRadioButtonComponentTokensProvider</code> implementation inside <code>MISOTheme</code> so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an <code>MISOTheme</code> implementation to use. It implements also the protocol <code>RadioButtonComponentTokens</code> so as to expose the component tokens for <i>radio buttons</i> through any <code>MISOTheme</code>. <i>Radio buttons</i> components tokens are defined with raw and semantic tokens of sizes (from <code>SizeSemanticToken</code>) and borders (<code>BorderRadiusSemanticToken</code>, <code>BorderWidthSemanticToken</code>). These components share the same type of tokens which are all gathered here.</p><pre><code>class BlueCoatThemeRadioButtonComponentTokensProvider</code></pre></section><h2>Overview</h2><blockquote class="aside since"><p class="label">Since</p><p>1.0.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(sizes:borders:)/index.html"><code>init(sizes: (any AllSizeSemanticTokensProvider)?, borders: (any AllBorderSemanticTokensProvider)?)</code><p>Defines a provider of component tokens dedicated to <code>MISORadioButton</code> and <code>MISORadioButtonItem</code>.</p></a></li></ul></article></noscript><div id="app"></div></body></html>
