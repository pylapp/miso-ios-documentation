<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>Themes</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="Themes are applications of specific values for components tokens and semantic tokens using in the end raw tokens.(thus final usable low level values). A theme contains any relevant tokens which can be used for components rendering. A theme can use its own assets like fonts and icons." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Welcome to MISO</a></li><li>Themes</li></ul><p>Article</p><h1>Themes</h1><p><i>Themes</i> are applications of specific values for <i>components tokens</i> and <i>semantic tokens</i> using in the end <i>raw tokens</i>.(thus final usable low level values). A <i>theme</i> contains any relevant tokens which can be used for components rendering. A <i>theme</i> can use its own assets like fonts and icons.</p></section><h2>Overview</h2><p>This framework exposes today following themes:</p><table><thead><tr><th>Theme</th><th>Description</th></tr></thead><tbody><tr><td>BlueCoat</td><td>For mockups, prototypes and prooves of concepts without any brand-flavoured styles</td></tr></tbody></table><p>All themes are based on a theme contract called <code>MISOTheme</code>.</p><p><i>Themes</i> use <i>tokens providers</i> which provide the <i>semantic tokens</i> and <i>component tokens</i> to apply in the project. These tokens in most of cases can be overridden thanks to <code>@objc open</code> combination so as to make possible to override these values in extensions (thanks to <code>@objc</code>) and from objects outside the module (thanks to <code>open</code>). Thus we can split values and responsabilities in different <i>Swift Package Manager</i> targets and keep overriding and inheritance possible.</p><blockquote class="aside important"><p class="label">Important</p><p>It is possible to subclass an existing theme, or to build its own theme from scratch.</p></blockquote><h2>Architecture</h2><p>A theme is a <i>Swift class</i> which several tokens providers providing their own definition of tokens.</p><p>We choose to pack all semantic tokens in protocols, so as to force any theme to manage them through tokens providers. Because Swift does not have notions of abstract classes compared to Kotlin, the <code>MISOTheme</code> which can be considered like an almost-abstract class. Then, a white label theme may just inherit from this class and override the tokens it needs. A concrete example is the <code>BlueCoatTheme</code>, providing in its module its own colors and overriding some tokens with the suitable values.</p><p>Themes can be able to override semantic tokens and components tokens, and use its own raw or semantic tokens without sharing them to other themes. The existing raw tokens, shared between all themes, are not overridable because their definitions are frozen.</p><p>A theme can use its own tokens providers, implemented from scratch or by inheriting from existing tokens providers.</p><h2>Use themeable view</h2><pre class="swift"><code>// Add themeable view to your root view to use the BlueCoatTheme
MISOThemeableView(theme: BlueCoatTheme()) {
    YourRootView()
}

// Or use your custom theme if you want
MISOThemeableView(theme: YourCustomTheme()) {
    YourRootView()
}
</code></pre><h2>Theme tuning</h2><h3>Tunable themes or not</h3><p>A theme can be made tunable so as to be more flexible and adapt to different contexts or constraints. By default, the <code>BlueCoatTheme</code> is not tuned.</p><blockquote class="aside note"><p class="label">Note</p><p>Tuning represents the group of “flexibility points” a theme can expose to tailor and customize itself for particular contexts.</p></blockquote><h3>Tuned values</h3><p>If your theme supports tuning, define the elements which can be tuned and provide predefined tunings if relevant.</p><h3>Tuning usages</h3><p>The tuning to apply must be done at theme init, for a theme that supports it, for example:</p><pre class="swift"><code>    // Define your theme tuning with for example only rounded corners for buttons
    let tuning = Tuning(hasRoundedButtons: true)

    // Apply it to your theme
    let theme = YourAppTheme(tuning: tuning)
    // Or in one line
    let theme = YourAppTheme(tuning: Tuning(hasRoundedButtons: true))
</code></pre><h2>Define a custom theme if needed</h2><p>You will have to create a <i>Swift class</i> which will inherit from an existing theme like <code>BlueCoatTheme</code> (if you need its assets and resources) or from <code>MISOTheme</code> directly. You can see <code>BlueCoatTheme</code> as more specified and less abstract as <code>MISOTheme</code> which is the base of all themes. We do not recommend to use directly the <code>MISOTheme</code> as is, but you can of course, you just will have to add your own tokens providers or pick existing ones.</p><p>Then, you should override the <i>semantic tokens</i> and <i>components tokens</i> you want using the providers; we recommend to use <i>Swift extensions</i> for clarity reasons. You can use existing tokens providers or override them.</p><p>If your theme needs to define its own <i>raw tokens</i>, you can also define them using a <code>enum</code> and the <i>raw tokens types</i>.</p><h3>By subclassing</h3><p>You may want to define your own theme, thus you can override an existing theme like <code>BlueCoatTheme</code> with your own class or just override the providers. For clarity reasons maybe you should define your own class inheriting from <code>BlueCoatTheme</code>, or, more difficult, from <code>MISOTheme</code> but we do not recommand that.</p><p>You must consider the tokens provider you need (to inherit from for overriding, or to use as is):</p><ul><li><p>spaces tokens are <code>BlueCoatThemeSpaceSemanticTokensProvider</code></p></li><li><p>sizes tokens are in <code>BlueCoatThemeSizeSemanticTokensProvider</code></p></li><li><p>colors tokens are all defined in <code>BlueCoatThemeColorSemanticTokensProvider</code></p></li><li><p>borders tokens are in <code>BlueCoatThemeBorderSemanticTokensProvider</code></p></li><li><p>elevations tokens are in <code>BlueCoatThemeElevationSemanticTokensProvider</code></p></li><li><p>opacity tokens are in <code>BlueCoatThemeOpacitySemanticTokensProvider</code></p></li><li><p>grid tokens are in <code>BlueCoatThemeGridSemanticTokensProvider</code></p></li><li><p>font tokens are in <code>BlueCoatThemeFontSemanticTokensProvider</code></p></li><li><p>and same logic for component tokens</p></li></ul><p>Find below some example</p><pre class="swift"><code>// Token provider for spaces

class YourAppThemeSpaceTokensProvider: BlueCoatThemeSpaceSemanticTokensProvider {
    override var fixedMedium: SpaceSemanticToken {
        DimensionRawTokens._400
    }
    override var scaledSmall: MultipleSpaceSemanticToken {
        MultipleSpaceSemanticToken(compact: fixed5xl, regular: fixed5xl)
    }
}

// Token provider for sizes

class YourAppThemeSizeTokensProvider: BlueCoatThemeSizeSemanticTokensProvider {
    override var iconDecorative2xl: SizeSemanticToken {
        DimensionRawTokens._300
    }
    override var iconDecorativeMd: SizeSemanticToken {
        DimensionRawTokens._900
    }
}

// Token provider for colors

class YourAppThemeColorTokensProvider: BlueCoatThemeColorSemanticTokensProvider {
    override var bgSecondary: MultipleColorSemanticToken {
        MultipleColorSemanticToken(light: ColorRawTokens.colorDecorativeAmber500, dark: BlueCoatBrandColorRawTokens.royalBlue300)
    }
    override var actionEnabled: MultipleColorSemanticToken {
        MultipleColorSemanticToken(light: ColorRawTokens.colorDecorativeShockingPink100, dark: ColorRawTokens.functionalScarlet600)
    }
}

// Token provider for border

class YourAppThemeBorderTokensProvider: BlueCoatThemeBorderSemanticTokensProvider {
    override var styleDefault: BorderStyleSemanticToken {
        BorderRawTokens.styleDashed
    }
    override var widthw: BorderWidthSemanticToken {
        BorderRawTokens.width100
    }
    override var radiusLarge: BorderRadiusSemanticToken {
        BorderRawTokens.radius800
    }
}

// Token provider for elevation

class YourAppThemeElevationTokensProvider: BlueCoatThemeElevationSemanticTokensProvider {
    override var stickyEmphasized: ElevationCompositeSemanticToken {
        ElevationCompositeSemanticToken(ElevationRawTokens.bottom_4_600)
    }
}

// Token provider for opacity

class YourAppThemeOpacityTokensProvider: BlueCoatThemeOpacitySemanticTokensProvider {
    override var strong: OpacitySemanticToken {
        OpacityRawTokens._920
    }
}

// Token provider for grid

class YourAppThemeGridTokensProvider: BlueCoatThemeGridSemanticTokensProvider {
    override var extraCompactColumnGap: GridSemanticToken {
        GridRawTokens.columnGap200
    }
    override var compactColumnGap: GridSemanticToken {
        GridRawTokens.columnGap200
    }
    override var regularColumnGap: GridSemanticToken {
        GridRawTokens.columnGap200
    }
}

// Token provider for font

class YourAppThemeFontTokensProvider: BlueCoatThemeFontSemanticTokensProvider {
    override var displayLarge: MultipleFontCompositeSemanticToken { 
        MultipleFontCompositeSemanticToken(FontCompositeSemanticToken(
            size: sizeDisplayLargeMobile,
            lineHeight: lineHeightDisplayLargeMobile,
            weight: weightDisplay,
            letterSpacing: letterSpacingDisplayLargeMobile))) 
    }
}
</code></pre><p>You can instead of overriding existing semantic tokens provider implement your own provider but it will imply to implement maybe hundreds of tokens. Your own provider must match the suitable signature.</p><p>Then define your own theme class and assign the providers. You can just use some custom providers and leave the others as they are.</p><pre class="swift"><code>import MISOThemesMISOBlueCoat // To get BlueCoatTheme

// Define your theme
class YourAppTheme: BlueCoatTheme {
    
    override init() {
        super.init(colors: YourAppThemeColorTokensProvider(),
                   borders: YourAppThemeBorderTokensProvider(),
                   elevations: YourAppThemeElevationTokensProvider(),
                   fonts: YourAppThemeFontTokensProvider(),
                   grids: YourAppThemeGridTokensProvider(),
                   opacities: YourAppThemeOpacityTokensProvider(),
                   sizes: YourAppThemeSizeTokensProvider(),
                   spaces: YourAppThemeSpaceTokensProvider(),
                   button: YourAppThemeButtonComponentTokensProvider,
                
                    Etc...)
    }
}
</code></pre><p>Finaly for your app root view:</p><pre class="swift"><code>struct MyAppRootView: View {

    var body: some View {
        MISOThemeableView(theme: YourAppTheme()) {
            // ...
        }
    }
}
</code></pre><p>You can define your own set of raw tokens, and asign them in the semantic tokens you override as values, for example:</p><pre class="swift"><code>public typealias MyOwnFontRawTokens = FontRawTokens // Refer to type FontRawTokens for consistency, declared in MISOTokensRaw

public enum MyOwnFontRawTokens {
    public static let someFontBody: MyOwnFontRawTokens = "Arial"
}
</code></pre><p>All components the MISO library provides are based on themes, handle through the abstract <code>MISOTheme</code>, exposing <i>semantic tokens</i>, defined by <i>raw tokens</i> assigned to usable final values. In few words, if you want to change the look and feel for the MISO components you use, you will have to override the matching <i>semantic tokens</i> or <i>component tokens</i>, but it will bring side effects as these <i>semantic tokens</i> are shared accross several components.</p><p>You are also able to define your <i>components tokens</i> and your <i>semantic tokens</i> used by them.</p></article></noscript><div id="app"></div></body></html>
