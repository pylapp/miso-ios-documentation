<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>Getting Started with MISO</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="How to add the package as dependency, import libraries and use theme and components for your apps." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Welcome to MISO</a></li><li>Getting Started with MISO</li></ul><p>Article</p><h1>Getting Started with MISO</h1><p>How to add the package as dependency, import libraries and use theme and components for your apps.</p></section><h2>Integrate MISO</h2><h3>Use Swift Package Manager</h3><p>If you want to add the iOS library of <i>MISO</i>, you need to add our <i>Swift Package</i> into your project. To do that, add a new <i>package dependency</i> to your <i>Xcode</i> project by refering to it by <code>github.com/Orange-OpenSource/miso-ios</code>. You are free to choose whether or not you want a branch or a specific tag, pick the solution you want.</p><p>You can <a href="https://github.com/Orange-OpenSource/miso-ios/wiki/50-%E2%80%90-About-versions,-releases-and-builds">refer to the wiki</a> for more details about versions, releases and tags. You can find release tags (e.g. <i>1.0.0</i>) and release candidates tags (e.g. <i>1.0.0-rc3</i>).</p><h3>Import the libraries you need</h3><p>You should use one (or several) of the following imports for your needs, which are basically <i>Swift Package</i> products.</p><blockquote class="aside tip"><p class="label">Tip</p><p>We recommend to embed in your apps only the ones you need to avoid to embed useless assets.</p></blockquote><pre class="swift"><code>import MISOThemesContract // If you want to define your theme, use themes or MISOThemeableView
import MISOModules // To use modules
import MISOComponents // To use components
import MISOThemesMISOBlueCoat // To use the BlueCoat theme
import MISOTokensComponent // If you need to override or use directly components tokens
import MISOTokenSemantic // If you need to override or use directly semantic tokens
import MISOTokensRaw // If you need to override or use directly raw tokens
import MISOFoundations // For some utilities
</code></pre><h3>Or more simple, import umbrella library</h3><blockquote class="aside note"><p class="label">Note</p><p>We do not recommend this solution because from our point of view use of tailored imports is better to import only the needed elements. use of umbrella products can increase app sizes and needed storage because it emebds plenty of assets (images, fonts, etc.) and useless constants.</p></blockquote><p>Import the <i>Swift Package</i> product which suits your needs:</p><table><thead><tr><th>Umbrella</th><th>Description</th></tr></thead><tbody><tr><td>MISOSwiftUI</td><td>All libraries listed above and the BlueCoat theme</td></tr><tr><td>MISOSwiftUIBlueCoat</td><td>All libraries listed above but with only BlueCoat theme</td></tr></tbody></table><h3>Chose your theme</h3><p>The <i>MISO</i> framework provides today one theme:</p><table><thead><tr><th>Theme</th><th>Description</th></tr></thead><tbody><tr><td>BlueCoat</td><td>For mockups, prototypes and prooves of concepts without any brand-flavoured styles</td></tr></tbody></table><h3>Apply a theme</h3><blockquote class="aside tip"><p class="label">Tip</p><p>Keep in mind only one theme can be used within one <code>MISOThemeableView</code>.</p></blockquote><h3>Trick for Xcode Preview</h3><p>If you use Xcode <code>#Preview</code> blocks, you will have to be sure the theme is instanciated and injected through the <code>MISOThemeableView</code>. Because it is not possible today to override the legit <code>#Preview</code> block, you can instead use some of our utilities to wrap your content inside the <code>MISOThemeableView</code> automatically. These utilities come with the themes modules. Without them you may face errors about undefined theme.</p><pre class="swift"><code>// Apply BlueCoat theme
#Preview {
    SampleView()
        .blueCoatPreview()
}
</code></pre></article></noscript><div id="app"></div></body></html>
