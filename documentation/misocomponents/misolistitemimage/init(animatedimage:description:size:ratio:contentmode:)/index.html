ftuicore/view/misolistitemsize(_:)/index.html"><code>misoListItemSize(_:)</code></a>), where the smallest size is always applied.</p></dd><dt>ratio</dt><dd><p>Ratio of the image. By default a <code>square</code> image.</p></dd><dt>contentMode</dt><dd><p>A flag indicating whether this view should fit or fill the parent context. Default set to <code>.fit</code>.</p></dd></dl><h2>Discussion</h2><pre class="swift"><code>    // Animated image from a remote URL
