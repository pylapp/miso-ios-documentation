<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>MISOCheckboxItem</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="Checkbox is a UI element that allows to select multiple options from a set of mutually non exclusive choices. Checkbox item covers a wider range of contexts by allowing to toggle the visibility of additional text labels and icon assets." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>MISOCheckboxItem</li></ul><p>Structure</p><h1>MISOCheckboxItem</h1><p>Checkbox is a UI element that allows to select multiple options from a set of mutually non exclusive choices. Checkbox item covers a wider range of contexts by allowing to toggle the visibility of additional text labels and icon assets.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>@MainActor struct MISOCheckboxItem</code></pre></section><h2>Mentioned In</h2><ul><li><a href="../controls/index.html">Controls</a></li></ul><h2>Layouts</h2><p>The component can be rendered as two different layouts:</p><ul><li><p><b>default</b>: the component has a leading indicator, a label and optional helper texts, and an optional trailing decorative icon</p></li><li><p><b>reversed</b>: like the <i>default</i> layout but with a trailing checkbox indicator and a leading optional image</p></li></ul><h2>Indicator states</h2><p>The checkbox indicator has three available states:</p><ul><li><p><b>selected</b>: the checkbox is filled with a tick, the user has made the action to select the checkbox</p></li><li><p><b>unselected</b>: the checkbox is empty, does not contain a tick, the user has made the action to unselect or did not select yet the checkbox</p></li></ul><p>If you are looking for a checkbox component with three states, use instead <a href="../misocheckboxitemindeterminate/index.html"><code>MISOCheckboxItemIndeterminate</code></a>.</p><h2>Particular cases</h2><p>An <a href="."><code>MISOCheckboxItem</code></a> can be related to an error situation, for example troubles for a form. A dedicated look and feel is implemented for that if the <code>isError</code> flag is risen. In that case if the component displayed an icon, this icon will be replaced automatically by an error icon.</p><p>In addition, the <a href="."><code>MISOCheckboxItem</code></a> can be in read only mode, i.e. the user cannot interact with the component yet but this component must not be considered as disabled.</p><p>The component does not follow the right-to-left (RTL) / left-to-right (LTR) mode returned by the system as it could have some meaning to have for example the indicator in trailing position for LTR mode and vice versa. However, if the component has an icon in leading position (RTL mode) or in trailing position (LTR), the content of the icon is never changed. It could lead to a loss of meaning or semantics in the icon. Thus the <a href="../misoimage/index.html"><code>MISOImage</code></a> <code>flipped</code> property can be used to flip the icon content whatever the layout direction is, preventing the user from implementing their own rules to flip or not the image.</p><h2>Rich text</h2><p>Rich text can only be used for error messages.</p><p>Strong text can be used sparingly to highlight key information within the content. No other text styles should be used. Underlined text must not be applied manually (e.g. in error message), as it is commonly associated with hyperlinks and may mislead users.</p><h2>Accessibility considerations</h2><p>Always check the results of rich text mode with high contrast, light and dark modes, and Voice Over vocalization.</p><p><i>Voice Over</i> will use several elements to describe the component: if component disabled / read only, if error context, the label and helper texts and a custom checkbox trait. No accessibility identifier is defined in MISO side as this value remains in the users hands.</p><h2>Forbidden by design</h2><p><b>The design system does not allow to have both an error situation and a read only component.</b> <b>The design system does not allow to have both an error situation and a disabled component.</b> <b>The design system does not allow to have both a read only and a disabled component.</b></p><h2>Code samples</h2><pre class="swift"><code>    // Supposing we have an unselected checkbox
    @Published var isOn: Bool = false

    // A leading checkbox with a label.
    MISOCheckboxItem("Hello world", isOn: $isOn)

    // Localizable from bundle can also be used
    MISOCheckboxItem(LocalizedStringKey("agree_terms"), bundle: Bundle.module, isOn: $isOn)

    // A leading checkbox with a label, but in read only mode (user cannot interact yet, but not disabled).
    MISOCheckboxItem("Hello world", isOn: $isOn, isReadOnly: true)

    // A leading checkbox with a label and a description as helper text.
    MISOCheckboxItem("Bazinga!", isOn: $isOn, description: "Doll-Dagga Buzz-Buzz Ziggety-Zag")

    // A trailing checkbox with a label, a description and an icon (tinted, default rendering).
    MISOCheckboxItem("We live in a fabled world",
                     isOn: $isOn,
                     description: "Of dreaming boys and wide-eyed girls",
                     image: MISOImage(asset: Image(decorative: "ic_heart")),
                     isReversed: true)

    // A trailing checkbox with a raw (non-tinted) image.
    MISOCheckboxItem("We live in a fabled world",
                     isOn: $isOn,
                     description: "Of dreaming boys and wide-eyed girls",
                     image: MISOImage(asset: Image(decorative: "il_someImage"), renderingMode: .original),
                     isReversed: true)

    // Flip the icon for RTL layouts using MISOImage.
    MISOCheckboxItem("Cocorico !",
                     isOn: $isOn,
                     image: MISOImage(asset: Image(systemName: "figure.handball"),
                                     flipped: layoutDirection == .rightToLeft),
                     isReversed: layoutDirection == .rightToLeft)

    // If on error, add an error message can help user to understand error context
    MISOCheckboxItem("We live in a fabled world",
                     isOn: $isOn,
                     isError: true,
                     errorText: "Something wrong",
                     hasDivider: true)

    // A leading checkbox with a label, but disabled.
    MISOCheckboxItem("Hello world", isOn: $isOn)
        .disabled(true)

    // Never disable a read only or an error-related checkbox as it will crash
    // This is forbidden by design!
    MISOCheckboxItem("Hello world", isOn: $isOn, isError: true).disabled(true) // fatal error
    MISOCheckboxItem("Hello world", isOn: $isOn, isReadOnly: true).disabled(true) // fatal error
</code></pre><blockquote class="aside version"><p class="label">Version</p><p>2.4.0 (Figma component design version)</p></blockquote><blockquote class="aside since"><p class="label">Since</p><p>OUDS 0.12.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(_:ison:description:image:isreversed:iserror:errortext:isreadonly:hasdivider:constrainedmaxwidth:action:)-7h1ko/index.html"><code>init(String, isOn: Binding&lt;Bool&gt;, description: String?, image: MISOImage?, isReversed: Bool, isError: Bool, errorText: String?, isReadOnly: Bool, hasDivider: Bool, constrainedMaxWidth: Bool, action: (() -&gt; Void)?)</code><p>Creates a checkbox with label and optional helper text, icon, divider.</p></a></li><li><a href="init(_:ison:description:image:isreversed:iserror:errortext:isreadonly:hasdivider:constrainedmaxwidth:action:)-r72g/index.html"><code>init(String, isOn: Binding&lt;Bool&gt;, description: String?, image: MISOImage?, isReversed: Bool, isError: Bool, errorText: AttributedString, isReadOnly: Bool, hasDivider: Bool, constrainedMaxWidth: Bool, action: (() -&gt; Void)?)</code><p>Creates a checkbox with label, optional helper text, icon, divider, and a rich attributed error text.</p></a></li><li><a href="init(_:tablename:bundle:ison:description:image:isreversed:iserror:errortext:isreadonly:hasdivider:constrainedmaxwidth:action:)-2o5d3/index.html"><code>init(LocalizedStringKey, tableName: String?, bundle: Bundle, isOn: Binding&lt;Bool&gt;, description: String?, image: MISOImage?, isReversed: Bool, isError: Bool, errorText: String?, isReadOnly: Bool, hasDivider: Bool, constrainedMaxWidth: Bool, action: (() -&gt; Void)?)</code><p>Creates a checkbox with a localized label, looking up the key in the given bundle.</p></a></li><li><a href="init(_:tablename:bundle:ison:description:image:isreversed:iserror:errortext:isreadonly:hasdivider:constrainedmaxwidth:action:)-3puoi/index.html"><code>init(LocalizedStringKey, tableName: String?, bundle: Bundle, isOn: Binding&lt;Bool&gt;, description: String?, image: MISOImage?, isReversed: Bool, isError: Bool, errorText: AttributedString, isReadOnly: Bool, hasDivider: Bool, constrainedMaxWidth: Bool, action: (() -&gt; Void)?)</code><p>Creates a checkbox with a localized label and a rich attributed error text.</p></a></li></ul><h3>Instance Properties</h3><ul><li><a href="body/index.html"><code>var body: some View</code></a></li></ul></article></noscript><div id="app"></div></body></html>
