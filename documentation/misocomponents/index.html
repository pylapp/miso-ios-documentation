<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>Components</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="The catalog of all components provided by MISO. It contains also `View` extensions and `ViewModifiers` to apply tokens and styles on components and higher-level views." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li>Components</li></ul><p>Framework</p><h1>Components</h1><p>The catalog of all components provided by MISO. It contains also <code>View</code> extensions and <code>ViewModifiers</code> to apply tokens and styles on components and higher-level views.</p></section><h2>Overview</h2><p>Components are grouped in several categories. <i>Actions</i> component are for example buttons. <i>Navigations</i> group contains links, <i>inputs</i> group has checkboxes, radio buttons and switches, <i>layouts</i> group is dedicated to things like dividers. You can get more details about them in the categories below:</p><ul><li><p><a href="actions/index.html">Actions</a></p></li><li><p><a href="contentdisplay/index.html">Content Display</a></p></li><li><p><a href="controls/index.html">Controls</a></p></li><li><p><a href="dialogs/index.html">Dialogs</a></p></li><li><p><a href="foundations/index.html">Foundations</a></p></li><li><p><a href="indicators/index.html">Indicators</a></p></li><li><p><a href="layouts/index.html">Layouts</a></p></li><li><p><a href="navigations/index.html">Navigations</a></p></li></ul><h2>Customize components</h2><h3>Apply a specific shadow effect (elevation tokens)</h3><p>The MISO iOS library allows to apply <i>elevation effets</i> on a <code>View</code>, i.e. a shadow under the component. Because the original project (OUDS° uses as design tool <i>Figma</i> which defines such shadow with a <i>blur</i> and a <i>spread</i> radiuses, and because <i>SwiftUI</i> uses only its own <i>radius</i> definition, an extension of <code>View</code> has been implemented to let users apply some effect using an <a href="https://ios.unified-design-system.orange.com/documentation/misotokenssemantic/elevationcompositesemantictoken"><code>ElevationCompositeSemanticToken</code></a> from the <a href="https://ios.unified-design-system.orange.com/documentation/misotokenssemantic/">MISOTokensSemantic</a> library thanks to the method <code>shadow(elevation: ElevationCompositeSemanticToken)</code>.</p><pre class="swift"><code>// For example, apply the elevation effect "drag" from your theme:
myView.shadow(theme.elevations.drag)
</code></pre><p>In details how it works:</p><pre class="swift"><code>// In the theme this "drag" has been defined for example like:
@objc open var drag: ElevationCompositeSemanticToken { ElevationCompositeSemanticToken(ElevationRawTokens.bottom_3_500) }

// And if you look deeper, the raw token "bottom_3_500" can be like:
public static let bottom_3_500 = ElevationCompositeRawToken(x: x0, y: y300, blur: blur400, color: ColorRawTokens.opacityBlack320)

// Blur will be used to compute the radius value
</code></pre><h3>Apply a specific typography (font tokens)</h3><p>Your application identity can be strongly based on the <i>typography</i> you use, i.e. the font family you choose and other configuration details like the font size or the font weight.</p><p>With MISO, typography depends to the class size, i.e. whether or not the application is in <i>compact mode</i> or in <i>regular mode</i>, and is defined with a <a href="https://ios.unified-design-system.orange.com/documentation/misotokenssemantic/multiplefontcompositesemantictoken"><code>MultipleFontCompositeSemanticToken</code></a> defined in the <a href="https://ios.unified-design-system.orange.com/documentation/misotokenssemantic/fontsemantictokens/"><code>FontSemanticTokens</code></a>.</p><p>The <i>theme</i> contains lots of <code>MultipleFontCompositeSemanticToken</code> listing all the combinations of typography you can apply, and these <i>composite semantic tokens</i> use <i>composite raw tokens</i>.</p><p>Typography relies on <i>font family</i> which is stored in the theme, and this font family can be a <i>custom one</i> or the <i>system one</i>. Thus, we let the users define the font family they want by overriding the <code>family</code> property of the theme. This value will be used to compute the typography, if not defined the default system font will be used.</p><p>Thus, if you want to apply a specific typography to a <code>View</code> (supposing the semantic tokens are defined in the theme), just call the method you want and gives as parameter the theme (to get the custom font if defined):</p><pre class="swift"><code>// Apply typography "body default small"
myView.bodyDefaultSmall(theme)
// or
myView.font(theme.fonts.bodyDefaultSmall)

// Apply typography "label strong X large"
myView.labelStrongXLarge(theme)
// or
myView.font(theme.fonts.labelStrongXLarge)

// Etc.
</code></pre><p>The font object can be also forged from tokens to be applied elsewhere:</p><pre class="swift"><code>@Environment(\.theme) private var theme
@Environment(\.verticalSizeClass) private var verticalSizeClass
@Environment(\.horizontalSizeClass) private var horizontalSizeClass

let font = Font.makeFont(
            family: theme.fontFamily,
            from: theme.fonts.labelModerateLarge,
            isCompact: horizontalSizeClass == .compact || verticalSizeClass == .compact)

// To SwiftUI font
let swiftUiFont = Font(font)    
</code></pre><p>In details how it works:</p><pre class="swift"><code>// Here is a definition of a semantic token inside the theme for typography "displayMedium":
@objc open var displayMedium: MultipleFontCompositeSemanticToken { 
MultipleFontCompositeSemanticToken(compact: bold750, regular: bold1050) 
}

// And here are the raw tokens definitions:
let bold750 = FontCompositeSemanticToken(size: size750, lineHeight: lineHeight850, weight: weightBold)
let bold1050 = FontCompositeSemanticToken(size: size1050, lineHeight: lineHeight1150, weight: weightBold)
</code></pre><p>These view modifiers are available for any <code>View</code> object, <a href="https://ios.unified-design-system.orange.com/documentation/misocomponents/swiftuicore/view">you can get the curated list in the documentation</a>.</p><h3>Apply a specific border (border tokens)</h3><p>This module exposes the helper <code>border(style:width:radius:color:)</code> so as to apply border semantic tokens on a view in order to define a border effect. The helper is available through <code>View</code>, and tokens through the provider of the theme.</p><pre class="swift"><code>@Environment(\.theme) private var theme

var body: some View {
    SomeView()
        .border(
             style: theme.borders.styleDefault,
             width: theme.borders.widthThin,
             radius: theme.borders.radiusNone,
             color: theme.colors.borderDefault)
}
</code></pre><h3>Apply specific colors</h3><p>Colors can be applied on view for background and foreground colors, foreground style, accent color or tint color. Some helpers are available in the MISO API to avoid to use the <code>color(for:)</code> method.</p><pre class="swift"><code>// Given a color at theme.colors.bgPrimary
// This token can have light and dark declinations 

@Environment(\.theme) private var theme

// Apply a foreground style
someView.foregroundStyle(theme.colors.bgPrimary)

// Apply a foreground color
someView.foregroundColor(theme.colors.bgPrimary)

// Apply a background
someView.background(theme.colors.bgPrimary)

// Apply an accent color
someView.accentColor(theme.colors.bgPrimary)

// Apply a tint color
someView.tint(theme.colors.bgPrimary)
</code></pre><p>For <code>Shape</code> types, a similar helper fills the shape with a token-based color. The correct light or dark color variant is resolved automatically from the environment color scheme.</p><pre class="swift"><code>@Environment(\.theme) private var theme

// Fill a shape with a token-based color
Circle()
    .fill(theme.colors.actionEnabled)

// Fill with a custom fill style
RoundedRectangle(cornerRadius: 8)
    .fill(theme.colors.bgPrimary, style: FillStyle(eoFill: true))
</code></pre><h2>Flip images according to layouts</h2><p>Images bring meanings, and are used in components. But sometimes, depending to your layouts (right to left (RTL) or left to right (LTR)), if the whole layout of your app changes, the images in use can loose meanings or have another one (except if they are asymetric). Even if some assets can be defined in a project with specific RTL/LTR variants, images can be loaded outside and in some case, in the end, must not be mirrored.</p><p>If your application manages several languages with RTL and LTR, here is a simple trick to flip the icons depending to the layout for the cases you want. The <code>flipped</code> property of <a href="misoimage/index.html"><code>MISOImage</code></a> can be used when passing an icon to a component.</p><pre class="swift"><code>// Get the layout direction in your View
@Environment(\.layoutDirection) private var layoutDirection

// Because by default icons are not flipped, i.e. more LTR flavoured, use a simple comparison
// (layoutDirection == .rightToLeft)

// For example in a checkbox item — wrap the asset in MISOImage and set flipped:
MISOCheckboxItem("Label",
                 isOn: $isOn,
                 image: MISOImage(asset: Image(systemName: "figure.handball"),
                                  flipped: layoutDirection == .rightToLeft),
                 isReversed: layoutDirection == .rightToLeft)
</code></pre><h2>Change font family according to locale or preferred language</h2><p>If you use for example a theme configured with a system font, you may for sure use the <i>Helvetica Neue</i> font family. However, this font family manages latin alphabet and not arabic alphabet. Nevertheless a trick can be done to use the suitable <i>Helvetica Neue</i> font family according to the language.</p><pre class="swift"><code>/// Returns the Helvetica Neue font family to use depending to the preferred language or locale
func localizedHelveticaFont() -&gt; String {
    return (MYOUtils.isArabicLanguageInUse() ? "Helvetica Neue Arabic" : "Helvetica Neue")
}

/// Instanciate your theme using the font family.
/// Thus when the user will change the app language the app will be restarted, repainted and the theme updated
let localizedTheme: MISOTheme = BlueCoatTheme(fontFamily: localizedHelveticaFont())
</code></pre><blockquote class="aside caution"><p class="label">Caution</p><p>For legal reasons MISO does not provide the Helvetica Neue Arabic nore Helvetica Neue assets. You will have to get them and register the fonts files in your app</p></blockquote><blockquote class="aside note"><p class="label">Note</p><p>For cyrillic alphabet <i>Helvetica Neue</i> has no variant, you can use <i>Arial</i> instead</p></blockquote><h2>Registering font assets</h2><p>If you need to use some fonts like <i>Helvetica Neue Arabic</i>, you will need to add the TTF files in your project and somewhere somehow register them.</p><pre class="swift"><code>private static var fontsAlreadyRegistered = false

// Fonts are defined in Resources/Fonts in TTF files.
private func registerFonts() {
    if !Self.fontsAlreadyRegistered {
        let fonts = Bundle.main.urls(forResourcesWithExtension: "ttf", subdirectory: nil)
        fonts?.forEach { CTFontManagerRegisterFontsForURL($0 as CFURL, .process, nil) }
        Self.fontsAlreadyRegistered = true
    }
}
</code></pre><p>Then, for each weight variant you need, declare the PostScript name so MISO can resolve the correct identifier from its font tokens:</p><pre class="swift"><code>registerFont(postScript: "WinkyRough-Regular_Light",   forCombination: PSFNMK("Winky Rough", Font.Weight.light))
registerFont(postScript: "WinkyRough-Regular",         forCombination: PSFNMK("Winky Rough", Font.Weight.regular))
registerFont(postScript: "WinkyRough-Regular_Medium",  forCombination: PSFNMK("Winky Rough", Font.Weight.medium))
registerFont(postScript: "WinkyRough-Regular_SemiBold",forCombination: PSFNMK("Winky Rough", Font.Weight.semibold))
registerFont(postScript: "WinkyRough-Regular_Bold",    forCombination: PSFNMK("Winky Rough", Font.Weight.bold))
registerFont(postScript: "WinkyRough-Regular_Black",   forCombination: PSFNMK("Winky Rough", Font.Weight.black))
</code></pre><p>The full map is readable at any time via <code>kApplePostScriptFontNames</code>. Unregistered combinations fall back to the family name without spaces.</p><h2>Use rich text with AttributedString</h2><blockquote class="aside note"><p class="label">Note</p><p>Do not use <code>AttributedString</code>  for <i>rich text</i> mode in MISO componants if they contain hyperlinks. Hyperlinks may be not accessible for Voice Over, Full Keyboard Access and Switch Control. Prefer use other components like <code>Text</code> from SwiftUI.</p></blockquote><p>You may need to add <i>rich text</i> to some components which support <code>AttributedString</code> type parameters. For example you may want to display a text with clickable hyperlinks inside, and a style for the hyperlink.</p><p>Font tokens like <code>theme.fonts.bodyDefaultMedium</code> are <code>MultipleFontCompositeSemanticToken</code> values, not SwiftUI <code>Font</code>. Convert them to a <code>Font</code> with <code>Font.makeFont(family:from:isCompact:)</code> before passing them to <code>AttributedString.from(...)</code>:</p><pre class="swift"><code>let themeBodyFont = Font(Font.makeFont(family: theme.fontFamily,
                                        from: theme.fonts.bodyDefaultMedium,
                                        isCompact: horizontalSizeClass == .compact || verticalSizeClass == .compact))

let themeBodyBoldFont = Font(Font.makeFont(family: theme.fontFamily,
                                            from: theme.fonts.bodyStrongMedium,
                                            isCompact: horizontalSizeClass == .compact || verticalSizeClass == .compact))

var urlConfigurations: [AttributedStringUrlConfiguration] = []
urlConfigurations.append(.init(text: "privacy policy", // Words to wrap
                               urlToOpen: privacyUrl, // Url to open
                               color: theme.colors.contentBrandPrimary.color(for: colorScheme),
                               font: themeBodyBoldFont))
let richTextHelperMessage = AttributedString.from(text: "You must read our privacy policy before authentication", // Text to display
                                                  foregroundColor: theme.colors.contentDefault.color(for: colorScheme),
                                                  font: themeBodyFont,
                                                  urlConfigurations: urlConfigurations)
                                                  
MISOPasswordInput("Enter your password", password: $password, helperText: richTextHelperMessage)
</code></pre><p>If you handle Markdown data, you can define your own styles for the hyperlinks:</p><pre class="swift"><code>var urlConfigurations: [AttributedStringUrlConfiguration] = []
urlConfigurations.append(.init(color: theme.colors.contentBrandPrimary.color(for: colorScheme),
                                font: themeBodyBoldFont))
    
let richTextMarkdown = AttributedString.from(markdown: someMarkdown,
                                             foregroundColor: theme.colors.contentDefault.color(for: colorScheme),
                                             font: themeBodyFont,
                                             urlConfigurations: urlConfigurations)
                                             
Text(richTextMarkdown)
</code></pre><p>If you just need to apply a color (no hyperlinks, no custom font) to a plain text or a Markdown source, use the simpler overloads:</p><pre class="swift"><code>let simpleText = AttributedString.from(text: "Some plain text",
                                       foregroundColor: theme.colors.contentDefault.color(for: colorScheme))

let simpleMarkdown = AttributedString.from(markdown: someMarkdown,
                                           foregroundColor: theme.colors.contentDefault.color(for: colorScheme))
</code></pre><h2>Topics</h2><h3>Classes</h3><ul><li><a href="misoasyncimagecache/index.html"><code>class MISOAsyncImageCache</code><p>Defines a cache, in memory and on disk, to store <code>AsyncImage</code> content. Backs the <a href="misoasyncimage/index.html"><code>MISOAsyncImage</code></a> View.</p></a></li></ul><h3>Structures</h3><ul><li><a href="attributedstringurlconfiguration/index.html"><code>struct AttributedStringUrlConfiguration</code><p>Defines the configuration to apply for an URL available in a text so as to forge a styled <code>AttributedString</code> in the end.</p></a></li><li><a href="misoaccessibilityconfiguration/index.html"><code>struct MISOAccessibilityConfiguration</code><p>Configuration for VoiceOver accessibility on progress indicators.</p></a></li><li><a href="misoalertmessage/index.html"><code>struct MISOAlertMessage</code><p>Alert message is a UI element that displays system feedback, status changes or required action; throughout detailed, prominent, persistent and actionable communication. Alert message includes functional icon and semantic colour, and may include as well a close button and/or action link. Alert Message does not disappear automatically and remains visible until dismissed or resolved by the user.</p></a></li><li><a href="misoanimatedimage/index.html"><code>struct MISOAnimatedImage</code><p><code>MISOAnimatedImage</code> is a SwiftUI view able to play animated <b>GIF</b> and <b>WebP</b> images.</p></a></li><li><a href="misoasyncimage/index.html"><code>struct MISOAsyncImage</code><p><a href="misoasyncimage/index.html"><code>MISOAsyncImage</code></a> is an async image component with built-in caching support. It loads images from URLs and caches them in memory and on disk for optimal performance.</p></a></li><li><a href="misobadgecount/index.html"><code>struct MISOBadgeCount</code><p>Badge is a UI element that emphasizes system notifications, status, or the categorization of an information, throughout colour only. Badge is rendered as a coloured shape, without icon, text or number; and its chosen size remains unchanged regardless of the changes of the interface size. <a href="misobadgecount/index.html"><code>MISOBadgeCount</code></a> displays a text, as integer, limited to 99.</p></a></li><li><a href="misobadgeicon/index.html"><code>struct MISOBadgeIcon</code><p>Badge is a UI element that emphasizes system notifications, status, or the categorization of an information, throughout colour only. Badge is rendered as a coloured shape, without icon, text or number; and its chosen size remains unchanged regardless of the changes of the interface size. <a href="misobadgeicon/index.html"><code>MISOBadgeIcon</code></a> displays an image.</p></a></li><li><a href="misobadgestandard/index.html"><code>struct MISOBadgeStandard</code><p>Badge is a UI element that emphasizes system notifications, status, or the categorization of an information, throughout colour only. Badge is rendered as a coloured shape, without icon, text or number; and its chosen size remains unchanged regardless of the changes of the interface size. <a href="misobadgestandard/index.html"><code>MISOBadgeStandard</code></a> displays only a colored pastille.</p></a></li><li><a href="misobody/index.html"><code>struct MISOBody</code><p>Text component used for the main content of a screen (paragraphs, descriptions, helper texts, etc.).</p></a></li><li><a href="misobulletlist/index.html"><code>struct MISOBulletList</code><p>Bullet list is a UI element that helps to view in related individual text items grouped together; items usually starting with a number or a bullet. Bullet list is also known as <i>Unordered list</i> or <i>Ordered list</i> and is not an interactive element by default.</p></a></li><li><a href="misobutton/index.html"><code>struct MISOButton</code><p>Button is a UI element that triggers an action or event, and is used to initiate tasks or confirming an action. Button appears in different layouts, styles and states to indicate hierarchy or emphasis.</p></a></li><li><a href="misocheckbox/index.html"><code>struct MISOCheckbox</code><p>Checkbox is a UI element that allows to select multiple options from a set of mutually non exclusive choices. Checkbox that does not show icon or text, provides greater flexibility when creating other components that require a checkbox to be displayed.</p></a></li><li><a href="misocheckboxindeterminate/index.html"><code>struct MISOCheckboxIndeterminate</code><p>Checkbox is a UI element that allows to select multiple options from a set of mutually non exclusive choices. Checkbox that does not show icon or text, provides greater flexibility when creating other components that require a checkbox to be displayed.</p></a></li><li><a href="misocheckboxitem/index.html"><code>struct MISOCheckboxItem</code><p>Checkbox is a UI element that allows to select multiple options from a set of mutually non exclusive choices. Checkbox item covers a wider range of contexts by allowing to toggle the visibility of additional text labels and icon assets.</p></a></li><li><a href="misocheckboxitemindeterminate/index.html"><code>struct MISOCheckboxItemIndeterminate</code><p>Checkbox is a UI element that allows to select multiple options from a set of mutually non exclusive choices. Checkbox item covers a wider range of contexts by allowing to toggle the visibility of additional text labels and icon assets.</p></a></li><li><a href="misocheckboxpicker/index.html"><code>struct MISOCheckboxPicker</code><p>A picker allowing to expose several checkboxes and select some of them within the others. Each checkbox contains a “tag”, i.e. a supposed to be unique value. The picker will expose the choosen values using this “tag”. It has also some configuration elements which will override the one applied to nested <a href="misocheckboxitem/index.html"><code>MISOCheckboxItem</code></a> (divider, read only and error mode, layout and outlined)</p></a></li><li><a href="misocheckboxpickerdata/index.html"><code>struct MISOCheckboxPickerData</code><p>The data to use to populate the picker of <a href="misocheckboxitem/index.html"><code>MISOCheckboxItem</code></a> objects. Each property in this <a href="misocheckboxpickerdata/index.html"><code>MISOCheckboxPickerData</code></a> is used to define the suitable <a href="misocheckboxitem/index.html"><code>MISOCheckboxItem</code></a>.</p></a></li><li><a href="misochippicker/index.html"><code>struct MISOChipPicker</code><p>A picker allowing to expose several <i>filter chips</i> and proposing single or multiple selections.</p></a></li><li><a href="misochippickerdata/index.html"><code>struct MISOChipPickerData</code><p>The data to use to populate the picker of <a href="misofilterchip/index.html"><code>MISOFilterChip</code></a> objects. Each property in this <a href="misochippickerdata/index.html"><code>MISOChipPickerData</code></a> is used to define the suitable <a href="misofilterchip/index.html"><code>MISOFilterChip</code></a>.</p></a></li><li><a href="misocircularprogressindicator/index.html"><code>struct MISOCircularProgressIndicator</code><p>A circular indicator shows the progress of a task using a circle. It can show a specific value (determinate) or just that something is in progress (indeterminate). Useful when you need more visual focus or when space is limited.</p></a></li><li><a href="misocode/index.html"><code>struct MISOCode</code><p>Text component used to render <i>code snippets</i> and technical values using a monospaced typography.</p></a></li><li><a href="misocoloredsurface/index.html"><code>struct MISOColoredSurface</code><p>Used to define if a content is used on a colored surface.</p></a></li><li><a href="misocoloredsurfacemodifier/index.html"><code>struct MISOColoredSurfaceModifier</code><p><code>ViewModifier</code> which helps to apply a predefined color mode on a view. This mode is based on <code>MISOColoredSurface.SurfaceColor</code> and defines which tyê of color scheme and monochrome must be considered.</p></a></li><li><a href="misodisplay/index.html"><code>struct MISODisplay</code><p>Text component providing the largest typography styles of the design system. It is used for the most prominent titles like hero sections, splash screens or top-level page headlines.</p></a></li><li><a href="misofilterchip/index.html"><code>struct MISOFilterChip</code><p>Filter chip is a UI element that allows to select or deselect an option within a series, and is commonly used to capture filtering decisions. Filter chip allows to filter content by being selected or deselected. It can be toggled “On” or “Off” to refine displayed results, and selected Filter Chips remain visually distinct to indicate active filters.</p></a></li><li><a href="misofixedicon/index.html"><code>struct MISOFixedIcon</code><p>Defines an image based on <a href="misoimage/index.html"><code>MISOImage</code></a> with with a fixed size</p></a></li><li><a href="misoheading/index.html"><code>struct MISOHeading</code><p>Text component used to structure the hierarchy of a screen. Four sizes are available; the largest (<code>.large</code>) can optionally display a <b>marker</b>, i.e. a small brand-coloured rectangle rendered below the text (when the current theme declares it supports one).</p></a></li><li><a href="misohorizontaldivider/index.html"><code>struct MISOHorizontalDivider</code><p>Divider is a UI element that allows to structure the content by visually separating the content zones. Divider improves readability and content organization without introducing a stronger visual hierarchy like a heading or a container would. A horizontal Divider is used to separate content laid out one under the other (<code>VStack</code>). The divider can be colored using dedicated <a href="misodividercolor/index.html"><code>MISODividerColor</code></a> colors. The thickness (height) is fixed by dedicated token from <code>MISOTheme</code>.</p></a></li><li><a href="misoimage/index.html"><code>struct MISOImage</code><p>Use to provide an asset to miso in order to be added in some components. The icon can be flipped for RTL consideration and an associated <code>acessibilityLabel</code>must be provided if the icon is not decorative.</p></a></li><li><a href="misoinlinealert/index.html"><code>struct MISOInlineAlert</code><p>Inline alert is a lightweight UI element, placed in the content flow, that displays information, system feedback, status changes throughout short, prominent, persistent and non actionable communication. Inline alert includes functional icon and semantic colour, and does not include a close button and/or action link. Inline alert does not disappear and remains visible.</p></a></li><li><a href="misoinputtag/index.html"><code>struct MISOInputTag</code><p>Input tag is a UI element that allows to enter multiple values, each represented as a tag. As users type and submit values (usually by pressing enter, comma, or tab), each value is transformed into a tag. Input tag is often used for adding labels, categories, or participants.</p></a></li><li><a href="misointeractionbutton/index.html"><code>struct MISOInteractionButton</code><p><a href="misointeractionbutton/index.html"><code>MISOInteractionButton</code></a> defines how a tappable component can be defined with several interaction states. Remark: If the <i>isReadOnly</i> flag is true the action on the button is dropped.</p></a></li><li><a href="misointeractionbuttonstyle/index.html"><code>struct MISOInteractionButtonStyle</code><p>The SwiftUI <code>ButtonStyle</code> to compute the interaction state <a href="misobuttoninteractionstate/index.html"><code>MISOButtonInteractionState</code></a> and send it to the provided content builder. To compute this state, some elements are needed:</p></a></li><li><a href="misolabel/index.html"><code>struct MISOLabel</code><p>Text component used for short labels attached to controls, form fields, chips, tags, captions and so on.</p></a></li><li><a href="misolegacylayoutmodifier/index.html"><code>struct MISOLegacyLayoutModifier</code><p><code>ViewModifier</code> to manage an edge case about Liquid Glass configuration of Apple OS and Xcode versions.</p></a></li><li><a href="misolinearprogressindicator/index.html"><code>struct MISOLinearProgressIndicator</code><p>A linear indicator shows the progress of a task using a horizontal line. It can show a specific value (determinate) or just that something is in progress (indeterminate). Best used inside layouts to show progress.</p></a></li><li><a href="misolink/index.html"><code>struct MISOLink</code><p>Link is a UI element that allows to navigate from one location to another, either within the same page or across different pages in the same resource, or to an external resource. Link’s primary function is navigation and it communicates its interactive nature visually and semantically.</p></a></li><li><a href="misoliquidglasstabview/index.html"><code>struct MISOLiquidGlassTabView</code><p>A tab view component for iOS 26+ that accepts native SwiftUI <code>Tab</code> items including <code>Tab(role: .search)</code>, while applying the full MISO tab bar appearance — colors, typography and top divider.</p></a></li><li><a href="misolistitemavatar/index.html"><code>struct MISOListItemAvatar</code><p>An avatar element that can be used at the leading or trailing position of a list item such as <a href="misostaticlistitem/index.html"><code>MISOStaticListItem</code></a> or <a href="misonavigationlistitem/index.html"><code>MISONavigationListItem</code></a>.</p></a></li><li><a href="misolistitemdata/index.html"><code>struct MISOListItemData</code><p>Represents the main content displayed within a list item component such as <a href="misostaticlistitem/index.html"><code>MISOStaticListItem</code></a> or <a href="misonavigationlistitem/index.html"><code>MISONavigationListItem</code></a>.</p></a></li><li><a href="misolistitemflag/index.html"><code>struct MISOListItemFlag</code><p>An country flag element that can be used at the leading or trailing position of a list item such as <a href="misostaticlistitem/index.html"><code>MISOStaticListItem</code></a> or <a href="misonavigationlistitem/index.html"><code>MISONavigationListItem</code></a>.</p></a></li><li><a href="misolistitemicon/index.html"><code>struct MISOListItemIcon</code><p>An icon element that can be used at the leading or trailing position of a list item such as <a href="misostaticlistitem/index.html"><code>MISOStaticListItem</code></a> or <a href="misonavigationlistitem/index.html"><code>MISONavigationListItem</code></a>.</p></a></li><li><a href="misolistitemimage/index.html"><code>struct MISOListItemImage</code><p>An icon element that can be used at the leading or trailing position of a list item such as <a href="misostaticlistitem/index.html"><code>MISOStaticListItem</code></a> or <a href="misonavigationlistitem/index.html"><code>MISONavigationListItem</code></a>.</p></a></li><li><a href="misonavigationlink/index.html"><code>struct MISONavigationLink</code><p>Uses an <a href="misonavigationlistitem/index.html"><code>MISONavigationListItem</code></a>  object backed by a <code>NavigationLink</code> so as to use easily the navigation list item from MISO inside the navigation of the app.</p></a></li><li><a href="misonavigationlistitem/index.html"><code>struct MISONavigationListItem</code><p>A list item component used to display a row of interactive, navigable content within a list.</p></a></li><li><a href="misonavigationstack/index.html"><code>struct MISONavigationStack</code><p>Use a navigation stack to present a stack of views over a root view. and let system applies theme colors on navigation bar appearance.</p></a></li><li><a href="misopasswordinput/index.html"><code>struct MISOPasswordInput</code><p>Password input is a UI element that allows to securely and confidentially capture a user’s password. As it is based on the <code>MISOTextInput</code>,  it offers same layout and the same elements of configuration.</p></a></li><li><a href="misopincodeinput/index.html"><code>struct MISOPinCodeInput</code><p>PIN code input is a UI element that allows to capture short, fixed-length numeric codes, typically for authentication or confirmation purposes, such as a four, six or eight-digit personal identification number (PIN). PIN code input is presented as a series of individual input fields or boxes, each representing a single digit, to enhance readability and encourage accurate input, while supporting smooth keyboard navigation and secured input masking if needed.</p></a></li><li><a href="misoradio/index.html"><code>struct MISORadio</code><p>Radio button is a UI element that allows to select a single option from a set of mutually exclusive choices. Radio button that does not show icon or text, provides greater flexibility when creating other components that require a Radio button to be displayed.</p></a></li><li><a href="misoradioitem/index.html"><code>struct MISORadioItem</code><p>Radio button item is a UI element that allows to select a single option from a set of mutually exclusive choices. Radio button item covers a wider range of contexts by allowing to toggle the visibility of additional text labels and icon assets.</p></a></li><li><a href="misoradiopicker/index.html"><code>struct MISORadioPicker</code><p>A picker allowing to expose several radio buttons and choose only one within the others. Each radio button contains a “tag”, i.e. a supposed to be unique value. The picker will expose the choosen value through this “tag”. It has also some configuration elements which will override the one applied to nested <a href="misoradioitem/index.html"><code>MISORadioItem</code></a> (divider, read only and error mode, layout and outlined)</p></a></li><li><a href="misoradiopickerdata/index.html"><code>struct MISORadioPickerData</code><p>The data to use to populate the picker of <a href="misoradioitem/index.html"><code>MISORadioItem</code></a> objects. Each property in this <a href="misoradiopickerdata/index.html"><code>MISORadioPickerData</code></a> is used to define the suitable <a href="misoradioitem/index.html"><code>MISORadioItem</code></a>.</p></a></li><li><a href="misoshstack/index.html"><code>struct MISOSHStack</code><p>Creates an <code>HStack</code> with spacing scaled according to <code>horizontalSizeClass</code> base on MISO <code>MultipleSpaceSemanticToken</code>.</p></a></li><li><a href="misoscaledicon/index.html"><code>struct MISOScaledIcon</code><p>Defines an image based on <a href="misoimage/index.html"><code>MISOImage</code></a> with with a dynamic size depending to <code>ScaledMetric</code></p></a></li><li><a href="misostaticlistitem/index.html"><code>struct MISOStaticListItem</code><p>A list item component used to display a row of static (non-interactive, non-navigable) content within a list.</p></a></li><li><a href="misosuggestionchip/index.html"><code>struct MISOSuggestionChip</code><p>Suggestion chip is a UI element that allows to present recommended or predictive options based on user’s input or context, and is commonly used to capture filtering decisions. Suggestion chip is typically non-selected by default and can be tapped or clicked to apply the suggestion, streamlining input and enhancing usability. Chips can show multiple interactive elements together in the same area, such as a list of selectable movie times, or a serie of email contacts. Best suited for category-based filters that do not require additional visual elements.</p></a></li><li><a href="misoswitch/index.html"><code>struct MISOSwitch</code><p>Switch is a UI element that allows to toggle between two states, typically “On” and “Off”, and used to enable or disable features, options or settings. Switch that does not show icon or text, provides greater flexibility when creating other components that require a Switch to be displayed.</p></a></li><li><a href="misoswitchitem/index.html"><code>struct MISOSwitchItem</code><p>Switch item is a UI element that allows to toggle between two states, typically “On” and “Off”, and used to enable or disable features, options or settings. Switch Item covers a wider range of contexts by allowing to toggle the visibility of additional text labels and icon assets.</p></a></li><li><a href="misotabbar/index.html"><code>struct MISOTabBar</code><p>The Tab bar is a system navigation component with a position which can vary depending to the OS. The tab bar can be found at the bottom of the screen for iOS. It can vary for iPadOS. It allows users to switch between the sections of an app. Each tab can be represented by a label, optionally paired with an icon, and maintains persistent visibility across top-level destinations.</p></a></li><li><a href="misotabbarviewmodifier/index.html"><code>struct MISOTabBarViewModifier</code><p>Defines the look and feel the tab bar must have by applying the MISO tokens. Changes only colors and typgraphies, and does not add additional items like indicator of selected tab or divider. To use these elements in your tab view, use instead <a href="misotabbar/index.html"><code>MISOTabBar</code></a>.</p></a></li><li><a href="misotabview/index.html"><code>struct MISOTabView</code><p>A tab view component that accepts native SwiftUI <code>Tab</code> items (iOS 18+) while applying the full MISO tab bar appearance — colors, typography, top divider and selected-tab indicator — just like <a href="misotabbar/index.html"><code>MISOTabBar</code></a>.</p></a></li><li><a href="misotag/index.html"><code>struct MISOTag</code><p>Tag is a UI element that allows to display short info like a label, keyword, or category. Tag helps users quickly find, group, or understand content.</p></a></li><li><a href="misotextarea/index.html"><code>struct MISOTextArea</code><p>Text area is a UI element that allows to type, edit, or select longer blocks of textual data, such as comments, messages or descriptions; by expanding vertically and offering more space to input text. It provides a visual and interactive affordance for multiline text entry while supporting labels, placeholders, descriptions, and validation feedback.</p></a></li><li><a href="misotextinput/index.html"><code>struct MISOTextInput</code><p>Text input is a UI element that allows to enter, edit, or select single-line textual data. Text input is one of the most fundamental form elements used to capture user input such as names, emails, passwords, or search queries. It provides a visual and interactive affordance for text entry while supporting labels, placeholders, icons, descriptions, and validation feedback.</p></a></li><li><a href="misotoolbarbottom/index.html"><code>struct MISOToolBarBottom</code><p>The bottom toolbar is a kind of navigation bar component used to display leading and trailing actions at the bottom of the screen when supported.</p></a></li><li><a href="misotoolbaritem/index.html"><code>struct MISOToolBarItem</code><p>A strongly typed toolbar item container used inside:</p></a></li><li><a href="misotoolbartop/index.html"><code>struct MISOToolBarTop</code><p>The top toolbar (aka <i>navigation bar</i> on iOS and iPadOS 18 and lower) sits at the top of the screen and provides contextual information and controls related to the current view. It typically displays the page title, and may include navigation actions such as “Back” or “Close” as well as supplementary actions. It can contain leading, principal (center, single item only), and trailing actions.</p></a></li><li><a href="misovstack/index.html"><code>struct MISOVStack</code><p>Creates a <code>VStack</code> with spacing scaled according to <code>verticalSizeClass</code> base on MISO <code>MultipleSpaceSemanticToken</code>.</p></a></li><li><a href="misoverticaldivider/index.html"><code>struct MISOVerticalDivider</code><p>Divider is a UI element that allows to structure the content by visually separating the content zones. Divider improves readability and content organization without introducing a stronger visual hierarchy like a heading or a container would. A vertical Divider is used to separate content laid out side by side (<code>HStack</code>). The divider can be colored using dedicated <a href="misodividercolor/index.html"><code>MISODividerColor</code></a> colors. The thickness (width) is fixed by dedicated token from <code>MISOTheme</code>.</p></a></li></ul><h3>Type Aliases</h3><ul><li><a href="nativefont/index.html"><code>typealias NativeFont</code><p>For MISO a <code>NativeFont</code> on macOS is a <code>NSFont</code></p></a></li></ul><h3>Enumerations</h3><ul><li><a href="accessibilityfocusable/index.html"><code>enum AccessibilityFocusable</code><p>Value to use as a <code>AccessibilityFocusState</code> to request focus.</p></a></li><li><a href="imageloadphase/index.html"><code>enum ImageLoadPhase</code><p>Represents the loading phase of an async image.</p></a></li><li><a href="misoalertstatus/index.html"><code>enum MISOAlertStatus</code><p>The status of the alerts. <a href="misoalertmessage/index.html"><code>MISOAlertMessage</code></a> background color and its icon color are based on this status. <a href="misoinlinealert/index.html"><code>MISOInlineAlert</code></a> icon and text color are based on this status.</p></a></li><li><a href="misobulletlistitembuilder/index.html"><code>enum MISOBulletListItemBuilder</code><p>A custom parameter attribute that constructs <code>MISOBulletList.Item</code> from closures.</p></a></li><li><a href="misobuttoninteractionstate/index.html"><code>enum MISOButtonInteractionState</code><p>The interaction state used by modifiers to handle all states of the indicator. Any MISO components should manage all these cases.</p></a></li><li><a href="misocheckboxindicatorstate/index.html"><code>enum MISOCheckboxIndicatorState</code><p>A checkbox indicator has three available states: <code>selected</code>, <code>unselected</code> and <code>indeterminate</code></p></a></li><li><a href="misocheckboxpickerplacement/index.html"><code>enum MISOCheckboxPickerPlacement</code><p>Enumerates the types of layouts a <a href="misocheckboxpicker/index.html"><code>MISOCheckboxPicker</code></a> can have</p></a></li><li><a href="misochipinteractionstate/index.html"><code>enum MISOChipInteractionState</code><p>The state used by modifiers to handle all states of the chip components. Combined with an interaction button, defines the available states for a component of a chip family.</p></a></li><li><a href="misodividercolor/index.html"><code>enum MISODividerColor</code><p>List of colors available for dividers (i.e. <code>MISOHorizontalDivider</code> or <code>MISOVerticalDivider</code>)</p></a></li><li><a href="misolistitemcontainersalignment/index.html"><code>enum MISOListItemContainersAlignment</code><p>Defines the vertical alignment of the leading, trailing, and text containers within a list item such as <a href="misostaticlistitem/index.html"><code>MISOStaticListItem</code></a> or <a href="misonavigationlistitem/index.html"><code>MISONavigationListItem</code></a>.</p></a></li><li><a href="misolistitemcontentstyle/index.html"><code>enum MISOListItemContentStyle</code><p>Defines the visual style of a list item such as <a href="misostaticlistitem/index.html"><code>MISOStaticListItem</code></a> or <a href="misonavigationlistitem/index.html"><code>MISONavigationListItem</code></a>.</p></a></li><li><a href="misolistitemleading/index.html"><code>enum MISOListItemLeading</code><p>Defines the elements that can be displayed at the leading position (before the texts) of a list item such as <a href="misostaticlistitem/index.html"><code>MISOStaticListItem</code></a> or <a href="misonavigationlistitem/index.html"><code>MISONavigationListItem</code></a>.</p></a></li><li><a href="misolistitemsize/index.html"><code>enum MISOListItemSize</code><p>Defines the size of a list item such as <a href="misostaticlistitem/index.html"><code>MISOStaticListItem</code></a> or <a href="misonavigationlistitem/index.html"><code>MISONavigationListItem</code></a>.</p></a></li><li><a href="misolistitemtrailing/index.html"><code>enum MISOListItemTrailing</code><p>Defines the elements that can be displayed at the trailing position (after the texts) of a list item such as <a href="misostaticlistitem/index.html"><code>MISOStaticListItem</code></a> or <a href="misonavigationlistitem/index.html"><code>MISONavigationListItem</code></a>.</p></a></li><li><a href="misonavigationlistitemindicatortype/index.html"><code>enum MISONavigationListItemIndicatorType</code><p>The navigation indicator, describing the type of navigation triggered when the item is tapped.</p></a></li><li><a href="misoprogressindicatorgapsize/index.html"><code>enum MISOProgressIndicatorGapSize</code><p>The size of the gap between the progress bar and the track.</p></a></li><li><a href="misoprogressindicatorstatus/index.html"><code>enum MISOProgressIndicatorStatus</code><p>The status of the progress indicator. It determines the color of the bar.</p></a></li><li><a href="misoradiopickerplacement/index.html"><code>enum MISORadioPickerPlacement</code><p>Enumerates the types of layouts a <a href="misoradiopicker/index.html"><code>MISORadioPicker</code></a> can have</p></a></li><li><a href="misotoolbaritemsbuilder/index.html"><code>enum MISOToolBarItemsBuilder</code><p>A result builder to group <a href="misotoolbaritem/index.html"><code>MISOToolBarItem</code></a> instances.</p></a></li></ul><h3>Extended Modules</h3><ul><li><a href="foundation/index.html"><code></code></a></li><li><a href="swift/index.html"><code></code></a></li><li><a href="swiftui/index.html"><code></code></a></li><li><a href="swiftuicore/index.html"><code></code></a></li></ul></article></noscript><div id="app"></div></body></html>
