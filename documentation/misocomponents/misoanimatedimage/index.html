<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>MISOAnimatedImage</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="`MISOAnimatedImage` is a SwiftUI view able to play animated GIF and WebP images." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>MISOAnimatedImage</li></ul><p>Structure</p><h1>MISOAnimatedImage</h1><p><code>MISOAnimatedImage</code> is a SwiftUI view able to play animated <b>GIF</b> and <b>WebP</b> images.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>@MainActor struct MISOAnimatedImage</code></pre></section><h2>Overview</h2><p>Remote animated images are downloaded and cached (memory + disk) using <code>MISOAsyncImageCache</code>.</p><h2>Providing a local GIF or WebP file</h2><p>Animated images <b>must not</b> be added to an <code>.xcassets</code> catalog: Asset Catalogs only keep the first frame of an animated GIF or WebP, discarding the animation. Instead, add the <code>.gif</code>/<code>.webp</code> file to the app (or module) target as a plain bundle resource:</p><ol><li><p>Drag &amp; drop the file into the Xcode project navigator.</p></li><li><p>In the dialog, check <b>“Copy items if needed”</b>.</p></li><li><p>Make sure the file’s <b>Target Membership</b> includes your app/module target.</p></li><li><p>Load it with <a href="init(named:withextension:bundle:)/index.html"><code>init(named:withExtension:bundle:)</code></a>, see below.</p></li></ol><h2>Accessibility and ecodesign</h2><p>To respect the user’s preferences and save battery, the animation automatically pauses on its first frame when:</p><ul><li><p>“Reduce Motion” accessibility setting is enabled, or</p></li><li><p>Low Power Mode is enabled.</p></li></ul><blockquote class="aside note"><p class="label">Note</p><p>Low Power Mode detection relies on <code>MISOLowPowerModeObserver</code>, injected as an environment object by <code>MISOThemeableView</code>. Make sure <code>MISOAnimatedImage</code> is used inside a view hierarchy rooted by <code>MISOThemeableView</code> for this behavior to work.</p></blockquote><h2>Code samples</h2><pre class="swift"><code>    // From a remote URL (downloaded once, then cached)
    MISOAnimatedImage(url: URL(string: "https://example.com/animation.gif"))

    // From a local file bundled with the app ("loading_spinner.gif" in the main bundle)
    MISOAnimatedImage(named: "loading_spinner", withExtension: "gif")

    // From a local file bundled with a Swift Package module ("product_teaser.webp" in .module)
    MISOAnimatedImage(named: "product_teaser", withExtension: "webp", bundle: .module)

    // From local data already loaded by the caller (e.g. downloaded and cached elsewhere)
    MISOAnimatedImage(data: myWebPData)
</code></pre><blockquote class="aside since"><p class="label">Since</p><p>OUDS 3.0.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(data:)/index.html"><code>init(data: Data)</code><p>Creates an animated image from local <code>data</code> (e.g. bytes already downloaded and cached by the caller).</p></a></li><li><a href="init(named:withextension:bundle:)/index.html"><code>init(named: String, withExtension: String?, bundle: Bundle)</code><p>Creates an animated image loaded from a local <b>GIF</b> or <b>WebP</b> file bundled with the application (or a Swift Package module).</p></a></li><li><a href="init(url:)/index.html"><code>init(url: URL?)</code><p>Creates an animated image loaded and cached from the given <code>url</code>.</p></a></li></ul><h3>Instance Properties</h3><ul><li><a href="body/index.html"><code>var body: some View</code></a></li></ul></article></noscript><div id="app"></div></body></html>
