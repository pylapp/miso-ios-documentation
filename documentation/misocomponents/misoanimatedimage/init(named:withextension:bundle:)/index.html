<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>init(named:withExtension:bundle:)</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="Creates an animated image loaded from a local GIF or WebP file bundled with the application (or a Swift Package module)." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../index.html">Components</a></li><li><a href="../index.html">MISOAnimatedImage</a></li><li>init(named:withExtension:bundle:)</li></ul><p>Initializer</p><h1>init(named:withExtension:bundle:)</h1><p>Creates an animated image loaded from a local <b>GIF</b> or <b>WebP</b> file bundled with the application (or a Swift Package module).</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>@MainActor init(named name: String, withExtension extension: String? = nil, bundle: Bundle = .main)</code></pre></section><h2>Parameters</h2><dl><dt>name</dt><dd><p>The file name of the animated image, without its extension (e.g. <code>"loading_spinner"</code>)</p></dd><dt>extension</dt><dd><p>The file extension, e.g. <code>"gif"</code> or <code>"webp"</code>. Pass <code>nil</code> to let the system pick the first resource matching <code>name</code> regardless of its extension. Defaults to <code>nil</code>.</p></dd><dt>bundle</dt><dd><p>The bundle containing the resource. Defaults to <code>.main</code>.</p></dd></dl><h2>Discussion</h2><p>The file <b>must not</b> be added inside an <code>.xcassets</code> catalog: Asset Catalogs only keep the first frame of an animated image, discarding the animation. Instead, add it to the target as a plain bundle resource (drag &amp; drop into the Xcode target, checking “Copy items if needed” and the target membership).</p><pre class="swift"><code>    // "loading_spinner.gif" added as a bundle resource of the main target
    MISOAnimatedImage(named: "loading_spinner", withExtension: "gif")

    // "product_teaser.webp" bundled in a Swift Package module resource
    MISOAnimatedImage(named: "product_teaser", withExtension: "webp", bundle: .module)

    // Extension omitted: the first resource matching the name, whatever its extension, is used
    MISOAnimatedImage(named: "loading_spinner")
</code></pre></article></noscript><div id="app"></div></body></html>
