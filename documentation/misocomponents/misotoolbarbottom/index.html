<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>MISOToolBarBottom</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="The bottom toolbar is a kind of navigation bar component used to display leading and trailing actions at the bottom of the screen when supported." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>MISOToolBarBottom</li></ul><p>Structure</p><h1>MISOToolBarBottom</h1><p>The bottom toolbar is a kind of navigation bar component used to display leading and trailing actions at the bottom of the screen when supported.</p><ul id="availability"><li>iOS 15.0+</li><li>visionOS 1.0+</li></ul><pre><code>@MainActor struct MISOToolBarBottom</code></pre></section><h2>Overview</h2><p><code>toolBarBottom</code> View helper applies a SwiftUI toolbar configuration.</p><h2>Platform considerations</h2><ul><li><p>Available on iOS, iPadOS, and visionOS</p></li><li><p>Not available on watchOS, tvOS and macOS</p></li></ul><h2>Guidelines</h2><ul><li><p>Test the use of the <code>toolBarBottom</code> for both iOS with Liquid Glass and not Liquid Glass</p></li><li><p>If you use both an  <a href="../misotabbar/index.html"><code>MISOTabBar</code></a> with the <code>toolBarBottom</code>, the toolbar will be above the tabbar for iOS lower than 26, <b>not recommended</b></p></li><li><p>If you use both an  <a href="../misotabbar/index.html"><code>MISOTabBar</code></a> with the <code>toolBarBottom</code>, the toolbar will be <b>behind</b> the tabbar for iOS 26+, so not usable, <b>not recommended</b></p></li><li><p>Avoid use of both <code>toolBarBottom</code> and <a href="../misotabbar/index.html"><code>MISOTabBar</code></a> in the same page</p></li></ul><h2>Badges uses</h2><p>Because the system does not render system badge for items in bottom toolbar, the MISO badge component is used for iOS 26 with Liquid Glass and bottom toolbars. However the glassified effect of Liquid Glass does not make sometimes the badge readable, that is the reason why you should use badge for bottom toolbars with lots of care and prefer <i>prominent</i> or <i>tinted</i> styles for the item with the badge instead of <i>default</i>.</p><p>For iOS until 18 and without Liquid Glass the MISO badge components are always used.</p><h2>Code samples</h2><p>Define leading and trailing items for the bottom toolbar</p><pre class="swift"><code>    SomeView()
        .toolBarBottom(leadingItems: {
                MISOToolBarItem(label: "Some label") { /* Action to process */ }
            }, trailingItems: {
                MISOToolBarItem(icon: Image(decorative: "some_image"), accessibilityLabel: "Label") { /* Action to process */ }
        })
</code></pre><blockquote class="aside since"><p class="label">Since</p><p>OUDS 1.4.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(groupeditems:)/index.html"><code>init(groupedItems: () -&gt; [MISOToolBarItem])</code><p><code>ViewModifier</code> to define an MISO bottom toolbar.</p></a></li><li><a href="init(leadingitems:trailingitems:)/index.html"><code>init(leadingItems: () -&gt; [MISOToolBarItem], trailingItems: () -&gt; [MISOToolBarItem])</code><p><code>ViewModifier</code> to define an MISO bottom toolbar.</p></a></li></ul><h3>Instance Methods</h3><ul><li><a href="body(content:)/index.html"><code>func body(content: MISOToolBarBottom.Content) -&gt; some View
</code></a></li></ul></article></noscript><div id="app"></div></body></html>
