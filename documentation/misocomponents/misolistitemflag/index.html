<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>MISOListItemFlag</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="An country flag element that can be used at the leading or trailing position of a list item such as ``doc://MISOComponents/documentation/MISOComponents/MISOStaticListItem`` or ``doc://MISOComponents/documentation/MISOComponents/MISONavigationListItem``." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>MISOListItemFlag</li></ul><p>Structure</p><h1>MISOListItemFlag</h1><p>An country flag element that can be used at the leading or trailing position of a list item such as <a href="../misostaticlistitem/index.html"><code>MISOStaticListItem</code></a> or <a href="../misonavigationlistitem/index.html"><code>MISONavigationListItem</code></a>.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>@MainActor struct MISOListItemFlag</code></pre></section><h2>Overview</h2><p><a href="."><code>MISOListItemFlag</code></a> displays a country flag (i.e. image)</p><h2>Code samples</h2><pre class="swift"><code>    // Country flag with medium size (default)
    MISOListItemFlag(asset: Image(decorative: "il_flag_fr"), description: "France")

    // Usage as leading element in a list item
    MISOStaticListItem(
        data: MISOListItemData(label: "Information"),
        leading: .flag(.init(asset: Image(decorative: "il_flag_fr"), description: "France"))
    )

    // Usage as trailing element in a list item
    MISOStaticListItem(
        data: MISOListItemData(label: "Warning"),
        trailing: .flag(.init(asset: Image(decorative: "il_flag_fr"), description: "France"))
    )
</code></pre><blockquote class="aside since"><p class="label">Since</p><p>OUDS 3.0.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(asset:description:)/index.html"><code>init(asset: Image, description: String)</code><p>Creates an icon element for use in a list item at the leading or trailing position.</p></a></li></ul><h3>Instance Properties</h3><ul><li><a href="body/index.html"><code>var body: some View</code></a></li></ul></article></noscript><div id="app"></div></body></html>
