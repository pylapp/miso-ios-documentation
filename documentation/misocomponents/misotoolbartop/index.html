<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>MISOToolBarTop</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="The top toolbar (aka navigation bar on iOS and iPadOS 18 and lower) sits at the top of the screen and provides contextual information and controls related to the current view. It typically displays the page title, and may include navigation actions such as “Back” or “Close” as well as supplementary actions. It can contain leading, principal (center, single item only), and trailing actions." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>MISOToolBarTop</li></ul><p>Structure</p><h1>MISOToolBarTop</h1><p>The top toolbar (aka <i>navigation bar</i> on iOS and iPadOS 18 and lower) sits at the top of the screen and provides contextual information and controls related to the current view. It typically displays the page title, and may include navigation actions such as “Back” or “Close” as well as supplementary actions. It can contain leading, principal (center, single item only), and trailing actions.</p><ul id="availability"><li>iOS 15.0+</li><li>visionOS 1.0+</li></ul><pre><code>@MainActor struct MISOToolBarTop</code></pre></section><h2>Overview</h2><p><b>Warning</b>: If an item is placed in principal position, the subtitle is never displayed (whatever <code>hasLargeTitle</code> is), because SwiftUI’s <code>.principal</code> placement only replaces the inline compact bar title, not <code>.navigationSubtitle()</code> (iOS 26+), which would otherwise keep rendering next to the item with no visible title next to it. The title itself is displayed only if <code>hasLargeTitle</code> is <code>true</code> (in that case it appears below the bar, in large title mode, not inside it).</p><h2>Appearances</h2><p>With Liquid Glass / iOS 26+ the OS will change the rendering of the toolbar items depending to the context:</p><ul><li><p>The OS can group the items of same types in one group with kind of rectangle (e.g. views with menus)</p></li><li><p>But for buttons items they will remain isolated</p></li><li><p>The placement of the title can be leading or centered depending to the length of the text</p></li><li><p>The text can be truncated if there is not enough remaining space</p></li><li><p>The OS can apply another style for the back button</p></li></ul><p>Without Liquid Glass / iOS 18 and lower, the OS won’t change that much the style of the toolbar items, Items won’t be visually grouped.</p><p>Globaly the appearence of the * navigation bar* elements is changed by the <code>misoNavigationBarAppearance</code> helper of <code>View</code> that must be applyed on the root view of the <code>NavigationStack</code> for example.</p><h2>Technical constraints</h2><p>To be sure for iOS 18 and lower the back buttton and text have the good color, in your main view apply the following accent color:</p><pre class="swift"><code>    struct AppMainView: View {
        var body: some View {
            ContentView()
                .accentColor(theme.colors.contentDefault)
        }
    }
</code></pre><h2>Platform considerations</h2><ul><li><p>The component is available on iOS, iPadOS, and visionOS</p></li><li><p>The component is not available for watchOS, tvOS and macOS</p></li></ul><h2>Badges uses</h2><p>For iOS 26 with Liquid Glass, the system badge is used because the MISO badge component does not provide a suitable rendering with the glassified effect applied on the top toolbar. For iOS until 18 and without Liquid Glass  MISO badge component is always used.</p><h2>Code sample</h2><pre class="swift"><code>    ContentView()
        .toolBarTop("Title",
            leadingItems: {
                MISOToolBarItem(navigation: .back())
            },
            principalItem: MISOToolBarItem(icon: Image(decorative: "search"), accessibilityLabel: "Search") { /* Action to process */ },
            trailingItems: {
                MISOToolBarItem(label: "Label") { /* Action to process */ }
                MISOToolBarItem(icon: Image(decorative: "some_image"), accessibilityLabel: "Label") { /* Action to process */ }
            }
        )
</code></pre><p>A <code>View</code> helper can also be used to apply a SwiftUI toolbar configuration.</p><pre class="swift"><code>    toolBarTop(_:hasLargeTitle:subtitle:leadingItems:principalItem:trailingItems:)
</code></pre><blockquote class="aside version"><p class="label">Version</p><p>1.1.0 (Figma component design version)</p></blockquote><blockquote class="aside since"><p class="label">Since</p><p>OUDS 1.4.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(title:haslargetitle:subtitle:leadingitems:principalitem:trailingitems:)/index.html"><code>init(title: String, hasLargeTitle: Bool, subtitle: String?, leadingItems: () -&gt; [MISOToolBarItem], principalItem: MISOToolBarItem?, trailingItems: () -&gt; [MISOToolBarItem])</code><p><code>ViewModifier</code> to define an MISO top toolbar.</p></a></li></ul><h3>Instance Methods</h3><ul><li><a href="body(content:)/index.html"><code>func body(content: MISOToolBarTop.Content) -&gt; some View
</code></a></li></ul></article></noscript><div id="app"></div></body></html>
