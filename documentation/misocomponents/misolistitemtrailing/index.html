<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>MISOListItemTrailing</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="Defines the elements that can be displayed at the trailing position (after the texts) of a list item such as ``doc://MISOComponents/documentation/MISOComponents/MISOStaticListItem`` or ``doc://MISOComponents/documentation/MISOComponents/MISONavigationListItem``." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>MISOListItemTrailing</li></ul><p>Enumeration</p><h1>MISOListItemTrailing</h1><p>Defines the elements that can be displayed at the trailing position (after the texts) of a list item such as <a href="../misostaticlistitem/index.html"><code>MISOStaticListItem</code></a> or <a href="../misonavigationlistitem/index.html"><code>MISONavigationListItem</code></a>.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>@frozen enum MISOListItemTrailing</code></pre></section><h2>Overview</h2><p>The trailing element provides supplementary information, actions, or visual indicators alongside the textual content of the list item. Only one trailing element can be set at a time.</p><h2>Available options</h2><ul><li><p><code>text(_:)</code>: A textual element with various styles (see <a href="texttype/index.html"><code>MISOListItemTrailing.TextType</code></a>).</p></li><li><p><code>badge(_:)</code>: A badge component (see <a href="../misobadgestandard/index.html"><code>MISOBadgeStandard</code></a> or <a href="../misobadgecount/index.html"><code>MISOBadgeCount</code></a>).</p></li><li><p><code>tag(_:)</code>: A tag component (see <a href="../misotag/index.html"><code>MISOTag</code></a>).</p></li><li><p><code>icon(_:)</code>: A status or custom icon (see <a href="../misolistitemicon/index.html"><code>MISOListItemIcon</code></a>).</p></li><li><p><code>image(_:)</code>: A static image asset (see <a href="../misolistitemimage/index.html"><code>MISOListItemImage</code></a>).</p></li><li><p><code>flag(_:)</code>: A country flag image (see <a href="../misolistitemflag/index.html"><code>MISOListItemFlag</code></a>).</p></li><li><p><code>avatar(_:)</code>:  An avatar with icon, initials, or image (see <a href="../misolistitemavatar/index.html"><code>MISOListItemAvatar</code></a>).</p></li><li><p><code>slot(_:)</code>: Any custom SwiftUI view, e.g. any bespoke view.</p></li></ul><h2>Code samples</h2><pre class="swift"><code>    // Trailing with a default label text
    MISOStaticListItem(
        data: MISOListItemData(label: "Label"),
        trailing: .text(.label("Info"))
    )

    // Trailing with a muted label
    MISOStaticListItem(
        data: MISOListItemData(label: "Label"),
        trailing: .text(.labelMuted("Secondary"))
    )

    // Trailing with label and extra label
    MISOStaticListItem(
        data: MISOListItemData(label: "Label"),
        trailing: .text(.labelAndExtraLabel("Label", "Extra"))
    )

    // Trailing with a badge according to type
    MISOStaticListItem(
        data: MISOListItemData(label: "Notifications"),
        trailing: .badge(.count(.init(3, accessibilityLabel: "3 notifications", status: .negative, size: .medium)))
    )

    // Trailing with a tag
    let tag = MISOTag(label: "New", size: .small)
    MISOStaticListItem(
        data: MISOListItemData(label: "Feature"),
        trailing: .tag(tag)
    )

    // Trailing with an icon
    let icon = MISOListItemIcon(type: .info, size: .medium)
    MISOStaticListItem(
        data: MISOListItemData(label: "Label"),
        trailing: .icon(icon)
    )

    // Trailing with an image
    let image = MISOListItemImage(asset: Image("il_placeholder"), size: .medium)
    MISOStaticListItem(
        data: MISOListItemData(label: "Label"),
        trailing: .image(image)
    )

    // Trailing with a country flag
    MISOStaticListItem(
        data: MISOListItemData(label: "France"),
        trailing: .flag(.init(asset: Image("il_flag_fr"), description: "France"))
    )

    // Trailing with an avatar
    let avatar = MISOListItemAvatar(type: .initials("AB"), size: .medium)
    MISOStaticListItem(
        data: MISOListItemData(label: "Contact"),
        trailing: .avatar(avatar)
    )

    // Trailing with a custom view, e.g. a gauge showing a remaining SMS credit
    MISOStaticListItem(
        data: MISOListItemData(label: "SMS credit"),
        trailing: .custom {
            MISOCircularProgressIndicator(progress: 0.75)
        }
    )
</code></pre><h2>Media appearance</h2><p>Images can be displayed with rounded corners using the <a href="../swiftuicore/view/misolistitemroundedmedia(_:)/index.html"><code>misoListItemRoundedMedia(_:)</code></a> view modifier.</p><h2>Small size behavior</h2><p>When the list item is displayed in small size (via <a href="../swiftuicore/view/misolistitemsize(_:)/index.html"><code>misoListItemSize(_:)</code></a>):</p><ul><li><p>Trailing elements such as avatars and icons are rendered in their smallest available size.</p></li><li><p>The extra label in <a href="texttype/labelandextralabel(_:_:)/index.html"><code>MISOListItemTrailing.TextType.labelAndExtraLabel(_:_:)</code></a> is <b>ignored</b>.</p></li><li><p>The <code>.slot</code> element is not resized automatically and is <b>not displayed</b>.</p></li></ul><blockquote class="aside since"><p class="label">Since</p><p>OUDS 3.0.0</p></blockquote><h2>Topics</h2><h3>Enumeration Cases</h3><ul><li><a href="avatar(_:)/index.html"><code>case avatar(MISOListItemAvatar)</code><p>An avatar with icon, initials, or image.</p></a></li><li><a href="badge(_:)/index.html"><code>case badge(MISOListItemTrailing.BadgeType)</code><p>A badge component providing status or count information.</p></a></li><li><a href="flag(_:)/index.html"><code>case flag(MISOListItemFlag)</code><p>A country flag image.</p></a></li><li><a href="icon(_:)/index.html"><code>case icon(MISOListItemIcon)</code><p>A status or custom icon.</p></a></li><li><a href="image(_:)/index.html"><code>case image(MISOListItemImage)</code><p>A static image asset displayed at the leading position.</p></a></li><li><a href="slot(_:)-swift.enum.case/index.html"><code>case slot(AnyView)</code><p>A custom SwiftUI view displayed at the trailing position.</p></a></li><li><a href="tag(_:)/index.html"><code>case tag(MISOTag)</code><p>A tag component providing categorization or status information.</p></a></li><li><a href="text(_:)/index.html"><code>case text(MISOListItemTrailing.TextType)</code><p>A textual element with configurable style.</p></a></li></ul><h3>Type Methods</h3><ul><li><a href="slot(_:)-swift.type.method/index.html"><code>static func slot(() -&gt; some View) -&gt; MISOListItemTrailing</code><p>Creates a <a href="slot(_:)-swift.type.method/index.html"><code>slot(_:)</code></a> trailing element from a <code>@ViewBuilder</code> closure.</p></a></li></ul><h3>Enumerations</h3><ul><li><a href="badgetype/index.html"><code>enum BadgeType</code><p>The type of badge displayed.</p></a></li><li><a href="texttype/index.html"><code>enum TextType</code><p>Defines the type of trailing text displayed in the list item.</p></a></li></ul></article></noscript><div id="app"></div></body></html>
