/dt><dd><p>Whether the track is displayed. Defaults to <code>true</code>.</p></dd><dt>gapSize</dt><dd><p>The size of the gap between the indicator and the track. Defaults to <a href="../../misoprogressindicatorgapsize/default/index.html"><code>MISOProgressIndicatorGapSize.default</code></a>.</p></dd><dt>animated</dt><dd><p>When <code>true</code> (default), the indicator progressively fills from <code>0</code> to <code>progress</code> on first display, and animates any subsequent change of <code>progress</code>. When <code>false</code>, the indicator is displayed instantly at its target value with no animation. Animations are always disabled when <code>accessibilityReduceMotion</code> is on or when Low Power Mode is enabled, regardless of this flag.</p></dd><dt>size</dt><dd><p>The size of the component could be adjusted if used internally by components.</p></dd><dt>helperText</dt><dd><p>Optional helper text displayed below the indicator. Defaults to <code>nil</code>.</p></dd><dt>accessibility</dt><dd><p>Optional accessibility configuration for VoiceOver. Defaults to <code>nil</code>.</p></dd></dl></article></noscript><div id="app"></div></body></html>
