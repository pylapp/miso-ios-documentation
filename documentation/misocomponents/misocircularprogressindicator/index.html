<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>MISOCircularProgressIndicator</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="A circular indicator shows the progress of a task using a circle. It can show a specific value (determinate) or just that something is in progress (indeterminate). Useful when you need more visual focus or when space is limited." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>MISOCircularProgressIndicator</li></ul><p>Structure</p><h1>MISOCircularProgressIndicator</h1><p>A circular indicator shows the progress of a task using a circle. It can show a specific value (determinate) or just that something is in progress (indeterminate). Useful when you need more visual focus or when space is limited.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>@MainActor struct MISOCircularProgressIndicator</code></pre></section><h2>Mentioned In</h2><ul><li><a href="../indicators/index.html">Indicators</a></li></ul><h2>Variants</h2><p>Two variants are provided:</p><ul><li><p><b>Determinate</b>: the caller provides a <code>progress</code> value in <code>[0, 1]</code>. Values outside this range are coerced. Shows the exact progress of a task, usually as a percentage from 0% to 100%. Provides clear and measurable feedback, helping users understand how long the task will take and reducing uncertainty. Use determinate indicators whenever possible. Avoid indeterminate when progress can be measured, e.g. when the progress value is known (e.g. file upload, installation, data sync) or when the system can estimate completion time or percentage</p></li><li><p><b>Indeterminate</b>: no <code>progress</code> is provided and the indicator loops continuously. Shows that a process is active without indicating exact progress. Used when the system cannot determine how long the task will take. Communicates that the system is working, even without precise data, and prevents users from thinking the interface is frozen. For long loading times (over 5 seconds), additional context must be provided. This helps inform users about the system state, reduces uncertainty, and prevents the interface from being perceived as unresponsive.</p></li></ul><h2>Statuses</h2><ul><li><p><b>Neutral</b>: default status used when progress has no specific semantic meaning. Suitable for generic loading, processing, synchronization or background tasks.</p></li><li><p><b>Accent</b>: used to highlight primary or brand-related actions (uploads, downloads, installations, onboarding).</p></li><li><p><b>Positive</b>: indicates successful progress or a process leading to a successful outcome.</p></li><li><p><b>Info</b>: indicates informational or system-related processes (background synchronization, data retrieval).</p></li><li><p><b>Warning</b>: indicates progress related to an operation that requires user attention or should be monitored.</p></li><li><p><b>Negative</b>: indicates progress related to an error, recovery, cancellation or failure.</p></li></ul><h2>Gap size</h2><ul><li><p><b>default</b>: standard gap between the indicator and the track (about 14° of arc).</p></li><li><p><b>small</b>: reduced gap for a more compact appearance.</p></li></ul><h2>Track</h2><ul><li><p><code>true</code> (default): the track is displayed. Recommended when the indicator is shown on its own and needs a clear structure. The track helps define the full range of progress and makes the value easier to read.</p></li><li><p><code>false</code>: the track is hidden. Recommended when the indicator is embedded inside another component (button, tag, toast) or when a more minimal appearance is needed.</p></li></ul><h2>Animation (determinate mode only)</h2><p>When <code>animated</code> is <code>true</code> (default), the determinate indicator progressively fills from <code>0</code> to the target <code>progress</code> on first display, and animates any subsequent change of <code>progress</code>. When <code>animated</code> is <code>false</code>, the indicator is displayed instantly at its target value with no animation.</p><p>Animations are always disabled when <code>accessibilityReduceMotion</code> is <code>true</code> or when Low Power Mode is enabled, regardless of the <code>animated</code> flag.</p><p>The indeterminate mode is not affected by this flag: its Android Material 3 animation is intrinsic to the mode.</p><h2>Helper text</h2><p>An optional text displayed below the circular indicator to provide context or additional information. The helper text is always centered under the indicator.</p><p>In <b>determinate</b> mode, use <a href="helpertexttype/index.html"><code>MISOCircularProgressIndicator.HelperTextType</code></a> which offers two variants:</p><ul><li><p><b><code>.description(_:)</code></b>: Displays a simple description text without the progress percentage.</p></li><li><p><b><code>.percent(_:)</code></b>: Displays the progress percentage with an optional description. The percentage value and its <code>%</code> symbol are assembled through the localized wording key <code>core_progressIndicator_percent_value</code>, so the symbol, its spacing and its position follow the typographic rules of the current language (e.g. <code>"75%"</code> in English, <code>"75 %"</code> in French, <code>"٪75"</code> in Arabic).</p></li></ul><p>In <b>indeterminate</b> mode, the <code>helperText</code> parameter is a simple <code>String?</code>.</p><h2>Code samples</h2><pre class="swift"><code>    // Determinate - default (neutral, with track, default gap, reveal animation on display)
    MISOCircularProgressIndicator(progress: 0.75)

    // Determinate with an accent status and no track
    MISOCircularProgressIndicator(progress: 0.5, status: .accent, track: false)

    // Determinate with a warning status and a small gap
    MISOCircularProgressIndicator(progress: 0.3, status: .warning, gapSize: .small)

    // Determinate displayed instantly at its target value, without any animation
    MISOCircularProgressIndicator(progress: 0.75, animated: false)

    // Determinate with helper text
    MISOCircularProgressIndicator(progress: 0.75, helperText: .description("Uploading..."))

    // Determinate with percentage and description
    MISOCircularProgressIndicator(progress: 0.75,
                                  helperText: .percent("of 100 MB"))

    // Determinate with accessibility name and state for VoiceOver
    MISOCircularProgressIndicator(progress: 0.75,
                                  accessibility: .init(name: "download bar", state: "downloading"))

    // Determinate with accessibility and helper text
    MISOCircularProgressIndicator(progress: 0.5,
                                  accessibility: .init(name: "progress bar", state: "step 1 of 4"),
                                  helperText: .description("Loading..."))

    // Indeterminate
    MISOCircularProgressIndicator()
    MISOCircularProgressIndicator(status: .info)

    // Indeterminate with helper text
    MISOCircularProgressIndicator(status: .info, helperText: "Processing...")
</code></pre><h2>Accessibility considerations</h2><ul><li><p>Use the <code>accessibility</code> parameter to provide a custom name and state for VoiceOver:</p><ul><li><p><code>accessibility.name</code>: The name of the component (e.g., “progress bar”, “download bar”)</p></li><li><p><code>accessibility.state</code>: The state of the component (e.g., “downloading”, “step 1 of 4”)</p></li></ul></li><li><p>VoiceOver reads: <b>[name]. [state]. [helperText] [value]</b>. Example: <i>“download bar. downloading. 75 percent”</i></p></li><li><p>If <code>accessibility</code> is not provided, the behavior is unchanged: only the helper text (if provided) is used as label.</p></li><li><p>In <b>determinate</b> mode, the view exposes the current progress as an accessibility value (percentage) so that VoiceOver reads e.g. <i>“75 percent”</i>, and is marked with the <code>.updatesFrequently</code> trait so that assistive technologies know the value is changing.</p></li><li><p>The indicator never captures <b>Full Keyboard Access</b> focus, as no interaction is possible on a progress indicator. On iOS 17+ / macOS 14+ / visionOS 1+ / watchOS 10+ / tvOS 17+, this is enforced via <code>accessibilityRespondsToUserInteraction(false)</code>; on earlier OS versions, the semantic <code>.isStaticText</code> trait is used.</p></li><li><p>In <b>indeterminate</b> mode, the view is hidden from VoiceOver (<code>.accessibilityHidden(true)</code>) — and therefore also excluded from Full Keyboard Access navigation: there is no readable value to expose and keeping the element focusable would only pollute navigation.</p></li><li><p>Animations are disabled when <code>accessibilityReduceMotion</code> is <code>true</code> or when Low Power Mode is enabled.</p></li></ul><h2>Colored surfaces</h2><p>When placed on an <a href="../misocoloredsurface/index.html"><code>MISOColoredSurface</code></a>, the indicator switches to a <b>monochrome</b> rendering, the <code>status</code> is ignored.</p><blockquote class="aside version"><p class="label">Version</p><p>1.2.0 (Figma component design version)</p></blockquote><blockquote class="aside since"><p class="label">Since</p><p>OUDS 3.0.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(progress:status:track:gapsize:animated:size:helpertext:accessibility:)/index.html"><code>init(progress: Double, status: MISOProgressIndicatorStatus, track: Bool, gapSize: MISOProgressIndicatorGapSize, animated: Bool, size: CGFloat, helperText: MISOCircularProgressIndicator.HelperTextType?, accessibility: MISOAccessibilityConfiguration?)</code><p>Creates a <b>determinate</b> circular progress indicator.</p></a></li><li><a href="init(status:track:gapsize:size:helpertext:accessibility:)/index.html"><code>init(status: MISOProgressIndicatorStatus, track: Bool, gapSize: MISOProgressIndicatorGapSize, size: CGFloat, helperText: String?, accessibility: MISOAccessibilityConfiguration?)</code><p>Creates an <b>indeterminate</b> circular progress indicator.</p></a></li></ul><h3>Instance Properties</h3><ul><li><a href="body/index.html"><code>var body: some View</code></a></li></ul><h3>Type Properties</h3><ul><li><a href="defaultsize/index.html"><code>static let defaultSize: CGFloat</code><p>The default component size (matches the Android reference implementation and Material 3 defaults).</p></a></li></ul><h3>Enumerations</h3><ul><li><a href="helpertexttype/index.html"><code>enum HelperTextType</code><p>The helper text can be added in <b>determinate</b> indicator</p></a></li></ul></article></noscript><div id="app"></div></body></html>
