        MISOAlertMessage(label: "Label", description: "You should read this text")
        // From a localizable in a bundle
        MISOAlertMessage(LocalizedStringKey("label_wording"), bundle: Bundle.module)

        // With a rich text for the description (e.g. markdown here, do not forget to manage the errors)
        let richDescription = AttributedString(markdown: "You **must read this text**")
        MISOAlertMessage(label: "Label", description: richDescription)

        // A more complex alert message for warning status with a description and a close action
        // to dismiss the message.
        MISOAlertMessage(label: "Warning", status: .warning, description: "Some details about the warning") {
              // Do some stuff here to dismiss the alert message when clicked
        }

        // Add a custom icon for accent and neutral status
        // with original rendering mode (to avoid tints) or not.
        // By default, tinted, template mode.
        MISOAlertMessage(label: "Label", status: .accent(image: MISOImage(asset: Image("ic_heart"))))
        MISOAlertMessage(label: "Label", status: .neutral(image: MISOImage(asset: Image("ic_heart"), renderingMode: .original)))

        // Add a custom action (i.e Link) at bottom (could also at top trailing position)
        @Environment(\.openURL) private var openUrl
        let link = MISOAlertMessage.Link(text: "Action", position: .bottom) {
           openUrl.callAsFunction(url)
        }
        MISOAlertMessage(label: "Label", link: link)
</code></pre><h2>Rich text</h2><p>Only the alert message description and bullet list can use rich text.</p><p>Strong text can be used sparingly within alert messages to highlight key information. Underlined text must not be used for emphasis, as it is commonly associated with links. If a hyperlink is needed within the content, the underlined style should be used. Italic should be used with care, some brands do not allow it. No other text styles should be used.</p><h2>Accessibility considerations</h2><p>Always check the results of rich text mode with high contrast, light and dark modes, and Voice Over vocalization.</p><blockquote class="aside version"><p class="label">Version</p><p>1.1.1 (Figma component design version)</p></blockquote><blockquote class="aside since"><p class="label">Since</p><p>OUDS 1.3.0</p></blockquote><h2>Topics</h2><h3>Structures</h3><ul><li><a href="link/index.html"><code>struct Link</code><p>Used to describe the link display in the <code>MISOAlertMessage</code></p></a></li></ul><h3>Initializers</h3><ul><li><a href="init(_:tablename:bundle:status:description:bulletlist:link:onclose:)-1hv9b/index.html"><code>init(LocalizedStringKey, tableName: String?, bundle: Bundle, status: MISOAlertStatus, description: String?, bulletList: [AttributedString], link: MISOAlertMessage.Link?, onClose: (() -&gt; Void)?)</code><p>Creates an alert message with a localized label, looking up the key in the given bundle, and a rich text description. Uses rich text for the bullet list.</p></a></li><li><a href="init(_:tablename:bundle:status:description:bulletlist:link:onclose:)-22xia/index.html"><code>init(LocalizedStringKey, tableName: String?, bundle: Bundle, status: MISOAlertStatus, description: AttributedString, bulletList: [AttributedString], link: MISOAlertMessage.Link?, onClose: (() -&gt; Void)?)</code><p>Creates an alert message with a localized label, looking up the key in the given bundle, and a rich text description. Uses rich text for the bullet list.</p></a
