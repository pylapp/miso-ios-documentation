<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>Controls</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="Some components can be used for controls and inputs." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>Controls</li></ul><p>Article</p><h1>Controls</h1><p>Some components can be used for <b>controls</b> and <b>inputs</b>.</p></section><h2>Overview</h2><h3>Checkboxes</h3><h4>Checkbox (only)</h4><p>The library proposes layout to add in your views some checkboxes components, even if this type of component is not iOS-native one. You can use a simple checkbox without any labels and images using <a href="../misocheckbox/index.html"><code>MISOCheckbox</code></a>. This checkbox can provide two values (selected and unselected) or three values (selected, unselected and indeterminate) with <a href="../misocheckboxindeterminate/index.html"><code>MISOCheckboxIndeterminate</code></a>.</p><pre class="swift"><code>// A simple checkbox, with only an indicator
// The component must be instanciated with a string parameter used as accessibility label that will be
// vocalized by Voice Over.

// The isOn parameter can have only two values: true (selected), false (unselected)
MISOCheckbox(isOn: $isOn, accessibilityLabel: "Select the element")

// The selection parameter can have only three values: selected, unselected and indeterminate
MISOCheckboxIndeterminate(selection: $selection, accessibilityLabel: "Select the element")
</code></pre><h4>Checkbox item</h4><p>The library proposes also a checkbox which has in its layout some labels and icons. The indicator can be leading or trailing. It can be be used for two-states (<a href="../misocheckboxitem/index.html"><code>MISOCheckboxItem</code></a>) or three-states management (<a href="../misocheckboxitemindeterminate/index.html"><code>MISOCheckboxItemIndeterminate</code></a>).</p><pre class="swift"><code>// A leading checkbox with a label, with only two states
MISOCheckboxItem("Hello world", isOn: $isOn)

// A leading checkbox with a label, an helper text, and exposing a three-values-based state with selection binding
MISOCheckboxItemIndeterminate("Dead Robot Zombie Cop",
                              selection: $selection,
                              description: "from Outer Space II")

// A trailing checkbox with a label, an helper text, an icon, a divider and is about an error
// with a reversed layout, and exposing only two states through isOn binding
MISOCheckboxItem("We live in a fabled world",
                 isOn: $isOn,
                 description: "Of dreaming boys and wide-eyed girls",
                 image: MISOImage(asset: Image(decorative: "ic_heart")),
                 isReversed: true,
                 isError: true,
                 hasDivider: true)
</code></pre><h4>Checkbox picker</h4><p>Checkboxes can be embedded in a checkbox picker (<code>MISOCheckboxPicker</code>) so as to let the users to select one or more items within several.</p><pre class="swift"><code>// Define the elements to display in checkboxes using MISOCheckboxPickerData.
// This object has the same properties as the MISOCheckboxItem,
// and some of them are optional with default values set
var someDataToPopulate: [MISOCheckboxPickerData&lt;String&gt;] {
    [
         MISOCheckboxPickerData&lt;String&gt;(tag: "Choice_1",
                                        label: "Virgin Holy Lava",
                                        description: "No alcohol, only tasty flavors",
                                        image: MISOImage(asset: Image(systemName: "flame"))),

         MISOCheckboxPickerData&lt;String&gt;(tag: "Choice_2",
                                        label: "IPA beer",
                                        description: "From Brewdog company",
                                        image: MISOImage(asset: Image(systemName: "dog.fill"))),

         MISOCheckboxPickerData&lt;String&gt;(tag: "Choice_3",
                                        label: "Mineral water",
                                        image: MISOImage(asset: Image(systemName: "waterbottle.fill"))),
    ]
}

// Prepare the selection, with a value previously selected
// Use the data and the binding for the picker.
@State var selections: [String] = ["Choice_1"] // or empty if nothing selected
// Here the picker is vertical by default
MISOCheckboxPicker(selections: $selections, checkboxes: someDataToPopulate)

// The picker can be vertical and have a root item with a label and a counter
MISOCheckboxPicker(selections: $selections,
                  placement: .verticalRooted(label, .textAndCount))

// The picker can apply some settings to all its radio buttons.
// It can be also horizontal with a scroll indicator.
// Here all the the checkboxes are in read only mode and use reversed layout.
// Here the picker is horizontal and shows the scroll indicator
MISOCheckboxPicker(selections: $selections,
                   checkboxes: someDataToPopulate)
                   isReversed: true,
                   isReadOnly: true,
                   placement: .horizontal(true))
</code></pre><h3>Radios</h3><h4>Radio (only)</h4><p>The library proposes layout to add in your views some radio buttons components, even if this type of component is not iOS-native one. You can use a simple radio without any labels and images thanks to <a href="../misoradio/index.html"><code>MISORadio</code></a>.</p><pre class="swift"><code>// A simple radio, with only an indicator
// The component must be instanciated with a string parameter used as accessibility label that will
// be vocalized by Voice Over.
MISORadio(isOn: $isOn, accessibilityLabel: "Select the element")
</code></pre><h4>Radio item</h4><p>The library proposes also a radio which has in its layout some labels and icons (<a href="../misoradioitem/index.html"><code>MISORadioItem</code></a>). The indicator can be leading or trailing.</p><pre class="swift"><code>// A leading radio with a label
MISORadioItem("Lucy in the Sky with Diamonds", isOn: $isOn)

// A trailing radio with a label, an additional label, a description, a tinted icon,
// a divider and is about an error with a reversed layout
MISORadioItem("Lucy in the Sky with Diamonds",
              isOn: $isOn,
              extraLabel: "The Beatles",
              description: "1967",
              image: MISOImage(asset: Image(decorative: "ic_heart")),
              isReversed: true,
              isError: true,
              hasDivider: true)

// A radio with a raw (non-tinted) image and RTL flip support
MISORadioItem("Lucy in the Sky with Diamonds",
              isOn: $isOn,
              image: MISOImage(asset: Image(decorative: "il_someImage"),
                               flipped: layoutDirection == .rightToLeft,
                               renderingMode: .original))
</code></pre><h4>Radio picker</h4><p>Radio items can be embedded in a radio picker so as to let the users to select only one item within several (<code>MISORadioPicker</code>).</p><pre class="swift"><code>// Define the elements to display in radio buttons using MISORadioPickerData.
// This object has the same properties as the MISORadioItem,
// and some of them are optional withdefault values set
var someDataToPopulate: [MISORadioPickerData&lt;String&gt;] {
    [
            MISORadioPickerData&lt;String&gt;(tag: "Choice_1",
                                        label: "Virgin Holy Lava",
                                        extraLabel: "Very spicy",
                                        description: "No alcohol, only tasty flavors",
                                        image: MISOImage(asset: Image(systemName: "flame"))),

            MISORadioPickerData&lt;String&gt;(tag: "Choice_2",
                                        label: "IPA beer",
                                        description: "From Brewdog company",
                                        image: MISOImage(asset: Image(systemName: "dog.fill"))),

            MISORadioPickerData&lt;String&gt;(tag: "Choice_3",
                                        label: "Mineral water",
                                        image: MISOImage(asset: Image(systemName: "waterbottle.fill"))),
    ]
}

// Prepare the selection, with a value previously selected
// Use the data and the binding for the picker.
@State var selection: String = "Choice_1"

// Here the picker is vertical
MISORadioPicker(selection: $selection, radios: someDataToPopulate)
</code></pre><h3>Switches</h3><h4>Switch (only)</h4><p>The library proposes a new layout for the switch component. The native one is not used. You can use a simple switch without any labels and images thanks to the <a href="../misoswitch/index.html"><code>MISOSwitch</code></a>.</p><pre class="swift"><code>// A simple switch, with only an indicator
// The component must be instanciated with a string parameter used as accessibility label that will be
// vocalized by Voice Over.

// The isOn parameter can have only two values: true (selected), false (unselected)
MISOSwitch(isOn: $isOn, accessibilityLabel: "Select the element")
</code></pre><h4>Switch item</h4><p>The library proposes also a switch which has in its layout some labels and icons (<a href="../misoswitchitem/index.html"><code>MISOSwitchItem</code></a>). The indicator can be leading or trailing.</p><pre class="swift"><code>// A leading switch with a label and exposing the state through isOn binding
MISOSwitchItem("Hello world", isOn: $isOn)

// A leading switch with a label and a description
MISOSwitchItem("Dead Robot Zombie Cop",
               isOn: $isOn,
               description: "from Outer Space II")

// A trailing switch with a label, a description, a tinted icon, a divider and is about an error
// with an inverse layout
MISOSwitchItem("We live in a fabled world",
                isOn: $isOn,
                description: "Of dreaming boys and wide-eyed girls",
                image: MISOImage(asset: Image(decorative: "ic_heart")),
                isReversed: true,
                isError: true,
                hasDivider: true)

// A trailing switch with a raw (non-tinted) image and RTL flip support
MISOSwitchItem("We live in a fabled world",
                isOn: $isOn,
                image: MISOImage(asset: Image(decorative: "il_someImage"),
                                 flipped: layoutDirection == .rightToLeft,
                                 renderingMode: .original))
</code></pre><h3>Chips</h3><h4>Suggestion</h4><p>The library proposes suggestion (<a href="../misosuggestionchip/index.html"><code>MISOSuggestionChip</code></a>) chip component to make some predicitve or recommended selection.</p><pre class="swift"><code>// Suggestion chip with icon only
MISOSuggestionChip(image: MISOImage(asset: Image("ic_heart")), accessibilityLabel: "Heart") {}

// Suggestion chip with raw icon (not tinted)
MISOSuggestionChip(image: MISOImage(asset: Image("ic_brand"), renderingMode: .original), accessibilityLabel: "Brand") {}

// Layout with text only
MISOSuggestionChip(text: "Heart") {}

// Layout with text and icon
MISOSuggestionChip(image: MISOImage(asset: Image("ic_heart")), text: "Heart") {}

// Layout with text and raw icon (not tinted)
MISOSuggestionChip(image: MISOImage(asset: Image("ic_brand"), renderingMode: .original), text: "Brand") {}
</code></pre><h4>Filter</h4><p>The library proposes filter chip component (<a href="../misofilterchip/index.html"><code>MISOFilterChip</code></a>) to make some filtering with selected or unselected options.</p><pre class="swift"><code>// Filter chip with icon only as selected
MISOFilterChip(image: MISOImage(asset: Image("ic_heart")), accessibilityLabel: "Heart", selected: true) {}

// Filter chip with raw icon (not tinted)
MISOFilterChip(image: MISOImage(asset: Image("ic_brand"), renderingMode: .original), accessibilityLabel: "Brand") {}

// Filter chip with text only as not selected
MISOFilterChip(text: "Heart") {}

// Filter chip with text and icon in selected state
MISOFilterChip(image: MISOImage(asset: Image("ic_heart")), text: "Heart", selected: true) {}

// Filter chip with text and raw icon (not tinted)
MISOFilterChip(image: MISOImage(asset: Image("ic_brand"), renderingMode: .original), text: "Brand") {}
</code></pre><h4>Chip picker</h4><p>The library proposes a chip picker (<code>MISOChipPicker</code>) to make easily filtering with two kinds of selection:</p><ul><li><p><b>single or none</b>: to select or unselect one option only</p></li><li><p><b>single</b>: to select at least one option</p></li><li><p><b>multiple</b>: to select several options</p></li></ul><pre class="swift"><code>// Define the elements to display in filter chip using MISOChipPickerData.
enum Drink: String, CaseIterable {
    case virginHolyLava, ipaBeer, mineralWater
}

var someDataToPopulate: [MISOChipPickerData&lt;Drink&gt;] {
    [
        MISOChipPickerData(tag: Drink.virginHolyLava,
                          layout: .textAndIcon("Virgin Holy Lava",
                                               image: MISOImage(asset: Image(systemName: "flame")))),

        MISOChipPickerData(tag: Drink.ipaBeer,
                           layout: .textAndIcon("IPA Beer",
                                                image: MISOImage(asset: Image(systemName: "dog.fill")))),

        MISOChipPickerData(tag: Drink.mineralWater,
                           layout: .textAndIcon("Mineral water",
                                                image: MISOImage(asset: Image(systemName: "waterbottle.fill")))),
    ]
}

// MARK: - Simple selection, one or zero

// Prepare the selection, with a value previously selected
// Use the data and the binding for the picker.
@State var selection: Drink? = .mineralWater

// Here the picker with title, selection and data
MISOChipPicker(title: "Select a drink", selection: $selection, chips: someDataToPopulate)

// MARK: - Simple selection

// Prepare the selection, with a value previously selected
// Use the data and the binding for the picker.
@State var selection: Drink = .mineralWater

// Here the picker with title, selection and data
MISOChipPicker(title: "Select a drink", selection: $selection, chips: someDataToPopulate)

// MARK: - Multiple selection

// Prepare the selection, with a value previously selected
// Use the data and the binding for the picker.
@State var selections: [Drink] = [.mineralWater]

// Here the picker with title, selection and data
MISOChipPicker(title: "Select a drink", selections: $selections, chips: someDataToPopulate)
</code></pre><h3>Password input</h3><p>The library provides an <code>MISOPasswordInput</code> based on a <code>MISOTextInput</code> to let user provides password in a secure text field.</p><pre class="swift"><code>// The password to display and edit
@State var password: String = ""

// A basic password input with label
MISOPasswordInput(label: "Password", password: $password)

// Add a leading icon and helper text to more context
MISOPasswordInput(label: "Password", password: $password, lockIcon: true, helperText: "Your password must be between 8 and 20 characters long.")

// Password with prefix
MISOPasswordInput(label: "Password", password: $password, prefix: "CORP-")
</code></pre><h3>Pin Code Input</h3><p>The library provides an <code>MISOPinCodeInput</code> to let user provides PIN code or OTP code with only digits.</p><pre class="swift"><code>// The value with the code
@State private var pinCode: String = ""

// By default, the PIN code input displays only 6 boxes
MISOPinCodeInput($pinCode)

// It can have also up 4 or 8 boxes, with an helper text
MISOPinCodeInput($pinCode, length: .eight, helperText: "Enter your 8 secret digits")

// The component can be used in error contexts
MISOPinCodeInput($pinCode, length: .six, status: .error(message: "The OTP code you entered is not correct"))
</code></pre><h3>Text area</h3><p>The library provides <a href="../misotextarea/index.html"><code>MISOTextArea</code></a> for multiline text entry in forms such as comments, descriptions or messages. The field grows from a minimum of visible lines up to maximum lines based on tokens associated to the theme, after which the content scrolls. It supports labels, placeholders, helper text, a helper link and five statuses: enabled, loading, error, read-only and disabled.</p><pre class="swift"><code>// The text to display and edit
@State var text: String = ""

// Basic usage — label and text only
MISOTextArea(label: "Comments", text: $text)

// With a placeholder shown when the field is empty
MISOTextArea(label: "Comments", text: $text, placeholder: "Describe your issue in detail")

// With a plain helper text
MISOTextArea(label: "Comments",
             text: $text,
             helperText: .plain("Maximum 500 characters."))

// With a maximum character count — remaining count rendered bold, error style when exceeded
MISOTextArea(label: "Comments",
             text: $text,
             helperText: .charactersMaxCount(500))

// With a helper link
@Environment(\.openURL) private var openUrl

let helperLink = MISOTextArea.Helperlink(text: "Learn more") {
    openUrl.callAsFunction(url)
}

MISOTextArea(label: "Comments", text: $text, helperLink: helperLink)

// With error status — error message replaces the helper text
MISOTextArea(label: "Comments",
             text: $text,
             status: .error(message: "This field cannot be empty."))
</code></pre><h3>Text input</h3><p>The library provides useful components for forms like <code>MISOTextInput</code> to let user write text data and be helped if needed. Such components can have or not a leading icon or a trailing action with or without placeholders.</p><pre class="swift"><code>// The text to display and edit
@State var text: String = ""

// Empty text and no placeholder
MISOTextInput(label: "Email", text: $text)

// Empty text with prefix and suffix
MISOTextInput(label: "Email", text: $text, prefix: "Distance", suffix: "km")

// Add a leading icon for more context
MISOTextInput(label: "Email", text: $text, placeholder: "firstName.lastName", suffix: "@orange.com",
              leadingImage: MISOImage(asset: Image(systemName: "envelope")))

// Add a leading raw image (not tinted)
MISOTextInput(label: "Brand", text: $text,
              leadingImage: MISOImage(asset: Image("ic_brand"), renderingMode: .original))

// Add a trailing button for additional action
let trailingAction = MISOTextInput.TrailingAction(image: MISOImage(asset: Image("ic_cross")),
                                                   actionHint: "Delete") { text = "" }
MISOTextInput(label: "Email", text: $text, trailingAction: trailingAction)

// Add a trailing button with raw image (not tinted)
let trailingActionRaw = MISOTextInput.TrailingAction(image: MISOImage(asset: Image("ic_brand"),
                                                                      renderingMode: .original),
                                                      actionHint: "Brand") { /* action */ }
MISOTextInput(label: "Brand", text: $text, trailingAction: trailingActionRaw)

// With helper text
MISOTextInput(label: "Email",
              text: $text,
              placeholder: "firstName.lastName",
              suffix: "@orange.com",
              helperText: "The email will be automatically completed with @orange.com")

// With helper link
@Environment(\.openURL) private var openUrl

let helperLink = MISOTextInput.HelperLink(text: "Helper Link") {
    openUrl.callAsFunction(url)
}

MISOTextInput(label: "Label", text: $text, placeholder: "Placeholder", helperLink: helperLink)
</code></pre></article></noscript><div id="app"></div></body></html>
