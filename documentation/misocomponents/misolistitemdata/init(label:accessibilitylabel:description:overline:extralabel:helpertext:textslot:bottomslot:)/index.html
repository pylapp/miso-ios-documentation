<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>init(label:accessibilityLabel:description:overline:extraLabel:helperText:textSlot:bottomSlot:)</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="Creates a new list item data model with a custom view as label." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../index.html">Components</a></li><li><a href="../index.html">MISOListItemData</a></li><li>init(label:accessibilityLabel:description:overline:extraLabel:helperText:textSlot:bottomSlot:)</li></ul><p>Initializer</p><h1>init(label:accessibilityLabel:description:overline:extraLabel:helperText:textSlot:bottomSlot:)</h1><p>Creates a new list item data model with a custom view as label.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>init(label: some View, accessibilityLabel: String, description: String? = nil, overline: String? = nil, extraLabel: String? = nil, helperText: String? = nil, textSlot: MISOListItemData.Slot? = nil, bottomSlot: MISOListItemData.Slot? = nil)</code></pre></section><h2>Parameters</h2><dl><dt>label</dt><dd><p>A custom SwiftUI view to use as the primary label of the list item.</p></dd><dt>accessibilityLabel</dt><dd><p>A text used for Voice Over vocalization of the custom label. This value is used to build the combined accessibility label of the list item text container.</p></dd><dt>description</dt><dd><p>An optional secondary text displayed below the label. Defaults to <code>nil</code>.</p></dd><dt>overline</dt><dd><p>An optional text displayed above the label. Defaults to <code>nil</code>. <b>Ignored when the list item size is <code>.small</code>.</b></p></dd><dt>extraLabel</dt><dd><p>An optional additional text displayed below the description. Defaults to <code>nil</code>. <b>Ignored when the list item size is <code>.small</code>.</b></p></dd><dt>helperText</dt><dd><p>An optional supporting text displayed below the list item row. Defaults to <code>nil</code>.</p></dd><dt>textSlot</dt><dd><p>An optional custom view displayed under the texts but before the helper text. Defaults to <code>nil</code>.</p></dd><dt>bottomSlot</dt><dd><p>An optional custom view displayed under the main content and before the helper text. Defaults to <code>nil</code>.</p></dd></dl><h2>Discussion</h2><p>When using a custom view label, the bold styling is not applicable since the styling is entirely controlled by the provided view.</p><p>The <code>accessibilityLabel</code> parameter is <b>required</b> and used by Voice Over to vocalize the label. It is included in the combined accessibility label built by the text container, alongside the overline, extra label, and description.</p><pre class="swift"><code>    let data = MISOListItemData(
        label: HStack {
            Image(systemName: "star.fill")
            Text("Favorite")
        },
        accessibilityLabel: "Favorite",
        description: "A custom label example"
    )
    MISOStaticListItem(data: data)
</code></pre></article></noscript><div id="app"></div></body></html>
