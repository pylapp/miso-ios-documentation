<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>MISOListItemData.Label</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="Represents the content of a label within a list item." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../index.html">Components</a></li><li><a href="../index.html">MISOListItemData</a></li><li>MISOListItemData.Label</li></ul><p>Enumeration</p><h1>MISOListItemData.Label</h1><p>Represents the content of a label within a list item.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>enum Label</code></pre></section><h2>Overview</h2><p>The label can be either a plain text string or a custom SwiftUI view.</p><h2>Cases</h2><ul><li><p><b><code>.text(String, isBold: Bool)</code></b>: A plain text string used as the label. The <code>isBold</code> parameter controls whether the text is rendered with a bold font weight.</p></li><li><p><b><code>.custom(AnyView, accessibilityLabel: String)</code></b>: A custom SwiftUI view used as the label, together with an accessibility label used for Voice Over vocalization. When using a custom view, the bold styling is not applicable since it is entirely controlled by the provided view.</p></li></ul><h2>Accessibility</h2><p>When using <code>.custom</code>, the <a href="stringvalue/index.html"><code>stringValue</code></a> property returns the provided <code>accessibilityLabel</code>. This value is used by the text container to build the combined accessibility label for the list item text parts, ensuring Voice Over can vocalize the label even when it is an arbitrary view.</p><blockquote class="aside since"><p class="label">Since</p><p>OUDS 3.0.0</p></blockquote><h2>Topics</h2><h3>Enumeration Cases</h3><ul><li><a href="custom(_:accessibilitylabel:)/index.html"><code>case custom(AnyView, accessibilityLabel: String)</code><p>A custom SwiftUI view used as the label, with an accessibility label for Voice Over.</p></a></li><li><a href="text(_:isbold:)/index.html"><code>case text(String, isBold: Bool)</code><p>A plain text string label.</p></a></li></ul><h3>Instance Properties</h3><ul><li><a href="stringvalue/index.html"><code>var stringValue: String</code><p>Returns the string value for accessibility purposes. For <code>.text</code>, returns the text itself. For <code>.custom</code>, returns the provided <code>accessibilityLabel</code>.</p></a></li></ul></article></noscript><div id="app"></div></body></html>
