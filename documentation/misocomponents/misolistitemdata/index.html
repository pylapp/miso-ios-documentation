<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>MISOListItemData</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="Represents the main content displayed within a list item component such as ``doc://MISOComponents/documentation/MISOComponents/MISOStaticListItem`` or ``doc://MISOComponents/documentation/MISOComponents/MISONavigationListItem``." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>MISOListItemData</li></ul><p>Structure</p><h1>MISOListItemData</h1><p>Represents the main content displayed within a list item component such as <a href="../misostaticlistitem/index.html"><code>MISOStaticListItem</code></a> or <a href="../misonavigationlistitem/index.html"><code>MISONavigationListItem</code></a>.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>struct MISOListItemData</code></pre></section><h2>Mentioned In</h2><ul><li><a href="../navigations/index.html">Navigations</a></li></ul><h2>Overview</h2><p><a href="."><code>MISOListItemData</code></a> groups all the text-based information that a list item can display: a mandatory label (either a <code>String</code> or a custom <code>View</code>), and optional description, overline, extra label, and helper text, and slots.</p><h2>Code samples</h2><pre class="swift"><code>    // Minimal: label only (String)
    let data = MISOListItemData(label: "Label")

    // Label with bold style
    let data = MISOListItemData(label: "Label", hasBoldLabel: true)

    // Custom view as label with accessibility label
    let data = MISOListItemData(
        label: HStack {
            Image(systemName: "star.fill")
            Text("Custom Label")
        },
        accessibilityLabel: "Favorite Custom Label"
    )

    // Full content with text label
    let data = MISOListItemData(
        label: "Label",
        hasBoldLabel: false,
        description: "Description",
        overline: "Overline",
        extraLabel: "Extra Label",
        helperText: "Helper text providing guidance"
    )

    // Full content with custom view label
    let data = MISOListItemData(
        label: VStack(alignment: .leading) {
            Text("Title").font(.headline)
            Text("Subtitle").font(.caption)
        },
        accessibilityLabel: "Title, Subtitle",
        description: "Description",
        overline: "Overline",
        extraLabel: "Extra Label",
        helperText: "Helper text providing guidance"
    )

    // Overline as a user-styled rich text (AttributedString)
    // Same "overline" parameter name as the String variant, disambiguated by the value's type.
    let data = MISOListItemData(
        label: "Label",
        overline: .from(text: "Overline",
                        foregroundColor: theme.colors.contentBrandPrimary.color(for: colorScheme),
                        font: someFont)
    )

    // Usage with a static list item
    MISOStaticListItem(data: data)

    // Usage with a navigation list item
    MISONavigationListItem(data: data) {
        // Navigate to next screen
    }

    // With slot (displayed under texts, before helper text)
    let dataWithSlot = MISOListItemData(
        label: "Label",
        textSlot: MISOListItemData.Slot { Text("Additional content") },
        helperText: "Helper text"
    )

    // With text slot and bottom slot (bottom slot displayed under text slot, before helper text)
    let dataWithBothSlots = MISOListItemData(
        label: "Label",
        textSlot: MISOListItemData.Slot { Text("Slot content") },
        bottomSlot: MISOListItemData.Slot { Text("Bottom content") },
        helperText: "Helper text"
    )
</code></pre><h2>Custom view label</h2><p>When providing a custom view as label:</p><ul><li><p>The <code>hasBoldLabel</code> property is not applicable; all styling is controlled by the provided view.</p></li><li><p>You must provide an <code>accessibilityLabel</code> parameter so that Voice Over can vocalize the label. This <code>accessibilityLabel</code> is used in the combined accessibility label of the list item text container.</p></li><li><p>You must also check the accessibility of your custom views (navigation with switch control and full keyboard access, dynamic types, contrast ratios)</p></li></ul><h2>Small size behavior</h2><p>When the list item is displayed in small size (via the <code>.misoListItemSize(.small)</code> modifier), the <code>overline</code> and <code>extraLabel</code> properties are <b>automatically hidden</b> to ensure a compact layout. Only the <code>label</code>, <code>description</code>, and <code>helperText</code> remain visible.</p><p>The <code>bottomSlot</code> is also <b>automatically hidden</b>, but the <code>textSlot</code> remains displayed.</p><pre class="swift"><code>    // overline, extraLabel and bottomSlot will not be displayed
    MISOStaticListItem(data: MISOListItemData(
        label: "Label",
        overline: "Hidden in small",
        extraLabel: "Also hidden in small"
    ))
    .misoListItemSize(.small)
</code></pre><blockquote class="aside since"><p class="label">Since</p><p>OUDS 3.0.0</p></blockquote><h2>Topics</h2><h3>Structures</h3><ul><li><a href="slot/index.html"><code>struct Slot</code><p>Represents a custom view slot within a list item.</p></a></li></ul><h3>Initializers</h3><ul><li><a href="init(key:overline:tablename:bundle:hasboldlabel:description:extralabel:helpertext:textslot:bottomslot:)/index.html"><code>init(key: LocalizedStringKey, overline: AttributedString, tableName: String?, bundle: Bundle, hasBoldLabel: Bool, description: String?, extraLabel: String?, helperText: String?, textSlot: MISOListItemData.Slot?, bottomSlot: MISOListItemData.Slot?)</code><p>Creates a new list item data model with a localized text label and a styled <code>AttributedString</code> overline.</p></a></li><li><a href="init(key:tablename:bundle:hasboldlabel:description:overline:extralabel:helpertext:textslot:bottomslot:)/index.html"><code>init(key: LocalizedStringKey, tableName: String?, bundle: Bundle, hasBoldLabel: Bool, description: String?, overline: String?, extraLabel: String?, helperText: String?, textSlot: MISOListItemData.Slot?, bottomSlot: MISOListItemData.Slot?)</code><p>Creates a new list item data model with a localized text label.</p></a></li><li><a href="init(label:accessibilitylabel:description:overline:extralabel:helpertext:textslot:bottomslot:)/index.html"><code>init(label: some View, accessibilityLabel: String, description: String?, overline: String?, extraLabel: String?, helperText: String?, textSlot: MISOListItemData.Slot?, bottomSlot: MISOListItemData.Slot?)</code><p>Creates a new list item data model with a custom view as label.</p></a></li><li><a href="init(label:accessibilitylabel:overline:description:extralabel:helpertext:textslot:bottomslot:)/index.html"><code>init(label: some View, accessibilityLabel: String, overline: AttributedString, description: String?, extraLabel: String?, helperText: String?, textSlot: MISOListItemData.Slot?, bottomSlot: MISOListItemData.Slot?)</code><p>Creates a new list item data model with a custom view as label and a styled <code>AttributedString</code> overline.</p></a></li><li><a href="init(label:hasboldlabel:description:overline:extralabel:helpertext:textslot:bottomslot:)/index.html"><code>init(label: String, hasBoldLabel: Bool, description: String?, overline: String?, extraLabel: String?, helperText: String?, textSlot: MISOListItemData.Slot?, bottomSlot: MISOListItemData.Slot?)</code><p>Creates a new list item data model with a text label.</p></a></li><li><a href="init(label:overline:hasboldlabel:description:extralabel:helpertext:textslot:bottomslot:)/index.html"><code>init(label: String, overline: AttributedString, hasBoldLabel: Bool, description: String?, extraLabel: String?, helperText: String?, textSlot: MISOListItemData.Slot?, bottomSlot: MISOListItemData.Slot?)</code><p>Creates a new list item data model with a text label and a styled <code>AttributedString</code> overline.</p></a></li></ul><h3>Enumerations</h3><ul><li><a href="label/index.html"><code>enum Label</code><p>Represents the content of a label within a list item.</p></a></li></ul></article></noscript><div id="app"></div></body></html>
