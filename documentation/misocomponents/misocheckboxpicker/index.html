<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>MISOCheckboxPicker</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="A picker allowing to expose several checkboxes and select some of them within the others. Each checkbox contains a “tag”, i.e. a supposed to be unique value. The picker will expose the choosen values using this “tag”. It has also some configuration elements which will override the one applied to nested ``doc://MISOComponents/documentation/MISOComponents/MISOCheckboxItem`` (divider, read only and error mode, layout and outlined)" name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>MISOCheckboxPicker</li></ul><p>Structure</p><h1>MISOCheckboxPicker</h1><p>A picker allowing to expose several checkboxes and select some of them within the others. Each checkbox contains a “tag”, i.e. a supposed to be unique value. The picker will expose the choosen values using this “tag”. It has also some configuration elements which will override the one applied to nested <a href="../misocheckboxitem/index.html"><code>MISOCheckboxItem</code></a> (divider, read only and error mode, layout and outlined)</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>visionOS 1.0+</li></ul><pre><code>@MainActor struct MISOCheckboxPicker&lt;Tag&gt; where Tag : Hashable</code></pre></section><h2>Accessibility considerations</h2><p><i>Voice Over</i> will use several elements to describe the component: if component disabled / read only, if error context, the label and helper texts and a chekcbox trait. The picker itself does no have any defined accessiiblity value, label or identifier ; it remains in the users hands to define which one will be used. However if defined in the <a href="../misoradiopickerdata/index.html"><code>MISORadioPickerData</code></a> the items inside the picker will have such accessibility identifiers. In addition the root item of the picker has for accessiiblity identifier the displayed text.</p><h2>Forbidden by design</h2><p>The design system does not allow to have <a href="../misocheckboxitem/index.html"><code>MISOCheckboxItem</code></a> in both an error situation and a read only state. The design system does not allow to have <a href="../misocheckboxitem/index.html"><code>MISOCheckboxItem</code></a> in both an error situation and a disabled state. The design system does not allow to have <a href="../misocheckboxitem/index.html"><code>MISOCheckboxItem</code></a> in both a read only and a disabled state.</p><h2>Code samples</h2><pre class="swift"><code>    // Define the elements to display in checkboxes using MISOCheckboxPickerData.
    // This object has the same properties as the MISOCheckboxItem,
    // and some of them are optional with default values set
    var someDataToPopulate: [MISOCheckboxPickerData&lt;String&gt;] {
        [
        MISOCheckboxPickerData&lt;String&gt;(tag: "Choice_1",
                                       label: "Virgin Holy Lava",
                                       description: "No alcohol, only tasty flavors",
                                       image: MISOImage(asset: Image(systemName: "flame")),

        MISOCheckboxPickerData&lt;String&gt;(tag: "Choice_2",
                                       label: "IPA beer",
                                       description: "From Brewdog company",
                                       image: MISOImage(asset: Image(systemName: "dog.fill")),

        MISOCheckboxPickerData&lt;String&gt;(tag: "Choice_3",
                                       label: "Mineral water",
                                       image: MISOImage(asset: Image(systemName: "waterbottle.fill"))
        ]
    }

    // Prepare the selection, with a value previously selected
    // Use the data and the binding for the picker.
    @State var selections: [String] = ["Choice_1"] // or empty if nothing selected

    // Here the picker is vertical by default
    MISOCheckboxPicker(selections: $selections, checkboxes: someDataToPopulate)

    // The picker can be vertical and have a root item with a label and a counter
    MISOCheckboxPicker(selections: $selections,
                       placement: .verticalRooted(label, .textAndCount))

    // The picker can apply some settings to all its radio buttons.
    // It can be also horizontal with a scroll indicator.
    // Here all the the checkboxes are in read only mode and use reversed layout.
    // Here the picker is horizontal and shows the scroll indicator
    MISOCheckboxPicker(selections: $selections,
                       checkboxes: someDataToPopulate)
                       isReversed: true,
                       isReadOnly: true,
                       placement: .horizontal(true))
</code></pre><blockquote class="aside since"><p class="label">Since</p><p>OUDS 0.14.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(selections:checkboxes:placement:isreversed:iserror:isreadonly:hasdivider:itemsspacing:)/index.html"><code>init(selections: Binding&lt;[Tag]&gt;, checkboxes: [MISOCheckboxPickerData&lt;Tag&gt;], placement: MISOCheckboxPickerPlacement, isReversed: Bool, isError: Bool, isReadOnly: Bool, hasDivider: Bool, itemsSpacing: SpaceSemanticToken?)</code><p>Defines the picker view which displays using <a href="../misocheckboxitem/index.html"><code>MISOCheckboxItem</code></a> view the <a href="../misocheckboxpickerdata/index.html"><code>MISOCheckboxPickerData</code></a></p></a></li></ul><h3>Instance Properties</h3><ul><li><a href="body/index.html"><code>var body: some View</code></a></li></ul></article></noscript><div id="app"></div></body></html>
