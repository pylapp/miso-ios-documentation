<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>MISOLiquidGlassTabView</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="A tab view component for iOS 26+ that accepts native SwiftUI `Tab` items including `Tab(role: .search)`, while applying the full MISO tab bar appearance — colors, typography and top divider." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>MISOLiquidGlassTabView</li></ul><p>Structure</p><h1>MISOLiquidGlassTabView</h1><p>A tab view component for iOS 26+ that accepts native SwiftUI <code>Tab</code> items including <code>Tab(role: .search)</code>, while applying the full MISO tab bar appearance — colors, typography and top divider.</p><ul id="availability"><li>iOS 26.0+</li><li>macOS 26.0+</li><li>visionOS 26.0+</li></ul><pre><code>@MainActor struct MISOLiquidGlassTabView&lt;Content&gt; where Content : TabContent, Content.TabValue == Never</code></pre></section><h2>Overview</h2><p>Use <a href="."><code>MISOLiquidGlassTabView</code></a> when you need role-based tabs (iOS 26+) or targeting iOS 26+ OS with Liquid Glass. For iOS 18 and iOS 26 without Liquid Glass, use <a href="../misotabview/index.html"><code>MISOTabView</code></a> instead. For older iOS version use <a href="../misotabbar/index.html"><code>MISOTabBar</code></a> instead.</p><h2>Platform considerations</h2><ul><li><p>Requires iOS 26+ / macOS 26+ / visionOS 26+.</p></li><li><p>Not available on watchOS or tvOS.</p></li></ul><h2>Code samples</h2><pre class="swift"><code>MISOLiquidGlassTabView {

    Tab("Search", image: "magnifyingglass") { SearchPage() }
    Tab("Profile", image: "person") { ProfilePage() }
}
</code></pre><blockquote class="aside version"><p class="label">Version</p><p>1.0.0</p></blockquote><blockquote class="aside since"><p class="label">Since</p><p>OUDS 3.0.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(content:)/index.html"><code>init(content: () -&gt; Content)</code><p>Creates an <code>MISOLiquidGlassTabView</code> with <code>Tab</code> items</p></a></li></ul><h3>Instance Properties</h3><ul><li><a href="body/index.html"><code>var body: some View</code></a></li></ul></article></noscript><div id="app"></div></body></html>
