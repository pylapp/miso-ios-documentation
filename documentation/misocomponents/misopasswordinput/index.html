<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>MISOPasswordInput</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="Password input is a UI element that allows to securely and confidentially capture a user’s password. As it is based on the `MISOTextInput`,  it offers same layout and the same elements of configuration." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>MISOPasswordInput</li></ul><p>Structure</p><h1>MISOPasswordInput</h1><p>Password input is a UI element that allows to securely and confidentially capture a user’s password. As it is based on the <code>MISOTextInput</code>,  it offers same layout and the same elements of configuration.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>visionOS 1.0+</li></ul><pre><code>@MainActor struct MISOPasswordInput</code></pre></section><h2>Layout</h2><p>Passwords input is based on several configurable UI elements:</p><ul><li><p><b>label</b>: It is used to describe the purpose of the input.</p></li><li><p><b>placeholder</b>:  A prefix is not common and is discouraged in a Password Input component. In very specific cases, it can provide context or format requirements (e.g., “DEV-” for test accounts, “admin-” as a pattern to define an admin password)</p></li><li><p><b>lock icon</b>: it helps to reinforce the security context.</p></li><li><p><b>Helper text</b>:  A supporting text conveys additional information about the password field.</p></li></ul><h2>Outlined style</h2><p>By <b>default</b>, the input is with a subtle background fill and invisible bottom border, creating a softer and more contained look.</p><pre class="swift"><code>   // An outlined text input
   MISOPasswordInput(label: "Your password", password: $password, isOutlined: true)

   // With a localizable from a bundle
   MISOPasswordInput(LocalizedStringKey("password_label"), bundle: Bundle.module, password: $password)
</code></pre><h3>Rounded layout</h3><p>As the<code> MISOTextInput</code>, rounded corners can be enabled or disabled using the <code>hasRoundedTextInputs</code> values of the <code>Tuning</code> object in your theme configuration.</p><h2>Status</h2><p>As <code>MISOPasswordInput</code> is based on the<code> MISOTextInput</code>, all the status are the same and have the same behavior available here <code>MISOTextInput.Status</code></p><h2>Accessibility considerations</h2><p>By default no haptics are done by the component for the trailing action. However you should think about cases wher you will have to make the devices vibrates. You can refer to the <a href="https://developer.apple.com/design/human-interface-guidelines/playing-haptics">Human Interface Guidelines of Apple</a>.</p><h2>Rich text</h2><p>Rich text can be used for error and helper texts.</p><p>Strong text can be used sparingly to highlight key information within the content. No other text styles should be used. Underlined text must not be applied manually (e.g. in error message), as it is commonly associated with hyperlinks and may mislead users.</p><h2>Code samples</h2><pre class="swift"><code>    // The password to display and edit
    @State var password: String = ""

    // A basic password input with label
    MISOPasswordInput(label: "Password", password: $password)

    // Add a leading icon and helper text to more context
    MISOPasswordInput(label: "Password", password: $password, lockIcon: true, helperText: "Your password must be between 8 and 20 characters long.")

    // Password with prefix
    MISOPasswordInput(label: "Password", password: $password, prefix: "CORP-")

    // Make password visible
    MISOPasswordInput(label: "Password", password: $password, isHiddenPassword: .constant(false))
</code></pre><blockquote class="aside version"><p class="label">Version</p><p>1.3.1 (Figma component design version)</p></blockquote><blockquote class="aside since"><p class="label">Since</p><p>OUDS 1.2.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(_:tablename:bundle:password:ishiddenpassword:placeholder:prefix:lockicon:helpertext:isoutlined:constrainedmaxwidth:status:)-21taz/index.html"><code>init(LocalizedStringKey, tableName: String?, bundle: Bundle, password: Binding&lt;String&gt;, isHiddenPassword: Binding&lt;Bool&gt;, placeholder: String?, prefix: String?, lockIcon: Bool, helperText: AttributedString, isOutlined: Bool, constrainedMaxWidth: Bool, status: MISOTextInput.Status)</code><p>Creates a password input with a localized label, looking up the key in the given bundle.</p></a></li><li><a href="init(_:tablename:bundle:password:ishiddenpassword:placeholder:prefix:lockicon:helpertext:isoutlined:constrainedmaxwidth:status:)-67shq/index.html"><code>init(LocalizedStringKey, tableName: String?, bundle: Bundle, password: Binding&lt;String&gt;, isHiddenPassword: Binding&lt;Bool&gt;, placeholder: String?, prefix: String?, lockIcon: Bool, helperText: String?, isOutlined: Bool, constrainedMaxWidth: Bool, status: MISOTextInput.Status)</code><p>Creates a password input with a localized label, looking up the key in the given bundle.</p></a></li><li><a href="init(label:password:ishiddenpassword:placeholder:prefix:lockicon:helpertext:isoutlined:constrainedmaxwidth:status:)-8kt01/index.html"><code>init(label: String, password: Binding&lt;String&gt;, isHiddenPassword: Binding&lt;Bool&gt;, placeholder: String?, prefix: String?, lockIcon: Bool, helperText: String?, isOutlined: Bool, constrainedMaxWidth: Bool, status: MISOTextInput.Status)</code><p>Creates a password input.</p></a></li><li><a href="init(label:password:ishiddenpassword:placeholder:prefix:lockicon:helpertext:isoutlined:constrainedmaxwidth:status:)-9smbe/index.html"><code>init(label: String, password: Binding&lt;String&gt;, isHiddenPassword: Binding&lt;Bool&gt;, placeholder: String?, prefix: String?, lockIcon: Bool, helperText: AttributedString, isOutlined: Bool, constrainedMaxWidth: Bool, status: MISOTextInput.Status)</code><p>Creates a password input with a rich text as helper text</p></a></li></ul><h3>Instance Properties</h3><ul><li><a href="body/index.html"><code>var body: some View</code></a></li></ul></article></noscript><div id="app"></div></body></html>
