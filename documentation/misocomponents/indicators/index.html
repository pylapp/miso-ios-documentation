<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>Indicators</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="Some components can be used for indicators." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>Indicators</li></ul><p>Article</p><h1>Indicators</h1><p>Some components can be used for <b>indicators</b>.</p></section><h2>Overview</h2><h3>Badge</h3><p>The badge is a small UI element used to highlight status, notifications, or categorization within an interface.</p><h4>Badge Count</h4><p>An <a href="../misobadgecount/index.html"><code>MISOBadgeCount</code></a> displays an integer value.</p><pre class="swift"><code>// Neutral badge in medium size with an image
MISOBadgeIcon(status: .neutral(image: MISOImage(asset: Image(decorative: "ic_heart"), accessibilityLabel: "Like"), size: .medium))
</code></pre><h4>Badge Icon</h4><p>An <a href="../misobadgeicon/index.html"><code>MISOBadgeIcon</code></a> displays only an icon and has specific colors.</p><pre class="swift"><code>// Neutral badge in medium size with an image
MISOBadgeIcon(status: .neutral(image: MISOImage(asset: Image(decorative: "ic_heart"), accessibilityLabel: "Like"), size: .medium))
</code></pre><h4>Badge Standard</h4><p>An <a href="../misobadgestandard/index.html"><code>MISOBadgeStandard</code></a> is an empty badge like a coloured pastille.</p><pre class="swift"><code>// Info badge in medium size without information
MISOBadgeStandard(status: .info, size: .medium)
</code></pre><h3>Progress Indicators</h3><h4>Circular Progress Indicator</h4><p>An <a href="../misocircularprogressindicator/index.html"><code>MISOCircularProgressIndicator</code></a> is a progress indicator which can be used to display determinate value or indeterminate value with animations.</p><pre class="swift"><code>// A circular gauge filled at 75% in neutral color with a track displayed with an animation
MISOCircularProgressIndicator(progress: 0.75, status: .neutral)

// A circular gauge without defined value and an accent color
MISOCircularProgressIndicator(status: .accent)
</code></pre><h4>Linear Progress Indicator</h4><p>An <a href="../misolinearprogressindicator/index.html"><code>MISOLinearProgressIndicator</code></a> is a horizontal progress indicator which can be used to display determinate value or indeterminate value animations.</p><pre class="swift"><code>// A horizontal bar filled at 75% in neutral color with a track and reveal animation
MISOLinearProgressIndicator(progress: 0.75, status: .neutral)

// A horizontal bar without defined value and an accent color
MISOLinearProgressIndicator(status: .accent)

// A horizontal bar with a helper text center aligned, a stop indicator (determinate only) and no animations
MISOLinearProgressIndicator(progress: 0.5, stopIndicator: true, helperText: .description("Uploading…"), animated: false)

// A horizontal bar with a helper text with progress information start aligned
// The percentage rendering (symbol, spacing, position) follows the localized wording key
// `core_progressIndicator_percent_value` (e.g. "75%" in English, "75 %" in French, "٪75" in Arabic).
MISOLinearProgressIndicator(progress: 0.5, helperText: .percent(description: "Uploading…", alignment: .start))

// An indeterminate horizontal bar with a helper text start aligned 
MISOLinearProgressIndicator(status: .info, helperText: "Processing…", helperTextAlignment: .start)
</code></pre><h3>Tag</h3><p>An <a href="../misotag/index.html"><code>MISOTag</code></a> is a small element that shows short information like a label, keyword, or category. It helps users quickly find, group, or understand content.</p><pre class="swift"><code>// Text only with neutral status, for emphasized appearance with rounded shape in default size
MISOTag(label: "Label",  status: .neutral(), appearance: .emphasized, shape: .rounded, size: .default)
// Or also
MISOTag(label: "Label")
            
// Tag with negative status with bullet
MISOTag(label: "Label", status: .negative(leading: .bullet)
            
// Tag with neutral status with a custom decorative icon
MISOTag(label: "Label", status: .neutral(image: MISOImage(asset: Image(decorative: "ic_heart"))))
// Flip the icon for RTL layouts using MISOImage.flipped
MISOTag(label: "Label", status: .neutral(image: MISOImage(asset: Image(decorative: "ic_heart"), flipped: true)))

// Tag with neutral status with a raw image (not tinted)
MISOTag(label: "Label", status: .neutral(image: MISOImage(asset: Image("ic_brand"), renderingMode: .original)))

// Tag with accent status with a raw image (not tinted)
MISOTag(label: "Label", status: .accent(image: MISOImage(asset: Image("ic_brand"), renderingMode: .original)))
            
// Text with neutral status with bullet
MISOTag(label: "Label", status: .neutral(bullet: true))
            
// Tag with indeterminate circular progress indicator, with rounded shape in small size
MISOTag(loadingLabel: "Processing...", shape: .rounded, size: .small)

// Tag with determinate circular progress indicator, with rounded shape in default size
MISOTag(loadingLabel: "Processing...", progress: 0.75)
</code></pre><h3>Input Tag</h3><p>An <a href="../misoinputtag/index.html"><code>MISOInputTag</code></a> is a small element that shows short information like a label, keyword, or category, which can be removed or changed on tap.</p><pre class="swift"><code>// Create an input tag
MISOInputTag("Label") {
    // Do something, usually remove itself from a list
}
    
// Show in a list and remove when clicked
var names: [String] = [ "Foo", "Bar", "Wizz" ]
    
ForEach(names, id: \.self) { name in
    MISOInputTag(label: name) {
        if let index = names.firstIndex(of: name) {
            names.remove(at: index)
        }
    }
}
</code></pre></article></noscript><div id="app"></div></body></html>
