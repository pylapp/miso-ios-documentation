<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>MISOListItemAvatar</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="An avatar element that can be used at the leading or trailing position of a list item such as ``doc://MISOComponents/documentation/MISOComponents/MISOStaticListItem`` or ``doc://MISOComponents/documentation/MISOComponents/MISONavigationListItem``." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>MISOListItemAvatar</li></ul><p>Structure</p><h1>MISOListItemAvatar</h1><p>An avatar element that can be used at the leading or trailing position of a list item such as <a href="../misostaticlistitem/index.html"><code>MISOStaticListItem</code></a> or <a href="../misonavigationlistitem/index.html"><code>MISONavigationListItem</code></a>.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>@MainActor struct MISOListItemAvatar</code></pre></section><h2>Overview</h2><p><a href="."><code>MISOListItemAvatar</code></a> displays a circular visual identifier that can represent a user, a contact, or any entity. It supports three content types: a predefined icon, a custom image, or text initials. An optional <a href="../misobadgestandard/index.html"><code>MISOBadgeStandard</code></a> or <a href="../misobadgeicon/index.html"><code>MISOBadgeIcon</code></a> can be attached at the bottom-trailing corner to indicate status.</p><h2>Avatar types</h2><p>The <a href="avatartype/index.html"><code>MISOListItemAvatar.AvatarType</code></a> enum defines the content displayed inside the avatar:</p><ul><li><p><b><code>.icon</code></b>: A predefined person/people icon from the current theme’s resource bundle.</p></li><li><p><b><code>.image(_:)</code></b>: A custom <code>Image</code> asset that fills the avatar circle.</p></li><li><p><b><code>.initials(_:)</code></b>: A short text string (2 characters maximum) rendered centered in the avatar.</p></li></ul><h2>Sizes</h2><p>The <a href="size/index.html"><code>MISOListItemAvatar.Size</code></a> enum defines the available sizes for the avatar:</p><ul><li><p><b><code>.medium</code></b>: The default size, suited for standard list items.</p></li><li><p><b><code>.large</code></b>: A larger variant for increased visual prominence.</p></li><li><p><b><code>.extraLarge</code></b>: The largest variant, typically used for profile-like displays.</p></li></ul><p><b>Note:</b> When the avatar is embedded in a list item with small size (via <a href="../swiftuicore/view/misolistitemsize(_:)/index.html"><code>misoListItemSize(_:)</code></a>), the <code>size</code> parameter is <b>ignored</b> and the avatar is always rendered at its smallest available size.</p><h2>Badge</h2><p>An optional badge <a href="../misobadgestandard/index.html"><code>MISOBadgeStandard</code></a> or <a href="../misobadgeicon/index.html"><code>MISOBadgeIcon</code></a> can be placed at the bottom-trailing corner of the avatar to convey status information (e.g. online presence, notification count). The badge is rendered with a safety-area border matching the theme’s <code>controlItem.colorBadgeSafetyArea</code>.</p><p>The recommended badge sizes per avatar size are:</p><ul><li><p><code>.medium</code> avatar → <code>.extraSmall</code> badge</p></li><li><p><code>.large</code> avatar → <code>.small</code> badge</p></li><li><p><code>.extraLarge</code> avatar → <code>.medium</code> badge</p></li></ul><h2>Code samples</h2><pre class="swift"><code>    // Avatar with predefined icon, medium size
    MISOListItemAvatar(type: .icon, size: .medium)

    // Avatar with a custom image, large size
    MISOListItemAvatar(type: .image(Image("il_placeholder")), size: .large)

    // Avatar with initials, extra large size
    MISOListItemAvatar(type: .initials("AB"), size: .extraLarge)

    // Avatar with icon and a notification badge
    let badgeType = .standard(.init(accessibilityLabel: "Do not disturb", status: .negative, size: .small))
    MISOListItemAvatar(type: .icon, size: .medium, badgeType: badgeType)

    // Avatar with initials and a icon badge with positive status
    let badgeType = .icon(.init(status: .positive, accessibilityLable: "Online", size: .small))
    MISOListItemAvatar(type: .initials("JD"), size: .large, badgeType: badgeType)

    // Usage as leading element in a list item
    MISOStaticListItem(
        data: MISOListItemData(label: "John Doe", description: "Online"),
        leading: .avatar(MISOListItemAvatar(type: .icon, size: .medium))
    )

    // Usage as trailing element in a list item
    MISOStaticListItem(
        data: MISOListItemData(label: "Contact"),
        trailing: .avatar(MISOListItemAvatar(type: .initials("AB"), size: .medium))
    )
</code></pre><h2>Containers alignment</h2><p>The avatar, along with other leading/trailing elements and the text container, can be vertically aligned using the <a href="../swiftuicore/view/misolistitemcontaineralignment(_:)/index.html"><code>misoListItemContainerAlignment(_:)</code></a> view modifier (<code>.center</code> by default, or <code>.top</code>).</p><blockquote class="aside since"><p class="label">Since</p><p>OUDS 3.0.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(type:size:badgetype:accessibilitylabel:)/index.html"><code>init(type: MISOListItemAvatar.AvatarType, size: MISOListItemAvatar.Size, badgeType: MISOListItemAvatar.BadgeType?, accessibilityLabel: String)</code><p>Creates an avatar view to be displayed at the leading or trailing position of a list item such as <a href="../misostaticlistitem/index.html"><code>MISOStaticListItem</code></a> or <a href="../misonavigationlistitem/index.html"><code>MISONavigationListItem</code></a>.</p></a></li></ul><h3>Instance Properties</h3><ul><li><a href="body/index.html"><code>var body: some View</code></a></li></ul><h3>Enumerations</h3><ul><li><a href="avatartype/index.html"><code>enum AvatarType</code><p>The type of content displayed inside the avatar.</p></a></li><li><a href="badgetype/index.html"><code>enum BadgeType</code><p>The type of badge displayed on the avatar.</p></a></li><li><a href="size/index.html"><code>enum Size</code><p>Defines the available sizes for the avatar.</p></a></li></ul></article></noscript><div id="app"></div></body></html>
