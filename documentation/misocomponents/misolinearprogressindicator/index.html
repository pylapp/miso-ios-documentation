<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>MISOLinearProgressIndicator</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="A linear indicator shows the progress of a task using a horizontal line. It can show a specific value (determinate) or just that something is in progress (indeterminate). Best used inside layouts to show progress." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>MISOLinearProgressIndicator</li></ul><p>Structure</p><h1>MISOLinearProgressIndicator</h1><p>A linear indicator shows the progress of a task using a horizontal line. It can show a specific value (determinate) or just that something is in progress (indeterminate). Best used inside layouts to show progress.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>@MainActor struct MISOLinearProgressIndicator</code></pre></section><h2>Mentioned In</h2><ul><li><a href="../indicators/index.html">Indicators</a></li></ul><h2>Variants</h2><p>Two variants are provided:</p><ul><li><p><b>Determinate</b>: the caller provides a <code>progress</code> value in <code>[0, 1]</code>. Values outside this range are coerced. Shows the exact progress of a task, usually as a percentage from 0% to 100%. Provides clear and measurable feedback, helping users understand how long the task will take and reducing uncertainty. Use determinate indicators whenever possible. Avoid indeterminate when progress can be measured, e.g. when the progress value is known (file upload, installation, data sync) or when the system can estimate completion time or percentage.</p></li><li><p><b>Indeterminate</b>: no <code>progress</code> is provided and the indicator loops continuously. Shows that a process is active without indicating exact progress. Used when the system cannot determine how long the task will take. Communicates that the system is working, even without precise data, and prevents users from thinking the interface is frozen. For long loading times (over 5 seconds), additional context must be provided.</p></li></ul><h2>Statuses</h2><ul><li><p><b>Neutral</b>: default status used when progress has no specific semantic meaning. Suitable for generic loading, processing, synchronization or background tasks.</p></li><li><p><b>Accent</b>: used to highlight primary or brand-related actions (uploads, downloads, installations, onboarding).</p></li><li><p><b>Positive</b>: indicates successful progress or a process leading to a successful outcome.</p></li><li><p><b>Info</b>: indicates informational or system-related processes (background synchronization, data retrieval).</p></li><li><p><b>Warning</b>: indicates progress related to an operation that requires user attention or should be monitored.</p></li><li><p><b>Negative</b>: indicates progress related to an error, recovery, cancellation or failure.</p></li></ul><h2>Gap size</h2><ul><li><p><b>default</b>: standard gap between the bar and the track (base Android Material 3 specification).</p></li><li><p><b>small</b>: reduced gap for a more compact appearance.</p></li></ul><h2>Track</h2><ul><li><p><code>true</code> (default): the track is displayed. Recommended when the indicator is shown on its own and needs a clear structure. The track helps define the full range of progress and makes the value easier to read.</p></li><li><p><code>false</code>: the track is hidden. Recommended when the indicator is embedded inside another component (button, tag, toast) or when a more minimal appearance is needed.</p></li></ul><h2>Stop indicator (determinate only)</h2><ul><li><p><code>false</code> (default): no stop indicator is drawn.</p></li><li><p><code>true</code>: a small square (or dot if the theme uses rounded caps) is drawn at the end of the track to identify the end of the range easily. Required by accessibility criteria when the track has a contrast below 3:1 with its container or the surface behind the container.</p></li></ul><p>The stop indicator is only available on the determinate variant, matching the Android Material 3 specification: the indeterminate variant has no meaningful end position for it.</p><h2>Helper text</h2><p>An optional text displayed below the progress bar to provide context or additional information.</p><p>In <b>determinate</b> mode, use <a href="helpertexttype/index.html"><code>MISOLinearProgressIndicator.HelperTextType</code></a> which offers two variants:</p><ul><li><p><b><code>.description(_:)</code></b>: Displays a simple description text without the progress percentage. The <code>alignment</code> parameter controls horizontal alignment (<code>.center</code>, <code>.start</code>, or <code>.end</code>).</p></li><li><p><b><code>.percent(description:alignment:)</code></b>: Displays the progress percentage with an optional description. The percentage value and its <code>%</code> symbol are assembled through the localized wording key <code>core_progressIndicator_percent_value</code>, so the symbol, its spacing and its position follow the typographic rules of the current language (e.g. <code>"75%"</code> in English, <code>"75 %"</code> in French, <code>"٪75"</code> in Arabic).</p><ul><li><p>When <code>alignment</code> is <code>.center</code> (default), only the percentage is shown, centered.</p></li><li><p>When <code>alignment</code> is <code>.start</code>, the percentage is at the leading edge and the description (if provided) at the trailing edge.</p></li><li><p>When <code>alignment</code> is <code>.end</code>, the description (if provided) is at the leading edge and the percentage at the trailing edge.</p></li></ul></li></ul><p>In <b>indeterminate</b> mode, the <code>helperText</code> parameter is a simple <code>String?</code> with a separate <code>helperTextAlignment</code> parameter:</p><ul><li><p><b><code>.center</code></b> (default): The text is centered under the progress bar.</p></li><li><p><b><code>.start</code></b>: The text is aligned to the leading edge.</p></li><li><p><b><code>.end</code></b>: The text is aligned to the trailing edge.</p></li></ul><h2>Animation</h2><ul><li><p><b>Determinate</b>: when <code>animated</code> is <code>true</code> (default), the indicator progressively fills from <code>0</code> to the target <code>progress</code> on first display and animates any subsequent change of <code>progress</code> (based on Android Material 3 specifications). When <code>animated</code> is <code>false</code>, the indicator is displayed instantly at its target value with no animation.</p></li><li><p><b>Indeterminate</b>: the Android Material 3 two-line animation is intrinsic to the mode and cannot be disabled from the call site; there is no <code>animated</code> parameter on the indeterminate initializer.</p></li></ul><p>Animations are always disabled and a static bar filled at 70% is displayed when either <code>accessibilityReduceMotion</code> is <code>true</code> or Low Power Mode is enabled.</p><h2>Code samples</h2><h3>Determinate — Basic usage</h3><pre class="swift"><code>    // Determinate — default (neutral, with track, default gap, reveal animation)
    MISOLinearProgressIndicator(progress: 0.75)

    // Determinate with an accent status, no track and a helper text
    MISOLinearProgressIndicator(progress: 0.5,
                                status: .accent,
                                track: false,
                                helperText: .description("Uploading…"))

    // Description aligned to the end
    MISOLinearProgressIndicator(progress: 0.5, helperText: .description("Uploading...", alignment: .end))

    // Percentage centered (default)
    MISOLinearProgressIndicator(progress: 0.75, helperText: .percent())

    // Percentage with description at start (percentage leading, description trailing)
    MISOLinearProgressIndicator(progress: 0.75,
                                helperText: .percent(description: "of 100 MB", alignment: .start))

    // Indeterminate
    MISOLinearProgressIndicator(status: .info)
    MISOLinearProgressIndicator(status: .accent, helperText: "Processing…")

    // Helper text aligned to the end
    MISOLinearProgressIndicator(status: .info,
                                helperText: "Loading data…",
                                helperTextAlignment: .end)

    // Determinate with accessibility name and state for VoiceOver
    MISOLinearProgressIndicator(progress: 0.75,
                                accessibility: .init(name: "download bar", state: "downloading"))

    // Determinate with accessibility and helper text
    MISOLinearProgressIndicator(progress: 0.5,
                                accessibility: .init(name: "progress bar", state: "step 1 of 4"),
                                helperText: .description("Loading..."))

    // Indeterminate with accessibility
    MISOLinearProgressIndicator(status: .info,
                                accessibility: .init(name: "loading", state: "processing"))
</code></pre><h2>Accessibility considerations</h2><ul><li><p>Use the <code>accessibility</code> parameter to provide a custom name and state for VoiceOver:</p><ul><li><p><code>accessibility.name</code>: The name of the component (e.g., “progress bar”, “download bar”)</p></li><li><p><code>accessibility.state</code>: The state of the component (e.g., “downloading”, “step 1 of 4”)</p></li></ul></li><li><p>VoiceOver reads: <b>[name]. [state]. [helperText] [value]</b>. Example: <i>“download bar. downloading. 75 percent”</i></p></li><li><p>If <code>accessibility</code> is not provided, the behavior is unchanged: only the helper text (if provided) is used as label.</p></li><li><p>In <b>determinate</b> mode, the view exposes the current progress as an accessibility value (percentage) so that Voice Over reads e.g. <i>“75 percent”</i>, and is marked with the <code>.updatesFrequently</code> trait so that assistive technologies know the value is changing. If a <code>helperText</code> is provided, it is exposed as the accessibility label (Voice Over reads e.g. <i>“Uploading. 75 percent”</i>).</p></li><li><p>The indicator never captures <b>Full Keyboard Access</b> focus, as no interaction is possible on a progress indicator. On iOS 17+ / macOS 14+ / visionOS 1+ / watchOS 10+ / tvOS 17+, this is enforced via <code>accessibilityRespondsToUserInteraction(false)</code>; on earlier OS versions, the semantic <code>.isStaticText</code> trait is used.</p></li><li><p>In <b>indeterminate</b> mode without helper text, the view is hidden from Voice Over (<code>.accessibilityHidden(true)</code>) — and therefore also excluded from Full Keyboard Access navigation: there is no readable value to expose. When a <code>helperText</code> is provided, the helper text is exposed as accessibility label so the user still understands the context.</p></li><li><p>Animations are disabled when <code>accessibilityReduceMotion</code> is <code>true</code> or when Low Power Mode is enabled.</p></li></ul><h2>Colored surfaces</h2><p>When placed on an <a href="../misocoloredsurface/index.html"><code>MISOColoredSurface</code></a>, the indicator switches to a <b>monochrome</b> rendering, the <code>status</code> is ignored.</p><blockquote class="aside version"><p class="label">Version</p><p>1.2.0 (Figma component design version)</p></blockquote><blockquote class="aside since"><p class="label">Since</p><p>OUDS 3.0.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(progress:status:track:stopindicator:helpertext:gapsize:animated:accessibility:)/index.html"><code>init(progress: Double, status: MISOProgressIndicatorStatus, track: Bool, stopIndicator: Bool, helperText: MISOLinearProgressIndicator.HelperTextType?, gapSize: MISOProgressIndicatorGapSize, animated: Bool, accessibility: MISOAccessibilityConfiguration?)</code><p>Creates a <b>determinate</b> linear progress indicator.</p></a></li><li><a href="init(status:track:helpertext:helpertextalignment:gapsize:accessibility:)/index.html"><code>init(status: MISOProgressIndicatorStatus, track: Bool, helperText: String?, helperTextAlignment: MISOLinearProgressIndicator.HelperTextAlignment, gapSize: MISOProgressIndicatorGapSize, accessibility: MISOAccessibilityConfiguration?)</code><p>Creates an <b>indeterminate</b> linear progress indicator.</p></a></li></ul><h3>Instance Properties</h3><ul><li><a href="body/index.html"><code>var body: some View</code></a></li></ul><h3>Enumerations</h3><ul><li><a href="helpertextalignment/index.html"><code>enum HelperTextAlignment</code><p>The alignment of the helper text for the linear progress indicator.</p></a></li><li><a href="helpertexttype/index.html"><code>enum HelperTextType</code><p>The helper text can be added in <b>determinate</b> indicator</p></a></li></ul></article></noscript><div id="app"></div></body></html>
