code>nil</code>.</p></dd><dt>helperTextAlignment</dt><dd><p>The alignment of the helper text. Defaults to <code>.center</code>. Ignored if <code>helperText</code> is <code>nil</code>.</p></dd><dt>gapSize</dt><dd><p>The size of the gap between the indicator and the track. Defaults to <a href="../../misoprogressindicatorgapsize/default/index.html"><code>MISOProgressIndicatorGapSize.default</code></a>.</p></dd><dt>accessibility</dt><dd><p>Optional accessibility configuration for VoiceOver. Defaults to <code>nil</code>.</p></dd></dl><h2>Discussion</h2><p>The Android Material 3 two-line animation is intrinsic to this mode and is always played, except when <code>accessibilityReduceMotion</code> is on or when Low Power Mode is enabled — in which case a static bar filled at 70% is displayed automatically.</p></article></noscript><div id="app"></div></body></html>
