<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>MISOListItemLeading</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="Defines the elements that can be displayed at the leading position (before the texts) of a list item such as ``doc://MISOComponents/documentation/MISOComponents/MISOStaticListItem`` or ``doc://MISOComponents/documentation/MISOComponents/MISONavigationListItem``." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>MISOListItemLeading</li></ul><p>Enumeration</p><h1>MISOListItemLeading</h1><p>Defines the elements that can be displayed at the leading position (before the texts) of a list item such as <a href="../misostaticlistitem/index.html"><code>MISOStaticListItem</code></a> or <a href="../misonavigationlistitem/index.html"><code>MISONavigationListItem</code></a>.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>@frozen enum MISOListItemLeading</code></pre></section><h2>Overview</h2><p>The leading element provides visual context or identification alongside the textual content of the list item. Only one leading element can be set at a time.</p><p><b>Note:</b> When using <a href="../misonavigationlistitem/index.html"><code>MISONavigationListItem</code></a> with an indicator type of <code>.previous</code>, the leading element is automatically hidden.</p><h2>Available options</h2><ul><li><p><code>icon</code>: A status or custom icon (see <a href="../misolistitemicon/index.html"><code>MISOListItemIcon</code></a>).</p></li><li><p><code>image</code>: A static image asset (see <a href="../misolistitemimage/index.html"><code>MISOListItemImage</code></a>).</p></li><li><p><code>flag</code>: A country flag image (see <a href="../misolistitemflag/index.html"><code>MISOListItemFlag</code></a>).</p></li><li><p><code>avatar</code>: An avatar with icon, initials, or image (see <a href="../misolistitemavatar/index.html"><code>MISOListItemAvatar</code></a>).</p></li><li><p><code>slot</code>: Any custom SwiftUI view, e.g. any bespoke view.</p></li></ul><h2>Code samples</h2><pre class="swift"><code>    // Leading with a status icon
    let icon = MISOListItemIcon(type: .info, size: .medium)
    MISOStaticListItem(
        data: MISOListItemData(label: "Label"),
        leading: .icon(icon)
    )

    // Leading with an image
    let image = MISOListItemImage(asset: Image("il_placeholder"), size: .medium)
    MISOStaticListItem(
        data: MISOListItemData(label: "Label"),
        leading: .image(image)
    )

    // Leading with a country flag
    MISOStaticListItem(
        data: MISOListItemData(label: "France"),
        leading: .flag(.init(asset: Image("il_flag_fr"), description: "France"))
    )

    // Leading with an avatar
    let avatar = MISOListItemAvatar(type: .icon, size: .medium)
    MISOStaticListItem(
        data: MISOListItemData(label: "Profile"),
        leading: .avatar(avatar)
    )

    // Leading with a custom view, e.g. a gauge showing a remaining SMS credit
    MISOStaticListItem(
        data: MISOListItemData(label: "SMS credit"),
        leading: .slot {
            MISOCircularProgressIndicator(progress: 0.75)
        }
    )
</code></pre><h2>Media appearance</h2><p>Images can be displayed with rounded corners using the  <a href="../swiftuicore/view/misolistitemroundedmedia(_:)/index.html"><code>misoListItemRoundedMedia(_:)</code></a> view modifier.</p><h2>Small size behavior</h2><p>When the list item is displayed in small size (via <a href="../swiftuicore/view/misolistitemsize(_:)/index.html"><code>misoListItemSize(_:)</code></a>), leading elements such as avatars and icons are rendered in their smallest available size. The <code>.slot</code> element is not resized automatically and is <b>not displayed</b> in small size.</p><blockquote class="aside since"><p class="label">Since</p><p>OUDS 3.0.0</p></blockquote><h2>Topics</h2><h3>Enumeration Cases</h3><ul><li><a href="avatar(_:)/index.html"><code>case avatar(MISOListItemAvatar)</code><p>An avatar displayed at the leading position.</p></a></li><li><a href="flag(_:)/index.html"><code>case flag(MISOListItemFlag)</code><p>A country flag image displayed at the leading position.</p></a></li><li><a href="icon(_:)/index.html"><code>case icon(MISOListItemIcon)</code><p>A status or custom icon displayed at the leading position.</p></a></li><li><a href="image(_:)/index.html"><code>case image(MISOListItemImage)</code><p>A static image asset displayed at the leading position.</p></a></li><li><a href="slot(_:)-swift.enum.case/index.html"><code>case slot(AnyView)</code><p>A custom SwiftUI view displayed at the leading position.</p></a></li></ul><h3>Type Methods</h3><ul><li><a href="slot(_:)-swift.type.method/index.html"><code>static func slot(() -&gt; some View) -&gt; MISOListItemLeading</code><p>Creates a <a href="slot(_:)-swift.type.method/index.html"><code>slot(_:)</code></a> leading element from a <code>@ViewBuilder</code> closure.</p></a></li></ul></article></noscript><div id="app"></div></body></html>
