does not change since iOS 26</p></li><li><p>normal / unselected tab item color can be changed for both image and text only for iOS lower than 26</p></li><li><p>with iOS 26 no token of color are applied on unselected / normal tab item because only the image will be changed and not the text making theme not readable in dark color scheme</p></li></ul><p>In addition the badges colors will be the same and cannot be changed (except with token definition). These particular badges do not rely on MISO badge components.</p><blockquote class="aside since"><p class="label">Since</p><p>OUDS 3.0.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init()/index.html"><code>init()</code></a></li></ul><h3>Instance Methods</h3><ul><li><a href="body(content:)/index.html"><code>func body(content: MISOTabBarViewModifier.Content) -&gt; some View
