<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>toolBarTop(_:hasLargeTitle:subtitle:leadingItems:principalItem:trailingItems:)</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="Creates a top toolbar with a title, optional subtitle (for iOS 26+), leading, principal and trailing items." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../index.html">Components</a></li><li><a href="../index.html">MISOSHStack</a></li><li>toolBarTop(_:hasLargeTitle:subtitle:leadingItems:principalItem:trailingItems:)</li></ul><p>Instance Method</p><h1>toolBarTop(_:hasLargeTitle:subtitle:leadingItems:principalItem:trailingItems:)</h1><p>Creates a top toolbar with a title, optional subtitle (for iOS 26+), leading, principal and trailing items.</p><ul id="availability"><li>iOS 15.0+</li><li>visionOS 1.0+</li></ul><pre><code>@MainActor func toolBarTop(_ title: String, hasLargeTitle: Bool = false, subtitle: String? = nil, @MISOToolBarItemsBuilder leadingItems: @escaping () -&gt; [MISOToolBarItem] = { [] }, principalItem: MISOToolBarItem? = nil, @MISOToolBarItemsBuilder trailingItems: @escaping () -&gt; [MISOToolBarItem] = { [] }) -&gt; some View
</code></pre></section><h2>Parameters</h2><dl><dt>title</dt><dd><p>The toolbar title. Prefer a non-empty string.</p></dd><dt>hasLargeTitle</dt><dd><p>If <i>title</i> must be displayed in large mode or not, <i>false</i> by default. If large mode, the <i>subtitle</i> is not displayed for iOS &lt; 26.</p></dd><dt>subtitle</dt><dd><p>Optional <i>subtitle</i> displayed below the <i>title</i> if iOS 26+, <i>nil</i> by default. <b>Never displayed if <code>principalItem</code> is not <i>nil</i>.</b></p></dd><dt>leadingItems</dt><dd><p>The items displayed on the leading side, <i>empty</i> by default.</p></dd><dt>principalItem</dt><dd><p>The item displayed in the principal (center) position, <i>nil</i> by default. Only one item is supported. If set, the <i>title</i> is displayed only if <code>hasLargeTitle</code> is <code>true</code>, and the <i>subtitle</i> is never displayed.</p></dd><dt>trailingItems</dt><dd><p>The items displayed on the trailing side, <i>empty</i> by default.</p></dd></dl><h2>Discussion</h2><p>The view which contains this <i>top toolbar</i> must be placed inside a <code>NavigationView</code> or <code>NavigationStack</code>, otherwise th top toolbar won’t appear..</p><p>There must be only one <i>top toolbar</i>.</p><p><b>Warning</b>: If an item is placed in principal position, the subtitle is never displayed (whatever <code>hasLargeTitle</code> is), because SwiftUI’s <code>.principal</code> placement only replaces the inline compact bar title, not <code>.navigationSubtitle()</code> (iOS 26+), which would otherwise keep rendering next to the item with no visible title next to it. The title itself is displayed only if <code>hasLargeTitle</code> is <code>true</code> (in that case it appears below the bar, in large title mode, not inside it).</p></article></noscript><div id="app"></div></body></html>
