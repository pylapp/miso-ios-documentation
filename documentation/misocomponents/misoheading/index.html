<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>MISOHeading</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="Text component used to structure the hierarchy of a screen. Four sizes are available; the largest (`.large`) can optionally display a marker, i.e. a small brand-coloured rectangle rendered below the text (when the current theme declares it supports one)." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>MISOHeading</li></ul><p>Structure</p><h1>MISOHeading</h1><p>Text component used to structure the hierarchy of a screen. Four sizes are available; the largest (<code>.large</code>) can optionally display a <b>marker</b>, i.e. a small brand-coloured rectangle rendered below the text (when the current theme declares it supports one).</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>@MainActor struct MISOHeading</code></pre></section><h2>Mentioned In</h2><ul><li><a href="../foundations/index.html">Foundations</a></li></ul><h2>Sizes</h2><ul><li><p><b>XLarge</b>: The largest heading, useful for page titles.</p></li><li><p><b>Large (by default)</b>: The default heading. Only this size supports the marker and the <i>colored substring</i> feature.</p></li><li><p><b>Medium</b>: A medium heading, typically used for section titles.</p></li><li><p><b>Small</b>: The smallest heading, used for subsection titles.</p></li></ul><h2>Marker</h2><p>Some themes (like <i>BlueCoat</i>) declare that a <i>large</i> heading is decorated with a small coloured rectangle below the text, i.e. the <b>marker</b>. Other themes may not use a marker at all but something else.</p><h2>Coloring a substring</h2><p>A dedicated initializer accepts a <code>coloredText</code> sub-string instead of a marker. This is useful to emphasize a specific word inside a heading (for example a brand name). This feature is only meaningful for <code>size == .large</code>; on other sizes a warning is logged and the text is rendered plain.</p><blockquote class="aside warning"><p class="label">Warning</p><p>Not all themes provide a valid <code>theme.colors.contentBrandSecondary</code> (some themes may mark the token as forbidden). When the token is forbidden the coloring is skipped.</p></blockquote><h2>Code samples</h2><pre class="swift"><code>    // Simple raw string
    MISOHeading(text: "Title")

    // Large heading with a marker (rendered only when the theme supports it)
    MISOHeading(text: "Section title", size: .large, hasMarker: true)

    // Smaller heading (marker parameter would be ignored here)
    MISOHeading(text: "Sub-section", size: .medium)

    // Heading with a brand-coloured word
    MISOHeading(text: "Welcome to MISO", coloredText: "MISO")

    // Localizable from a bundle
    MISOHeading(LocalizedStringKey("section_title"), bundle: Bundle.module, size: .large)
</code></pre><h2>Accessibility</h2><p>The component adds the <code>.isHeader</code> accessibility trait so that assistive technologies (like <i>VoiceOver</i>) announce the text as a header. When a marker is drawn, it is hidden from assistive technologies (decorative).</p><blockquote class="aside version"><p class="label">Version</p><p>1.0.0 (Figma component design version)</p></blockquote><blockquote class="aside since"><p class="label">Since</p><p>OUDS 3.0.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(_:tablename:bundle:coloredtext:)/index.html"><code>init(LocalizedStringKey, tableName: String?, bundle: Bundle, coloredText: String)</code><p>Creates a large heading with a <i>sub-string</i> rendered with <code>theme.colors.contentBrandSecondary</code>, looking up the text in a bundle for localization.</p></a></li><li><a href="init(_:tablename:bundle:size:hasmarker:)/index.html"><code>init(LocalizedStringKey, tableName: String?, bundle: Bundle, size: MISOHeading.Size, hasMarker: Bool)</code><p>Creates a heading with a localized <code>LocalizedStringKey</code>, looking up the key in the given bundle.</p></a></li><li><a href="init(text:coloredtext:)/index.html"><code>init(text: String, coloredText: String)</code><p>Creates a large heading with a <i>sub-string</i> rendered with <code>theme.colors.contentBrandSecondary</code>. This variant is meant for <code>size == .large</code>; passing another size will log a warning and render the text plain.</p></a></li><li><a href="init(text:size:hasmarker:)/index.html"><code>init(text: String, size: MISOHeading.Size, hasMarker: Bool)</code><p>Creates a heading with a raw <code>String</code>.</p></a></li></ul><h3>Instance Properties</h3><ul><li><a href="body/index.html"><code>var body: some View</code></a></li></ul><h3>Enumerations</h3><ul><li><a href="size/index.html"><code>enum Size</code><p>Defines the size of the heading text.</p></a></li></ul></article></noscript><div id="app"></div></body></html>
