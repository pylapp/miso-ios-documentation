</code></pre><blockquote class="aside version"><p class="label">Version</p><p>1.1.1 (Figma component design version)</p></blockquote><blockquote class="aside since"><p class="label">Since</p><p>OUDS 1.3.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(_:tablename:bundle:status:)/index.html"><code>init(LocalizedStringKey, tableName: String?, bundle: Bundle, status: MISOAlertStatus)</code><p>Creates an inline alert with a localized label, looking up the key in the given bundle.</p></a></li><li><a href="init(label:status:)/index.html"><code>init(label: String, status: MISOAlertStatus)</code><p>Creates a inline alert.</p></a></li></ul><h3>Instance Properties</h3><ul><li><a href="body/index.html"><code>var body: some View</code></a></li></ul></article></noscript><div id="app"></div></body></html>
