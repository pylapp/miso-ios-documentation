<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>MISOListItemSize</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="Defines the size of a list item such as ``doc://MISOComponents/documentation/MISOComponents/MISOStaticListItem`` or ``doc://MISOComponents/documentation/MISOComponents/MISONavigationListItem``." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>MISOListItemSize</li></ul><p>Enumeration</p><h1>MISOListItemSize</h1><p>Defines the size of a list item such as <a href="../misostaticlistitem/index.html"><code>MISOStaticListItem</code></a> or <a href="../misonavigationlistitem/index.html"><code>MISONavigationListItem</code></a>.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>@frozen enum MISOListItemSize</code></pre></section><h2>Overview</h2><p>The size affects the padding, the visibility of certain text fields, and the size of leading/trailing elements within the list item.</p><p>Use the <a href="../swiftuicore/view/misolistitemsize(_:)/index.html"><code>misoListItemSize(_:)</code></a> view modifier to apply the size on list items.</p><h2>Code samples</h2><pre class="swift"><code>    // Standard size (default)
    MISOStaticListItem(data: MISOListItemData(label: "Label"))
        .misoListItemSize(.standard)

    // Small size — overline and extraLabel are hidden,
    // avatars and icons use their smallest variant
    MISOStaticListItem(data: MISOListItemData(label: "Label"))
        .misoListItemSize(.small)
</code></pre><blockquote class="aside since"><p class="label">Since</p><p>OUDS 3.0.0</p></blockquote><h2>Topics</h2><h3>Enumeration Cases</h3><ul><li><a href="default/index.html"><code>case `default`</code><p>The default (i.e. standard) size of the list item. All text fields and elements are displayed at their normal size.</p></a></li><li><a href="small/index.html"><code>case small</code><p>The small (compact) size of the list item.</p></a></li></ul></article></noscript><div id="app"></div></body></html>
