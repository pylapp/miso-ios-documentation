<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>MISODisplay</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="Text component providing the largest typography styles of the design system. It is used for the most prominent titles like hero sections, splash screens or top-level page headlines." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>MISODisplay</li></ul><p>Structure</p><h1>MISODisplay</h1><p>Text component providing the largest typography styles of the design system. It is used for the most prominent titles like hero sections, splash screens or top-level page headlines.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>@MainActor struct MISODisplay</code></pre></section><h2>Mentioned In</h2><ul><li><a href="../foundations/index.html">Foundations</a></li></ul><h2>Sizes</h2><p>Three sizes are proposed:</p><ul><li><p><b>Large (by default)</b>: The largest display style, reserved for very impactful headlines.</p></li><li><p><b>Medium</b>: A slightly smaller display style.</p></li><li><p><b>Small</b>: The smallest display style, useful when large titles are needed on constrained layouts.</p></li></ul><h2>Code samples</h2><pre class="swift"><code>    // Simple raw string
    MISODisplay(text: "Woy!")

    // Explicit size
    MISODisplay(text: "Woy!", size: .medium)

    // Localizable from a bundle
    MISODisplay(LocalizedStringKey("welcome_title_wording_key"), bundle: Bundle.module)
    MISODisplay(LocalizedStringKey("welcome_title_wording_key"), bundle: Bundle.module, size: .small)
</code></pre><h2>Accessibility</h2><p>The component adds the <code>.isHeader</code> accessibility trait so that assistive technologies (like <i>VoiceOver</i>) announce the text as a header.</p><blockquote class="aside version"><p class="label">Version</p><p>1.0.0 (Figma component design version)</p></blockquote><blockquote class="aside since"><p class="label">Since</p><p>OUDS 3.0.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(_:tablename:bundle:size:)/index.html"><code>init(LocalizedStringKey, tableName: String?, bundle: Bundle, size: MISODisplay.Size)</code><p>Creates a display text with a localized <code>LocalizedStringKey</code>, looking up the key in the given bundle.</p></a></li><li><a href="init(text:size:)/index.html"><code>init(text: String, size: MISODisplay.Size)</code><p>Creates a display text with a raw <code>String</code>.</p></a></li></ul><h3>Instance Properties</h3><ul><li><a href="body/index.html"><code>var body: some View</code></a></li></ul><h3>Enumerations</h3><ul><li><a href="size/index.html"><code>enum Size</code><p>Defines the size of the display text.</p></a></li></ul></article></noscript><div id="app"></div></body></html>
