<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>MISOTabView</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="A tab view component that accepts native SwiftUI `Tab` items (iOS 18+) while applying the full MISO tab bar appearance — colors, typography, top divider and selected-tab indicator — just like ``doc://MISOComponents/documentation/MISOComponents/MISOTabBar``." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>MISOTabView</li></ul><p>Structure</p><h1>MISOTabView</h1><p>A tab view component that accepts native SwiftUI <code>Tab</code> items (iOS 18+) while applying the full MISO tab bar appearance — colors, typography, top divider and selected-tab indicator — just like <a href="../misotabbar/index.html"><code>MISOTabBar</code></a>.</p><ul id="availability"><li>iOS 18.0+</li><li>macOS 15.0+</li><li>visionOS 2.0+</li></ul><pre><code>@MainActor struct MISOTabView&lt;Content&gt; where Content : TabContent, Content.TabValue == Int</code></pre></section><h2>Overview</h2><p>Use <a href="."><code>MISOTabView</code></a> instead of <a href="../misotabbar/index.html"><code>MISOTabBar</code></a> when you need iOS 18+ <code>Tab</code>-based API such as positional <code>Tab("Label", image:) { }</code> items with a selection binding or rules like <code>Tab(role: .search)</code>. For apps targeting iOS 15–17, use <a href="../misotabbar/index.html"><code>MISOTabBar</code></a> instead. When you need <code>Tab(role: .search)</code> on iOS 26+, <b>with Liquid Glass enabled</b>, use <a href="../misoliquidglasstabview/index.html"><code>MISOLiquidGlassTabView</code></a> instead.</p><h2>Selection binding</h2><p>A <code>Binding&lt;Int&gt;</code> is always required and always kept in sync, regardless of the OS version. For iOS 18 or iOS 26 without Liquid Glass, also pass <code>count:</code> (the number of tabs) so the selected-tab indicator can be positioned. Each <code>Tab</code> must carry an explicit <code>value: Int</code> matching the <code>selectedTab</code> binding. For iOS 26+ with Liquid Glass, use <a href="../misoliquidglasstabview/index.html"><code>MISOLiquidGlassTabView</code></a>.</p><h2>Appearances</h2><p>iOS 26 brings Liquid Glass. The same rules as <a href="../misotabbar/index.html"><code>MISOTabBar</code></a> apply:</p><ul><li><p>Background and unselected item colors are applied for iOS lower than 26.</p></li><li><p>On iOS 26+ with Liquid Glass enabled, only the selected accent color is applied.</p></li><li><p>The top divider and selected-tab indicator are shown for iOS 18 (portrait iPhone only for the indicator) and hidden under Liquid Glass.</p></li></ul><h2>Platform considerations</h2><ul><li><p>Tailored for iOS and iPadOS. Requires iOS 18+.</p></li><li><p>On macOS 15+ and visionOS 2+: a bare <code>TabView(selection:)</code> is rendered without UIKit styling.</p></li><li><p>Not available on watchOS or tvOS.</p></li></ul><h2>Guidelines</h2><p>MISO guidelines recommend using tab bar item images at <b>26 × 26 pt</b>.</p><h2>Code samples</h2><pre class="swift"><code>// iOS 18 and 26 without Liquid Glass: binding + count required for the selected-tab indicator
@State private var selectedTab = 0

MISOTabView(selectedTab: $selectedTab, count: 4) {
    Tab("first_tab_label", image: "first-tab-image", value: 0) { FirstView() }
    Tab("second_tab_label", image: "second-tab-image", value: 1) { SecondView() }
    Tab("third_tab_label", image: "third-tab-image", value: 2) { ThirdView() }
    Tab(value: 3, role: .search) { SearchView() }
}
</code></pre><pre class="swift"><code>// iOS 26+ with Liquid Glass enabled: binding without count (no custom indicator)
// value: is still required — use MISOLiquidGlassTabView for Tab without value: or Tab(role:)
@State private var selectedTab = 0

if #available(iOS 26, *) {
    MISOTabView(selectedTab: $selectedTab) {
        Tab("first_tab_label", image: "first-tab-image", value: 0) { FirstView() }
        Tab("second_tab_label", image: "second-tab-image", value: 1) { SecondView() }
        Tab("third_tab_label", image: "third-tab-image", value: 2) { ThirdView() }
    }
}
</code></pre><blockquote class="aside version"><p class="label">Version</p><p>1.0.0</p></blockquote><blockquote class="aside since"><p class="label">Since</p><p>OUDS 3.0.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(selectedtab:content:)/index.html"><code>init(selectedTab: Binding&lt;Int&gt;, content: () -&gt; Content)</code><p>Creates an <code>MISOTabView</code> for iOS 26+ (Liquid Glass enabled).</p></a></li><li><a href="init(selectedtab:count:content:)/index.html"><code>init(selectedTab: Binding&lt;Int&gt;, count: UInt8, content: () -&gt; Content)</code><p>Creates an <code>MISOTabView</code> for iOS 18 and iOS 26 with Liquid Glass disabled.</p></a></li></ul><h3>Instance Properties</h3><ul><li><a href="body/index.html"><code>var body: some View</code></a></li></ul></article></noscript><div id="app"></div></body></html>
