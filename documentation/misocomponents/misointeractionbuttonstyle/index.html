<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>MISOInteractionButtonStyle</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="The SwiftUI `ButtonStyle` to compute the interaction state ``doc://MISOComponents/documentation/MISOComponents/MISOButtonInteractionState`` and send it to the provided content builder. To compute this state, some elements are needed:" name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>MISOInteractionButtonStyle</li></ul><p>Structure</p><h1>MISOInteractionButtonStyle</h1><p>The SwiftUI <code>ButtonStyle</code> to compute the interaction state <a href="../misobuttoninteractionstate/index.html"><code>MISOButtonInteractionState</code></a> and send it to the provided content builder. To compute this state, some elements are needed:</p><pre><code>@MainActor struct MISOInteractionButtonStyle&lt;Content&gt; where Content : View</code></pre></section><h2>Overview</h2><ul><li><p>the <code>isHover</code> flag get from the <code>onHover</code> added on the <code>content</code></p></li><li><p>the <code>isPressed</code> flag get from <code>ButtonStyle.Configuration</code></p></li><li><p>the <code>isEnabled</code> flag get from the <code>@Environment</code></p></li><li><p>the <code>isReadOnly</code> flag provided by the init function.</p></li></ul><h2>Code samples</h2><pre class="swift"><code>struct MyButton&lt;Content&gt;: View where Content: View {

    let isReadOnly: Bool
    let action: () -&gt; Void
    @ViewBuilder let content: (MISOButtonInteractionState) -&gt; Content

    var body: some View {
        Button("") {
            if !isReadOnly {
                action()
            }
        }
        // Will defined the interaction state for the button depending to the OS
        .buttonStyle(MISOInteractionButtonStyle(isReadOnly: isReadOnly, content: content))
    }
}

// Then call
MyButton(isReadOnly: isReadOnly) {
    // Toggle action
} content: { interactionState in
    // Change the layout depending to the interaction state
    SomeComponentLayout(interactionState: interactionState)
}
